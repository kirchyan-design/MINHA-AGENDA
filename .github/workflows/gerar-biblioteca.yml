name: Gerar Biblioteca (50 livros em PDF)

# Roda à mão: Actions > Gerar Biblioteca > Run workflow.
# Baixa 50 livros em português de domínio público (Projeto Gutenberg), cria um PDF de cada um
# na pasta Biblioteca/ e atualiza Biblioteca/livros.json. O app lê esses arquivos no menu BIBLIOTECA.
on:
  workflow_dispatch:

jobs:
  gerar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar reportlab
        run: pip install reportlab
      - name: Gerar os PDFs
        run: python3 Biblioteca/gerar-livros.py
      - name: Salvar no repositório
        run: |
          git config user.name "biblioteca-bot"
          git config user.email "biblioteca-bot@users.noreply.github.com"
          git add Biblioteca
          git diff --cached --quiet || git commit -m "Biblioteca: 50 livros em PDF"
          git push
