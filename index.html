<style>
:root{--bg:#f1f5f7;--sf:#fff;--ink:#14232e;--mute:#5d6f7c;--ac:#0f7b8a;--acs:#dff1f3;--ln:#dbe4ea;--ok:#2f9e6b;--rd:#c8483c;--onac:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a21;--sf:#172630;--ink:#e8f0f4;--mute:#8fa3b0;--ac:#4fc3d1;--acs:#1b3a44;--ln:#263a46;--ok:#4cc58d;--rd:#e8776b;--onac:#06232a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a21;--sf:#172630;--ink:#e8f0f4;--mute:#8fa3b0;--ac:#4fc3d1;--acs:#1b3a44;--ln:#263a46;--ok:#4cc58d;--rd:#e8776b;--onac:#06232a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
main{max-width:640px;margin:0 auto;padding:20px 16px}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;gap:12px}
h1{font:800 30px/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em;margin:0}
h1 span{color:var(--ac)}
.hoje{color:var(--mute);font-size:14px;text-align:right;text-transform:capitalize}
h2{font:700 20px/1.2 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 12px}
h3{font:600 14px/1.2 Figtree,sans-serif;color:var(--mute);margin:18px 0 8px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
input,textarea,button{font:inherit;color:inherit}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px 12px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
textarea{resize:vertical;min-height:110px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac);flex:none;padding:0}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:var(--onac);font-weight:600}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) button.pri{color:#06232a}}
button.ghost{background:transparent;color:var(--mute);padding:6px 8px;font-weight:500}
button.ghost:hover{color:var(--rd)}
button.sec{background:var(--acs);color:var(--ac)}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}
.item.done .t{text-decoration:line-through;color:var(--mute)}
.hora{font:700 13px "Bricolage Grotesque",sans-serif;color:var(--ac);min-width:46px}
.vazio{color:var(--mute);text-align:center;padding:22px 8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;width:100%;max-width:640px}
nav button{flex:1;background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;padding:6px 2px;font-weight:500}
nav button b{font-size:20px;font-weight:400;line-height:1}
nav button.on{color:var(--ac);background:var(--acs)}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-h strong{font:700 18px "Bricolage Grotesque",sans-serif;text-transform:capitalize}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dw{text-align:center;color:var(--mute);font-size:12px;padding:4px 0}
.d{aspect-ratio:1;border-radius:10px;background:transparent;color:var(--ink);padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:500;position:relative}
.d.out{opacity:.3}
.d.hj{border:2px solid var(--ac)}

let LOGOS={};try{const r=localStorage.getItem('minha-agenda-logos');if(r)LOGOS=JSON.parse(r)||{}}catch(e){}
let FOTOS={},dimgs=[],dimgsFor=null;try{const r=localStorage.getItem('minha-agenda-fotos');if(r)FOTOS=JSON.parse(r)||{}}catch(e){}
const saveFotos=()=>{try{localStorage.setItem('minha-agenda-fotos',JSON.stringify(FOTOS));return true}catch(e){return false}};
function gcFotos(){const used=new Set();Object.values(S.diary).forEach(d=>(d.imgs||[]).forEach(i=>used.add(i)));let ch=false;Object.keys(FOTOS).forEach(k=>{if(!used.has(k)){delete FOTOS[k];ch=true}});if(ch)saveFotos()}
const save=()=>{let ok=true;try{localStorage.setItem('minha-agenda',JSON.stringify(S))}catch(e){ok=false}gcFotos();try{schedSoon()}catch(e){}return ok};
let tab='inicio',sel=HOJE,mes=new Date(),mood='',dsel=HOJE,calSub='cal',edPl=null,plSub='reg',plAno='todos',plQuick=null,plOpen={},plQuickH=null,edHosp=null,hpCor=null,hpOpen={};
const TABS=[['inicio','🏠','Início'],['agenda','📋','Agenda'],['cal','📅','Calendário'],['notas','📝','Notas'],['diario','📖','Diário'],['compras','🛒','Compras'],['carteira','💰','Carteira']];


function nav(){$('#nav').innerHTML=TABS.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join('')}
function go(t){tab=t;dimgsFor=null;edName=false;cEd=null;nav();render();window.scrollTo(0,0)}

/* ---------- Agenda ---------- */
function evItem(e){if(e.id===edEv)return evEdit(e);return `<div class="item ${e.done?'done':''}"><input type="checkbox" ${e.done?'checked':''} onchange="togEv('${e.id}')" aria-label="Concluir"><span class="hora">${e.time||'—'}</span><span class="t">${esc(e.title)}</span><button class="ghost" onclick="edEv='${e.id}';render()" aria-label="Editar">✎</button><button class="ghost" onclick="delEv('${e.id}')" aria-label="Excluir">✕</button></div>`}
function addEv(dateId,titleId,timeId){const t=$('#'+titleId).value.trim();if(!t){$('#'+titleId).focus();return}
 S.ev.push({id:uid(),title:t,date:dateId?$('#'+dateId).value:sel,time:$('#'+timeId).value,done:false});save();render()}
function togEv(id){const e=S.ev.find(x=>x.id===id);e.done=!e.done;save();render()}
function delEv(id){S.ev=S.ev.filter(x=>x.id!==id);save();render()}
const sortEv=a=>a.sort((x,y)=>(x.date+(x.time||'99')).localeCompare(y.date+(y.time||'99')));
function vAgenda(){
 const fut=sortEv(S.ev.filter(e=>e.date>=HOJE)),pas=sortEv(S.ev.filter(e=>e.date<HOJE)).reverse().slice(0,5);
 const grp=l=>{const g={};l.forEach(e=>(g[e.date]=g[e.date]||[]).push(e));return Object.keys(g).map(d=>`<h3>${d===HOJE?'Hoje':fmt(d)}</h3><div class="card">${g[d].map(evItem).join('')}</div>`).join('')};
 return `<h2>Agenda</h2><div class="card"><input id="at" placeholder="Novo compromisso" onkeydown="if(event.key==='Enter')addEv('ad','at','ah')"><div class="row" style="margin-top:8px"><input type="date" id="ad" value="${HOJE}"><input type="time" id="ah"><button onclick="addEv('ad','at','ah')">Adicionar</button></div></div>`
 +(fut.length?grp(fut):'<div class="vazio">Nenhum compromisso à frente. Adicione o primeiro acima.</div>')
 +(pas.length?'<h3>Anteriores</h3>'+`<div class="card">${pas.map(evItem).join('')}</div>`:'')}

/* ---------- Calendário ---------- */
const shiftIco=p=>{const h=(mins(p.ent)||0)/60;return h>=5&&h<17?'☀️':'🌙'};
const mins=t=>{const a=String(t||'').split(':').map(Number);return a.length<2||isNaN(a[0])||isNaN(a[1])?null:a[0]*60+a[1]};
function durMin(p){const a=mins(p.ent),b=mins(p.sai);if(a==null||b==null)return 0;let d=b-a;if(d<=0)d+=1440;return d}
const fmtDur=m=>{const h=Math.floor(m/60),r=m%60;return h+'h'+(r?String(r).padStart(2,'0'):'')};
const cruza=p=>{const a=mins(p.ent),b=mins(p.sai);return a!=null&&b!=null&&b<=a};
const plSort=(a,b)=>(a.date+a.ent).localeCompare(b.date+b.ent);
function calGrid(kind){
 const y=mes.getFullYear(),m=mes.getMonth(),off=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
 let h=['D','S','T','Q','Q','S','S'].map(d=>`<div class="dw">${d}</div>`).join('');
 for(let i=0;i<off+n;i++){
  if(i<off){h+='<div></div>';continue}
  const d=i-off+1,k=iso(new Date(y,m,d)),pls=S.pl.filter(p=>p.date===k),hs=kind==='pl'?[...new Set(pls.map(p=>p.hosp).filter(Boolean))].map(hospBy).filter(Boolean):[];
  const inner=kind==='pl'?(pls.length?`<span class="pmk">${pls.slice(0,2).map(shiftIco).join('')}</span>`+(hs.length?`<span class="hds">${hs.slice(0,3).map(hd).join('')}</span>`:''):''):`<span class="dots">${S.ev.some(e=>e.date===k)?'<i></i>':''}${S.diary[k]?'<i class="dr"></i>':''}${pls.length?'<i class="pl"></i>':''}</span>`;
  h+=`<button class="d ${k===HOJE?'hj':''} ${k===sel?'sel':''} ${kind==='pl'&&pls.length?'plt':''}" ${hs[0]?`data-c="${hs[0].cor}"`:''} onclick="${kind==='pl'?`tapPl('${k}')`:`sel='${k}';edPl=null;render()`}" aria-label="Dia ${d}">${d}${inner}</button>`}
 return h}
const calHead=()=>{const y=mes.getFullYear(),m=mes.getMonth();return `<div class="cal-h"><button class="sec" onclick="mes=new Date(${y},${m-1},1);render()" aria-label="Mês anterior">‹</button><strong>${mes.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</strong><button class="sec" onclick="mes=new Date(${y},${m+1},1);render()" aria-label="Próximo mês">›</button></div>`};
const calSeg=()=>`<div class="seg">${[['cal','📅 Calendário'],['pl','🩺 Meus Plantões']].map(a=>`<button class="${calSub===a[0]?'on':''}" onclick="calSub='${a[0]}';edPl=null;render()">${a[1]}</button>`).join('')}</div>`;
function vCal(){
 if(calSub==='pl')return vPlantoes();
 const evs=sortEv(S.ev.filter(e=>e.date===sel)),pls=S.pl.filter(p=>p.date===sel).sort(plSort);
 return `<h2>Calendário</h2>${calSeg()}<div class="card">${calHead()}<div class="grid">${calGrid('cal')}</div><p style="font-size:12px;color:var(--mute);margin:10px 0 0">Ponto azul: compromisso. Vermelho: diário. Verde: plantão.</p></div>
 <h3 style="text-transform:capitalize">${fmt(sel,{weekday:'long',day:'numeric',month:'long'})}</h3>
 <div class="card">${pls.length?pls.map(p=>`<div class="item"><span class="hora">${shiftIco(p)}</span><span class="t">Plantão ${p.ent} → ${p.sai}${hospBy(p.hosp)?`<br><small style="color:var(--mute)">${hd(hospBy(p.hosp))} ${esc(hospBy(p.hosp).name)}</small>`:''}${p.obs?`<br><small style="color:var(--mute)">${esc(p.obs)}</small>`:''}</span><button class="ghost" onclick="calSub='pl';render()" aria-label="Ver plantão">›</button></div>`).join(''):''}${evs.length?evs.map(evItem).join(''):(pls.length?'':'<div class="vazio" style="padding:10px">Nada marcado neste dia.</div>')}
 <div class="row" style="margin-top:10px"><input id="ct" placeholder="Novo compromisso" onkeydown="if(event.key==='Enter')addEv('','ct','ch')"><input type="time" id="ch" style="width:120px"><button onclick="addEv('','ct','ch')">＋</button></div>
 ${S.diary[sel]?`<button class="sec" style="margin-top:10px" onclick="dsel=sel;go('diario')">Ver diário deste dia ${S.diary[sel].mood||''}</button>`:''}</div>`}

/* ---------- Meus Plantões ---------- */
function plItem(p,sd){
 if(p.id===edPl)return `<div class="item" style="flex-wrap:wrap"><div class="row" style="width:100%"><input type="date" id="pe-d" value="${p.date}"></div><div class="row" style="width:100%"><label class="fl2">Entrada<input type="time" id="pe-i" value="${p.ent}"></label><label class="fl2">Saída<input type="time" id="pe-o" value="${p.sai}"></label></div><div class="row" style="width:100%">${hospSel('pe-h','pe',p.hosp)}${valIn('pe-v',p.val)}</div><textarea id="pe-ob" style="min-height:60px" placeholder="Observações (opcional)">${esc(p.obs||'')}</textarea><div class="row" style="width:100%"><button onclick="savePl('${p.id}')">Salvar</button><button class="ghost" onclick="edPl=null;render()">Cancelar</button></div></div>`;

const BRL=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const vlr=v=>{const n=parseFloat(String(v==null?'':v).replace(',','.'));return isNaN(n)||n<0?0:Math.round(n*100)/100};
const hospBy=id=>S.hosp.find(h=>h.id===id);
const hd=h=>h?`<i class="hdot" data-c="${h.cor}"></i>`:'';
const somaVal=a=>Math.round(a.reduce((s,p)=>s+(Number(p.val)||0),0)*100)/100;
const hospDef=()=>S.hosp.find(h=>h.id===plQuickH)||S.hosp[0]||null;
const plExtra=p=>{const h=hospBy(p.hosp);return (p.val?` <small class="pval">· ${BRL(p.val)}</small>`:'')+(h?`<div class="phos">${hd(h)} ${esc(h.name)}</div>`:'')};
function porHosp(a){const m=new Map();a.forEach(p=>{const h=hospBy(p.hosp),k=h?h.id:'';let r=m.get(k);if(!r){r={h:h||null,n:0,min:0,val:0};m.set(k,r)}r.n++;r.min+=durMin(p);r.val+=Number(p.val)||0});
 const o=S.hosp.map(h=>m.get(h.id)).filter(Boolean);if(m.get(''))o.push(m.get(''));return o}
function breakHtml(a){if(!S.hosp.length||!a.length)return '';
 return `<div class="hb">${porHosp(a).map(r=>`<div class="hr"><span class="hn">${r.h?hd(r.h)+' '+esc(r.h.name):'Sem hospital'}</span><span class="hv">${r.n} · ${fmtDur(r.min)} · <b>${BRL(r.val)}</b></span></div>`).join('')}</div>`}
const hospSel=(id,pre,selId)=>S.hosp.length?`<label class="fl2">Hospital<select id="${id}" onchange="plHospCh('${pre}')"><option value="">Sem hospital</option>${S.hosp.map(h=>`<option value="${h.id}" ${h.id===selId?'selected':''}>${esc(h.name)}</option>`).join('')}</select></label>`:'';
const valIn=(id,v)=>`<label class="fl2">Diária (R$)<input type="number" id="${id}" step="0.01" min="0" inputmode="decimal" placeholder="0,00" value="${v?v:''}"></label>`;
function plHospCh(pre){const h=hospBy($('#'+pre+'-h').value),v=$('#'+pre+'-v');if(v)v.value=h&&h.val?h.val:''}
function qkH(id){plQuickH=id;render()}
const QK={d:['07:00','19:00'],n:['19:00','07:00']};
function setQuick(k){if(plQuick&&plQuick.k===k){plQuick=null}else{const t=QK[k]||(plQuick&&plQuick.k==='c'?[plQuick.ent,plQuick.sai]:['','']);plQuick={k,ent:t[0],sai:t[1]}}render()}
function setQuickT(f,v){if(plQuick)plQuick[f]=v}
function tapPl(k){
 if(!plQuick){sel=k;edPl=null;render();return}
 if(!plQuick.ent||!plQuick.sai){const e=$(plQuick.ent?'#pq-o':'#pq-i');e&&e.focus();return}
 const hq=hospDef(),hid=hq?hq.id:'',ex=S.pl.find(p=>p.date===k&&p.ent===plQuick.ent&&p.sai===plQuick.sai&&(p.hosp||'')===hid);
 const y=window.scrollY;
 if(ex){const go=()=>{S.pl=S.pl.filter(x=>x.id!==ex.id);sel=k;save();render();window.scrollTo(0,y)};if(ex.obs)ask('Remover este plantão (tem observações)?',go,'Remover');else go();return}
 S.pl.push({id:uid(),date:k,ent:plQuick.ent,sai:plQuick.sai,obs:'',hosp:hid,val:hq&&hq.val?hq.val:0});sel=k;edPl=null;save();render();window.scrollTo(0,y)}
function quickBar(){
 const q=plQuick,h=hospDef(),b=(k,t)=>`<button class="${q&&q.k===k?'on':''}" onclick="setQuick('${k}')">${t}</button>`;
 return `<div class="card qk"><strong>⚡ Marcar vários dias</strong>`
 +(S.hosp.length?`<div class="hch" role="group" aria-label="Hospital">${S.hosp.map(x=>`<button class="hc ${h&&h.id===x.id?'on':''}" data-c="${x.cor}" onclick="qkH('${x.id}')"><i class="hdot"></i>${esc(x.name)}</button>`).join('')}</div>`:'')
 +`<div class="seg">${b('d','☀️ 07–19')}${b('n','🌙 19–07')}${b('c','✏️ Outro')}</div>`
 +(q&&q.k==='c'?`<div class="row" style="margin-top:8px"><label class="fl2">Entrada<input type="time" id="pq-i" value="${q.ent}" onchange="setQuickT('ent',this.value)"></label><label class="fl2">Saída<input type="time" id="pq-o" value="${q.sai}" onchange="setQuickT('sai',this.value)"></label></div>`:'')
 +`<p class="hint">${q?`Modo ativo${h?' em <b>'+esc(h.name)+'</b>'+(h.val?' (diária '+BRL(h.val)+')':''):''}: toque nos dias para adicionar o plantão. Toque de novo no mesmo dia para remover. Toque no botão ativo para sair do modo.`:'Escolha o tipo de plantão e depois toque nos dias do calendário, quantos quiser.'+(S.hosp.length?'':' Cadastre seus hospitais na aba 🏥 Hospitais.')}</p></div>`}
function savePl(id){const p=S.pl.find(x=>x.id===id),i=$('#pe-i').value,o=$('#pe-o').value;if(!i){$('#pe-i').focus();return}if(!o){$('#pe-o').focus();return}
 p.date=$('#pe-d').value||p.date;p.ent=i;p.sai=o;p.obs=$('#pe-ob').value.trim();if($('#pe-h'))p.hosp=$('#pe-h').value;p.val=vlr($('#pe-v').value);edPl=null;save();render()}
function vPlantoes(){
 if(plSub==='hist')return vPlHist();

 return `<h2>Calendário</h2>${calSeg()}${plSeg()}${quickBar()}<div class="card">${calHead()}<div class="grid">${calGrid('pl')}</div><p style="font-size:12px;color:var(--mute);margin:10px 0 0">${plQuick?'Dias coloridos já têm plantão; a cor indica o hospital. ':'Toque em um dia para ver os plantões dele. '}☀️ diurno · 🌙 noturno.</p>${S.hosp.length?`<div class="hleg">${S.hosp.map(h=>`<span>${hd(h)} ${esc(h.name)}</span>`).join('')}</div>`:''}</div>
 <h3 style="text-transform:capitalize">${fmt(sel,{weekday:'long',day:'numeric',month:'long'})}</h3>
 <div class="card">${dia.length?dia.map(plItem).join(''):'<div class="vazio" style="padding:10px">Nenhum plantão registrado neste dia.'+(plQuick?'':' Escolha o tipo de plantão acima e toque no dia para registrar.')+'</div>'}
</div>
 <h3 style="text-transform:capitalize">Resumo de ${mes.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</h3>
 <div class="card tot"><div class="r"><span>Plantões no mês</span><strong>${mp.length}</strong></div><div class="r"><span>Horas trabalhadas</span><strong>${fmtDur(tm)}</strong></div><div class="r"><span>Total das diárias</span><strong class="mn">${BRL(somaVal(mp))}</strong></div>${breakHtml(mp)}</div>
 ${mp.length?`<div class="card">${mp.map(p=>`<div class="item plrow" onclick="sel='${p.date}';edPl=null;render();window.scrollTo(0,0)"><span class="hora" style="min-width:64px;text-transform:capitalize">${fmt(p.date,{weekday:'short',day:'2-digit'})}</span><div class="t">${shiftIco(p)} ${p.ent} → ${p.sai} <small style="color:var(--ac);font-weight:700">· ${fmtDur(durMin(p))}</small>${plExtra(p)}${p.obs?`<div class="pobs">${esc(p.obs)}</div>`:''}</div></div>`).join('')}</div>`:'<div class="vazio">Nenhum plantão neste mês.</div>'}`}

const plSeg=()=>`<div class="seg s3">${[['reg','✍️ Registrar'],['hist','🗂 Histórico'],['hosp','🏥 Hospitais']].map(a=>`<button class="${plSub===a[0]?'on':''}" onclick="plSub='${a[0]}';edPl=null;edHosp=null;hpCor=null;render()">${a[1]}</button>`).join('')}</div>`;
function addPlH(){const d=$('#ph-d').value,i=$('#ph-i').value,o=$('#ph-o').value;if(!d){$('#ph-d').focus();return}if(!i){$('#ph-i').focus();return}if(!o){$('#ph-o').focus();return}

function delMes(k){const a=S.pl.filter(p=>p.date.startsWith(k));if(!a.length)return;
 const nome=new Date(k+'-01T12:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'}),v=somaVal(a);
 ask('Excluir '+(a.length===1?'o plantão':'todos os '+a.length+' plantões')+' de '+nome+(v?' ('+BRL(v)+')':'')+'? Esta ação não pode ser desfeita.',()=>{S.pl=S.pl.filter(p=>!p.date.startsWith(k));delete plOpen[k];edPl=null;save();render()})}

function vPlHist(){
 const anos=[...new Set(S.pl.map(p=>p.date.slice(0,4)))].sort().reverse();if(plAno!=='todos'&&!anos.includes(plAno))plAno='todos';
 const lista=S.pl.filter(p=>plAno==='todos'||p.date.startsWith(plAno)).sort((a,b)=>plSort(b,a)),tm=lista.reduce((s,p)=>s+durMin(p),0),g={};
 lista.forEach(p=>(g[p.date.slice(0,7)]=g[p.date.slice(0,7)]||[]).push(p));
 return `<h2>Calendário</h2>${calSeg()}${plSeg()}`
 +`<div class="card"><strong>Adicionar plantão ao histórico</strong><input type="date" id="ph-d" value="${HOJE}" style="margin-top:8px"><div class="row" style="margin-top:8px"><label class="fl2">Entrada<input type="time" id="ph-i"></label><label class="fl2">Saída<input type="time" id="ph-o"></label></div><div class="row" style="margin-top:8px"><button class="sec" onclick="$('#ph-i').value='07:00';$('#ph-o').value='19:00'">☀️ 07–19</button><button class="sec" onclick="$('#ph-i').value='19:00';$('#ph-o').value='07:00'">🌙 19–07</button></div><div class="row" style="margin-top:8px">${hospSel('ph-h','ph',(hospDef()||{}).id)}${valIn('ph-v',(hospDef()||{}).val)}</div><textarea id="ph-ob" style="min-height:56px;margin-top:8px" placeholder="Observações (opcional)"></textarea><button style="margin-top:8px;width:100%" onclick="addPlH()">Adicionar ao histórico</button></div>`
 +(anos.length>1?`<div class="seg">${['todos',...anos].map(a=>`<button class="${plAno===a?'on':''}" onclick="plAno='${a}';render()">${a==='todos'?'Todos':a}</button>`).join('')}</div>`:'')
 +`<div class="card tot"><div class="r"><span>Plantões${plAno==='todos'?' no total':' em '+plAno}</span><strong>${lista.length}</strong></div><div class="r"><span>Horas trabalhadas</span><strong>${fmtDur(tm)}</strong></div><div class="r"><span>Total das diárias</span><strong class="mn">${BRL(somaVal(lista))}</strong></div>${breakHtml(lista)}</div>`
 +(lista.length?(()=>{const ks=Object.keys(g).sort().reverse(),todos=ks.every(k=>plOpen[k]);
  return `<div class="row" style="justify-content:flex-end;margin-top:4px"><button class="ghost" style="color:var(--ac);font-weight:600" onclick='togTodosMes(${JSON.stringify(ks)})'>${todos?'Recolher todos':'Expandir todos'}</button></div>`
  +ks.map(k=>{const a=g[k],m=a.reduce((s,p)=>s+durMin(p),0),ab=!!plOpen[k];
   return `<div class="mhr"><button class="mh ${ab?'open':''}" onclick="togMes('${k}')" aria-expanded="${ab}"><span class="mt">${new Date(k+'-01T12:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}<small>${a.length} ${a.length===1?'plantão':'plantões'} · ${fmtDur(m)}${somaVal(a)?' · '+BRL(somaVal(a)):''}</small></span><span class="chev" aria-hidden="true">▸</span></button><button class="ghost mdel" onclick="delMes('${k}')" aria-label="Excluir mês" title="Excluir mês">🗑</button></div>${ab?`<div class="card">${breakHtml(a)}${a.map(p=>plItem(p,true)).join('')}</div>`:''}`}).join('')})():'<div class="vazio">Nenhum plantão no histórico ainda. Registre pelo calendário ou adicione acima.</div>')}

/* ---------- Hospitais ---------- */
const nextCor=()=>{const u=S.hosp.map(h=>h.cor),c=CORES.find(x=>!u.includes(x[0]));return (c||CORES[0])[0]};
function pickHC(c,el){hpCor=c;document.querySelectorAll('#hpsw .sw').forEach(b=>b.classList.toggle('on',b===el))}
function saveHosp(){const n=$('#hp-n').value.trim();if(!n){$('#hp-n').focus();return}
 const v=vlr($('#hp-v').value),e=S.hosp.find(h=>h.id===edHosp);
 if(e){e.name=n;e.cor=hpCor;e.val=v}else{const h={id:uid(),name:n,cor:hpCor,val:v};S.hosp.push(h);if(S.hosp.length===1)plQuickH=h.id}
 edHosp=null;hpCor=null;save();render()}
function delHosp(id){const h=hospBy(id);if(!h)return;const n=S.pl.filter(p=>p.hosp===id).length;

function togHosp(id){hpOpen[id]=!hpOpen[id];render()}

function vPlHosp(){

const pct=n=>n.toFixed(1).replace('.',',')+'%';
function side(o){const p=num(o.p),s=num(o.s),q=num(o.q)||1,f=FAM[o.u];if(!(p>0&&s>0))return null;const div=f[0]==='u'?1:1000,amt=s*f[1]*q/div,pay=p*q;return{fam:f[0],pay,amt,per:pay/amt}}

function calcCmp(){const el=$('#cres');if(!el)return;const A=side(cmp.a),B=side(cmp.b),msg=t=>{el.innerHTML='<p style="margin:0">'+t+'</p>'};
 if(!A||!B)return msg('Preencha o preço e o tamanho das duas opções para comparar.');
 if(A.fam!==B.fam)return msg('Essas unidades não podem ser comparadas. Use peso (g, kg), volume (ml, L) ou unidades nas duas opções.');
 const lb={w:'kg',v:'L',u:'un'}[A.fam];
 if(Math.abs(A.per-B.per)<1e-9)return msg('As duas opções custam o mesmo por '+lb+' ('+brl(A.per)+'). Não há vantagem em nenhuma delas.');
 const aw=A.per<B.per,w=aw?'A':'B',l=aw?'B':'A',W=aw?A:B,L=aw?B:A,econ=(L.per-W.per)/L.per*100,mais=(L.per-W.per)/W.per*100,sv=(L.per-W.per)*L.amt;
 el.innerHTML=`<div class="r"><span>Opção A</span><b>${brl(A.per)}/${lb}</b></div><div class="r"><span>Opção B</span><b>${brl(B.per)}/${lb}</b></div><div style="border-top:1px solid var(--ac);margin:10px 0"></div><div class="r"><span>Compensa mais</span><strong>Opção ${w}</strong></div><p style="margin:8px 0 0"><b>Vantagem de ${pct(econ)}:</b> a opção ${w} custa ${pct(econ)} menos por ${lb}.</p><p style="margin:6px 0 0"><b>Desvantagem de ${pct(mais)}:</b> a opção ${l} custa ${pct(mais)} mais que a ${w}.</p><p style="margin:6px 0 0;font-size:14px">Para levar o mesmo conteúdo da opção ${l} (${(+L.amt.toFixed(3)).toLocaleString('pt-BR')} ${lb}) pela opção ${w}, você economiza ${brl(sv)}.</p>`}

/* ---------- Backup ---------- */
const nat=()=>{try{return !!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform())}catch(e){return false}};
const plug=n=>{try{return window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins[n]}catch(e){}};
const bkData=()=>JSON.stringify({app:'meu-plano',v:2,date:HOJE,S:S,LOGOS:LOGOS,FOTOS:FOTOS});
const marcaBk=()=>{S.lastBackup=new Date().toISOString();save();if(tab==='config')render()};
const cancelado=e=>/cancel/i.test(String(e&&(e.message||e.errorMessage)||e));
async function exportar(modo){
 const txt=bkData(),nome='jc-organiza-backup-'+HOJE+'.json',FS=plug('Filesystem'),SH=plug('Share');
 if(nat()&&FS){
  try{
   if(modo==='docs'){
    try{await FS.writeFile({path:'MeuPlano/'+nome,data:txt,directory:'DOCUMENTS',encoding:'utf8',recursive:true});marcaBk();info('Backup salvo no celular em Documentos/MeuPlano/'+nome);return}
    catch(e){/* sem acesso à pasta Documentos: abre a tela de compartilhar */}
   }
   const r=await FS.writeFile({path:nome,data:txt,directory:'CACHE',encoding:'utf8'});
   if(SH){await SH.share({title:'Backup JC ORGANIZA',text:'Backup do JC ORGANIZA',url:r.uri,dialogTitle:'Salvar backup'});marcaBk();return}
  }catch(e){if(cancelado(e))return;info('Não foi possível gerar o arquivo de backup. Use o botão Copiar texto e guarde onde preferir.');return}
 }
 try{const f=new File([txt],nome,{type:'application/json'});if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Backup JC ORGANIZA'});marcaBk();return}}catch(e){if(e&&e.name==='AbortError')return}
 try{const u=URL.createObjectURL(new Blob([txt],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);marcaBk();info('Backup gerado: '+nome+'. Procure na pasta Downloads. Se não aparecer, use o botão Copiar texto.')}catch(e){info('Não foi possível gerar o arquivo. Use o botão Copiar texto.')}}
function copiarBk(){const t=bkData(),m='Backup copiado. Cole em um lugar seguro (anotações, e-mail ou WhatsApp para você).';const fb=()=>{const x=document.createElement('textarea');x.value=t;x.style.position='fixed';x.style.opacity='0';document.body.appendChild(x);x.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}x.remove();info(ok?m:'Não foi possível copiar neste aparelho.')};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>info(m),fb);else fb()}
function restaurar(txt){let d;try{d=JSON.parse(String(txt).trim());if(d&&d.app==='meu-plano'&&d.S&&typeof d.S==='object'){}else if(d&&Array.isArray(d.ev)){d={S:d,LOGOS:{},FOTOS:{}}}else throw 0}catch(e){info('Este conteúdo não é um backup válido do JC ORGANIZA.');return}
 ask('Substituir todos os dados atuais por este backup?',()=>{S=Object.assign({ev:[],notes:[],diary:{},shop:[],prods:{},hist:[],market:'',user:{name:''},theme:'auto',pl:[]},d.S);S.shop.forEach(x=>{x.price=x.price||0;x.qty=x.qty||1});S.pl=Array.isArray(S.pl)?S.pl:[];S.hosp=Array.isArray(S.hosp)?S.hosp:[];S.user=S.user||{name:''};S.notif=Object.assign({on:false,lead:10,plOn:true,plLead:60},S.notif||{});normCart();LOGOS=d.LOGOS||{};FOTOS=d.FOTOS||{};try{localStorage.setItem('minha-agenda-logos',JSON.stringify(LOGOS))}catch(e){}saveFotos();const ok=save();render();info(ok?'Backup restaurado com sucesso.':'Backup restaurado, mas faltou espaço para guardar tudo neste aparelho.')},'Substituir')}
function importar(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restaurar(r.result);r.onerror=()=>info('Não foi possível ler o arquivo.');r.readAsText(f);inp.value=''}
function colarBk(){const o=document.createElement('div');o.className='ov';o.innerHTML='<div class="dlg"><p>Cole aqui o texto do backup</p><textarea id="bkt" style="min-height:120px;margin-bottom:10px"></textarea><div class="row"><button id="bkok">Restaurar</button><button class="sec" id="bkno">Cancelar</button></div></div>';document.body.appendChild(o);o.querySelector('#bkno').onclick=()=>o.remove();o.querySelector('#bkok').onclick=()=>{const t=o.querySelector('#bkt').value;if(!t.trim())return;o.remove();restaurar(t)};o.querySelector('#bkt').focus()}

function initSW(){if(!('serviceWorker' in navigator)||!/^https?:$/.test(location.protocol))return;
 const had=!!navigator.serviceWorker.controller;let rl=false;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(rl||!had)return;rl=true;location.reload()});
 navigator.serviceWorker.register('sw.js').then(reg=>{SWREG=reg;
  if(reg.waiting&&navigator.serviceWorker.controller)updBanner(reg.waiting);
  reg.addEventListener('updatefound',()=>{const n=reg.installing;if(n)n.addEventListener('statechange',()=>{if(n.state==='installed'&&navigator.serviceWorker.controller)updBanner(n)})});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})});

const NOTIF0={on:false,lead:10,plOn:true,plLead:60};
let _st=null,schedSig='',alarmAud=null,beepT=null,beepCtx=null,alarmOv=null,alarmStop=null,fired=new Set();
try{fired=new Set(JSON.parse(localStorage.getItem('mp-fired')||'[]'))}catch(e){}
const LNp=()=>plug('LocalNotifications');
const nid=k=>{let h=7;for(let i=0;i<k.length;i++)h=(h*31+k.charCodeAt(i))>>>0;return h%2000000000+1};
function gatilhos(){const N=S.notif,out=[];if(!N.on)return out;
 S.ev.forEach(e=>{if(e.done||!e.date)return;const tem=!!e.time,t=new Date(e.date+'T'+(e.time||'08:00')).getTime();if(isNaN(t))return;
  out.push({key:'e'+e.id,at:t-(tem?N.lead*60000:0),title:(tem?'⏰ ':'📋 ')+e.title,body:tem?(N.lead?'Começa às '+e.time+' (em '+N.lead+' min)':'Agora: '+e.time):'Compromisso de hoje'})});
 if(N.plOn)S.pl.forEach(p=>{const t=new Date(p.date+'T'+p.ent).getTime();if(isNaN(t))return;
  out.push({key:'p'+p.id,at:t-N.plLead*60000,title:'🩺 Plantão '+p.ent+' → '+p.sai,body:'Começa às '+p.ent+(hospBy(p.hosp)?' · '+hospBy(p.hosp).name:'')+(p.obs?' · '+p.obs:'')})});
 if(N.cwOn!==false)cwGatilhos(N).forEach(x=>out.push(x));
  return out.sort((a,b)=>a.at-b.at)}
function schedSoon(){clearTimeout(_st);_st=setTimeout(()=>{agendarNotifs().catch(()=>{})},700)}
async function agendarNotifs(force){const L=LNp();if(!nat()||!L)return;
 const g=gatilhos().filter(x=>x.at>Date.now()).slice(0,60),sig=JSON.stringify(g.map(x=>[x.key,x.at,x.title,x.body]));
 if(!force&&sig===schedSig)return;schedSig=sig;
 try{const pd=await L.getPending();if(pd.notifications&&pd.notifications.length)await L.cancel({notifications:pd.notifications.map(n=>({id:n.id}))});
  if(!g.length)return;
  try{await L.createChannel({id:'agenda',name:'Lembretes da agenda',description:'Compromissos e plantões',importance:5,visibility:1,vibration:true})}catch(e){}
  await L.schedule({notifications:g.map(x=>({id:nid(x.key),title:x.title,body:x.body,channelId:'agenda',schedule:{at:new Date(x.at),allowWhileIdle:true},extra:{at:x.at,key:x.key}}))})}catch(e){}}
async function ativarLembretes(on){
 if(!on){S.notif.on=false;save();agendarNotifs(true);render();return}
 const L=LNp();
 if(nat()&&L){try{let p=await L.checkPermissions();if(p.display!=='granted')p=await L.requestPermissions();
   if(p.display!=='granted'){info('Permissão negada. Ative as notificações do JC ORGANIZA nas configurações do celular.');return}
   try{const ex=await L.checkExactNotificationSetting();if(ex&&ex.exact_alarm==='denied')ask('Para os lembretes tocarem na hora certa, permita “Alarmes e lembretes” para o JC ORGANIZA.',()=>{L.changeExactNotificationSetting().catch(()=>{})},'Abrir ajuste')}catch(e){}
  }catch(e){info('Não foi possível ativar as notificações neste aparelho.');return}}
 else if('Notification' in window&&Notification.permission==='default'){try{await Notification.requestPermission()}catch(e){}}
 S.notif.on=true;save();agendarNotifs(true);render()}
function setNotif(k,v){if(k==='plLead'){v=+v;S.notif.plOn=v>0;if(v>0)S.notif.plLead=v}else S.notif[k]=+v;save();agendarNotifs(true);render()}
/* som escolhido pelo usuário (guardado no aparelho, em IndexedDB) */
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('meu-plano-som',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function somGet(){try{const d=await idb();return await new Promise(ok=>{const q=d.transaction('s').objectStore('s').get('alarm');q.onsuccess=()=>ok(q.result||null);q.onerror=()=>ok(null)})}catch(e){return null}}
async function somSet(b){const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('s','readwrite');if(b)t.objectStore('s').put(b,'alarm');else t.objectStore('s').delete('alarm');t.oncomplete=ok;t.onerror=()=>no(t.error)})}
async function escolherSom(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;
 if(f.size>20*1024*1024){info('Arquivo muito grande. Escolha uma música de até 20 MB.');return}
 if(f.type&&!/^(audio|video)\//.test(f.type)&&!/\.(mp3|m4a|aac|wav|ogg|opus|flac|amr|mp4)$/i.test(f.name)){info('Escolha um arquivo de áudio (MP3, M4A, WAV, OGG…).');return}
 try{const b=new Blob([await f.arrayBuffer()],{type:f.type||'audio/mpeg'});
  await new Promise((ok,no)=>{const a=new Audio(URL.createObjectURL(b));a.onloadedmetadata=ok;a.onerror=()=>no(new Error('x'));setTimeout(ok,4000)});
  await somSet(b);S.notif.sound={name:f.name,size:f.size};save();render();info('Música definida como alarme: '+f.name)}
 catch(e){info('Não foi possível usar esse arquivo como alarme. Tente outro (MP3 ou M4A).')}}
async function removerSom(){try{await somSet(null)}catch(e){}delete S.notif.sound;save();render()}
function beepIni(){try{beepCtx=beepCtx||new (window.AudioContext||window.webkitAudioContext)();const c=beepCtx;if(c.state==='suspended')c.resume();
 const bip=()=>{[0,.25,.5].forEach(d=>{const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(c.destination);o.start(c.currentTime+d);o.stop(c.currentTime+d+.15)})};
 bip();beepT=setInterval(bip,1500)}catch(e){}}
async function tocar(){pararSom();const b=await somGet();
 if(b){try{alarmAud=new Audio(URL.createObjectURL(b));alarmAud.loop=true;await alarmAud.play();return}catch(e){alarmAud=null}}
 beepIni()}
function pararSom(){if(alarmAud){try{alarmAud.pause()}catch(e){}alarmAud=null}if(beepT){clearInterval(beepT);beepT=null}}
function pararAlarme(){pararSom();clearTimeout(alarmStop);if(alarmOv){alarmOv.remove();alarmOv=null}try{navigator.vibrate&&navigator.vibrate(0)}catch(e){}}
function alarme(title,body){
 pararAlarme();
 try{navigator.vibrate&&navigator.vibrate([500,250,500,250,500])}catch(e){}
 if(!nat()&&document.hidden&&'Notification' in window&&Notification.permission==='granted'){try{new Notification(title,{body})}catch(e){}}
 const o=document.createElement('div');o.className='ov';o.setAttribute('role','alertdialog');
 o.innerHTML=`<div class="dlg alarme"><div class="bell" aria-hidden="true">🔔</div><p>${esc(title)}</p><div class="abody">${esc(body||'')}</div><div class="row"><button id="al-ok" style="background:var(--ac);color:var(--onac)">Parar</button><button class="sec" id="al-sn">Soneca 5 min</button></div></div>`;
 document.body.appendChild(o);alarmOv=o;
 o.querySelector('#al-ok').onclick=pararAlarme;
 o.querySelector('#al-sn').onclick=()=>{pararAlarme();setTimeout(()=>alarme(title,body),300000);const L=LNp();if(nat()&&L)L.schedule({notifications:[{id:nid('sn'+Date.now()),title,body:(body||'')+' (soneca)',channelId:'agenda',schedule:{at:new Date(Date.now()+300000),allowWhileIdle:true}}]}).catch(()=>{})};
 tocar();alarmStop=setTimeout(pararAlarme,90000)}
function tick(){if(!S.notif||!S.notif.on||!S.user.name)return;const now=Date.now();
 gatilhos().filter(x=>x.at<=now&&x.at>now-5*60000&&!fired.has(x.key+'@'+x.at)).forEach(x=>{
  fired.add(x.key+'@'+x.at);alarme(x.title,x.body)});
 try{const a=[...fired];localStorage.setItem('mp-fired',JSON.stringify(a.slice(-200)))}catch(e){}}
function initLembretes(){setInterval(tick,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();schedSoon()}});
 const L=LNp();if(nat()&&L){try{L.addListener('localNotificationReceived',()=>tick());L.addListener('localNotificationActionPerformed',()=>tick())}catch(e){}schedSoon()}
 setTimeout(tick,1500)}

 const sel=(id,l,opts,cur,fn)=>`<label class="fl" for="${id}">${l}</label><select id="${id}" style="width:100%" onchange="${fn}">${opts.map(o=>`<option value="${o[0]}" ${+o[0]===+cur?'selected':''}>${o[1]}</option>`).join('')}</select>`;

  +sel('nt-p','Lembrar meus plantões',[[0,'Não lembrar'],[30,'30 min antes'],[60,'1 hora antes'],[120,'2 horas antes'],[180,'3 horas antes']],N.plOn?N.plLead:0,"setNotif('plLead',this.value)"):'')
 +`<label class="fl">Música do alarme</label><div class="somnome">🎵 ${sn?esc(sn.name):'Som padrão (bipes)'}</div><div class="row" style="margin-top:8px"><button class="sec" onclick="$('#nt-f').click()">🎵 Escolher música</button><button class="sec" onclick="alarme('Teste do alarme','É assim que o alarme vai tocar.')">▶ Testar</button>${sn?'<button class="ghost" onclick="removerSom()">Remover</button>':''}</div><input type="file" id="nt-f" accept="audio/*" style="display:none" onchange="escolherSom(this)">`
 +`<p class="hint">Escolha qualquer música dos arquivos do seu celular. Com o app aberto, ou ao tocar na notificação, a música toca em repetição até você parar. Com o app fechado, o celular mostra a notificação com o som padrão dele, pois o Android não deixa um app trocar o som sem estar aberto.${app?'':' Neste navegador os avisos só funcionam com a página aberta.'} A música fica só neste aparelho e não entra no backup.</p></div>`}


/* ---------- Carteira (v1.6) ---------- */
const CCATS=[['contas','🏠','Contas'],['feira','🛒','Feira / mercado'],['extra','🎉','Gastos extras'],['transp','🚗','Transporte'],['saude','💊','Saúde'],['outros','📦','Outros']];
const ccat=id=>CCATS.find(c=>c[0]===id)||CCATS[5];
const cR2=n=>Math.round((+n||0)*100)/100;
const cSum=a=>cR2(a.reduce((s,x)=>s+(+x.val||0),0));
function normCart(){
 const c=S.cart=(S.cart&&typeof S.cart==='object'&&!Array.isArray(S.cart))?S.cart:{};
 c.base=cR2(c.base);delete c.usePl;
 ['rendas','fixas','gastos'].forEach(k=>{c[k]=Array.isArray(c[k])?c[k].filter(x=>x&&typeof x==='object'):[]});
 c.fixas.forEach(f=>{f.val=cR2(f.val);f.dia=Math.min(31,Math.max(1,parseInt(f.dia)||1));f.desc=String(f.desc||'');f.cat=f.cat||'contas';f.ini=f.ini||HOJE.slice(0,7)});
 c.gastos.forEach(g=>{g.val=cR2(g.val);g.date=g.date||HOJE;g.cat=g.cat||'outros';g.desc=String(g.desc||'')});
 c.rendas.forEach(r=>{r.val=cR2(r.val);r.m=r.m||HOJE.slice(0,7);r.desc=String(r.desc||'')});
 c.pagas=(c.pagas&&typeof c.pagas==='object'&&!Array.isArray(c.pagas))?c.pagas:{};
 const N=S.notif=S.notif||{};if(N.cwOn===undefined)N.cwOn=true;if(N.cwLead===undefined||isNaN(+N.cwLead))N.cwLead=2;if(!/^\d{2}:\d{2}$/.test(N.cwHora||''))N.cwHora='09:00'}
let cSub='res',cMes=HOJE.slice(0,7),cEd=null;
/* aceita 1500 | 1500,50 | 1.500,50 | 1.500 | 15.5 */
const cNum=v=>{let s=String(v==null?'':v).trim().replace(/[^\d.,]/g,'');
 if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');
 else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
 const n=parseFloat(s);return isNaN(n)||n<0?0:cR2(n)};
const cTxt=n=>n?String(cR2(n)).replace('.',','):'';
const cMesTxt=()=>new Date(cMes+'-01T12:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
const cAtual=()=>cMes===HOJE.slice(0,7);
const cDataPad=()=>cAtual()?HOJE:cMes+'-01';
const cPrev=m=>{const a=m.split('-').map(Number);return iso(new Date(a[0],a[1]-2,1)).slice(0,7)};
function cMove(n){const a=cMes.split('-').map(Number);cMes=iso(new Date(a[0],a[1]-1+n,1)).slice(0,7);cEd=null;render()}
const cFix=m=>S.cart.fixas.filter(f=>f.ini<=m&&(!f.fim||m<=f.fim)).sort((a,b)=>a.dia-b.dia||a.desc.localeCompare(b.desc));
const cPago=(m,id)=>!!(S.cart.pagas[m]&&S.cart.pagas[m][id]);
const cGas=m=>S.cart.gastos.filter(g=>g.date.slice(0,7)===m).sort((a,b)=>b.date.localeCompare(a.date));
const cRen=m=>S.cart.rendas.filter(r=>r.m===m);
function cCalc(m){
 const c=S.cart,fx=cFix(m),gs=cGas(m),re=cRen(m);
 const rExtra=cSum(re),renda=cR2(c.base+rExtra);
 const fixTot=cSum(fx),fixPago=cSum(fx.filter(f=>cPago(m,f.id))),gasTot=cSum(gs);
 const gastos=cR2(fixTot+gasTot),porCat={};
 fx.concat(gs).forEach(x=>{const k=ccat(x.cat)[0];porCat[k]=cR2((porCat[k]||0)+x.val)});
 return {fx,gs,re,rExtra,renda,fixTot,fixPago,gasTot,gastos,porCat,sobra:cR2(renda-gastos),falta:cR2(fixTot-fixPago)}}
const cSel=(id,cur)=>`<select id="${id}" aria-label="Categoria">${CCATS.map(c=>`<option value="${c[0]}" ${c[0]===cur?'selected':''}>${c[1]} ${c[2]}</option>`).join('')}</select>`;
const cClear=ids=>ids.forEach(i=>{const e=$('#'+i);if(e)e.value=''});
const cFoco=id=>{const e=$('#'+id);if(e)e.focus()};

function vCarteira(){
 const k=cCalc(cMes);
 const seg=`<div class="seg s4">${[['res','📊 Resumo'],['gas','💸 Gastos'],['fix','📌 Fixas'],['ren','💵 Renda']].map(a=>`<button class="${cSub===a[0]?'on':''}" onclick="cSub='${a[0]}';cEd=null;render()">${a[1]}</button>`).join('')}</div>`;
 const nv=`<div class="cal-h"><button class="sec" onclick="cMove(-1)" aria-label="Mês anterior">‹</button><strong class="cw-m">${esc(cMesTxt())}</strong><button class="sec" onclick="cMove(1)" aria-label="Próximo mês">›</button></div>`;
 return `<h2>Carteira</h2>`+seg+nv+(cSub==='res'?cResumo(k):cSub==='gas'?cGastos(k):cSub==='fix'?cFixas(k):cRenda(k))}

/* --- Resumo --- */
function cResumo(k){
 const real=k.renda>0?Math.round(k.gastos/k.renda*100):(k.gastos>0?100:0),cap=Math.min(100,real);
 const cls=k.renda>0&&k.gastos>k.renda?'over':real>=80?'warn':'';
 const aviso=k.renda<=0?`<p class="hint">Informe quanto você ganha na aba <b>Renda</b> para ver quanto sobra no mês.</p>`
  :k.gastos>k.renda?`<p class="cw-warn">⚠️ Os gastos passaram da renda em ${BRL(-k.sobra)}.</p>`
  :real>=80?`<p class="cw-warn">Atenção: você já usou ${real}% da renda do mês.</p>`:'';
 const cats=CCATS.map(c=>[c,k.porCat[c[0]]||0]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);

 return o.join(' ')}

 else if(m=t.match(/([\d.,]+)\s*(?:reais|real|contos?|pratas?)(?:\s*e\s*(\d{1,2})\b)?/))v=cNum(m[1])+(m[2]?+m[2]/100:0);

 if((m=t.match(/\b(?:estou|to|tou|cheguei|fui)\b.*?\b(?:n[oa]|em|ao)\s+(.+)$/))&&(mkId(m[1])||/mercado|atacarejo|feira/.test(t))){const k=mkId(m[1]);
  S.market=k?MERC.find(x=>x.id===k).nome:cap(fix(m[1].replace(/^(?:mercado|supermercado)\s+/,'')));S.mkSkip=false;save();go('compras');return{did:1,m:`Certo, você está no ${S.market}. Os preços que eu anotar ficam guardados aqui.`}}
 if(/\b(finaliz\w+|termin\w+|fech\w+|conclu\w+)\b.*\b(compra|compras|feira|lista)\b/.test(t)){
  if(!S.shop.length)return{m:'A lista está vazia, não tem o que finalizar.'};
  const fim=()=>{const n=S.shop.length,tt=tot(S.shop),mk=S.market;finish();say(`${OK()} Compra finalizada: ${n} itens, ${BRL(tt)}. Guardei os preços do ${mk}.`)};
  if(!S.market)return{m:'Em qual mercado você está?',chips:MERC.map(x=>[x.nome,()=>{S.market=x.nome;fim()}])};
  fim();return{m:''}}
 if(m=t.match(/^(?:apaga\w*|exclui\w*|remove\w*|deleta\w*)\s+(?:o |a |meu |minha )?(compromisso|nota|evento)?\s*(?:de |do |da |sobre )?(.+)$/)){
  const isN=m[1]==='nota',list=isN?S.notes.filter(n=>N(n.title+' '+n.text).includes(m[2])):S.ev.filter(e=>N(e.title).includes(m[2]));
  if(!list.length)return{m:`Não achei nada com “${m[2]}”.`};const x=list[0];close();
  ask(`Excluir ${isN?'a nota':'o compromisso'} “${isN?(x.title||x.text.slice(0,30)):x.title}”?`,()=>{UNDO.snaps.push(JSON.stringify(S));if(isN)S.notes=S.notes.filter(n=>n!==x);else S.ev=S.ev.filter(e=>e!==x);save();render()});return{m:''}}
 if(m=t.match(/^(?:marca\w*|conclui\w*)\s+(?:o |a )?(.+?) como (feito|concluido|pronto|pago)$/)){
  if(m[2]==='pago'){const f=S.cart.fixas.find(x=>N(x.desc).includes(m[1]));if(f){const mm=HOJE.slice(0,7);(S.cart.pagas[mm]=S.cart.pagas[mm]||{})[f.id]=true;save();render();return{did:1,m:`${OK()} ${f.desc} marcada como paga.`}}}
  const e=S.ev.find(x=>N(x.title).includes(m[1])&&!x.done)||S.shop.find(x=>N(x.title).includes(m[1]));
  if(e){e.done=true;save();render();return{did:1,m:`${OK()} “${e.title}” concluído.`}}return{m:`Não achei “${m[1]}”.`}}
 if(/\b(conta fixa|despesa fixa|todo mes|todo dia \d)/.test(t)&&/\d/.test(t)){const mf=t.match(/(?:todo dia|dia|vence dia)\s+(\d{1,2})/),dd=mf?Math.min(31,+mf[1]):1,x=t.replace(/(?:todo dia|vence dia)\s+\d{1,2}|\b(?:conta|despesa) fixa\b|\btodo mes\b/g,' '),mo=money(x);
  if(mo.v==null)return{m:'Qual é o valor dessa conta fixa?'};
  const d=cap(fix(mo.s.replace(/\b(adiciona\w*|cria\w*|registra\w*|de|do|da|com|em|no|na|um|uma|o|a|reais|real|dia|que|vence|pago|paguei)\b/g,' ').replace(/\s+/g,' ').trim()))||'Conta fixa';
  S.cart.fixas.push({id:uid(),desc:d,val:cR2(mo.v),dia:dd,cat:catOf(d),ini:HOJE.slice(0,7)});save();go('carteira');cSub='fix';render();return{did:1,m:`${OK()} Conta fixa: ${d}, ${BRL(mo.v)}, todo dia ${dd}.`}}
 if(/\b(minha renda|meu salario|salario|renda fixa|ganho por mes)\b/.test(t)&&!/\b(gastei|paguei)\b/.test(t)){const v=money(t).v;
  if(v!=null){S.cart.base=cR2(v);save();render();return{did:1,m:`${OK()} Sua renda mensal agora é ${BRL(v)}.`}}}
 const ganho=/\b(recebi|ganhei|entrou|caiu|vendi|deposita\w*|fiz um bico)\b/.test(t),gasto=/\b(gastei|paguei|gasto|despesa|saiu|pagamos|torrei)\b/.test(t);
 if(ganho||gasto){const dt=dia(t),mo=money(dt.s);
  const desc=cap(fix(mo.s.replace(/\b(gastei|paguei|gasto|despesa|saiu|recebi|ganhei|entrou|caiu|vendi|deposita\w*|fiz|reais|real|de|do|da|com|em|no|na|um|uma|o|a|por|pra|para|meu|minha|foi|que|eu|valor|bico)\b/g,' ').replace(/\s+/g,' ').trim()))||(ganho&&/bico/.test(t)?'Bico':'');
  if(mo.v==null)return needVal(desc,dt.d,ganho);lancar(desc,mo.v,dt.d,ganho);return{m:''}}
 if(/\bplantao|plantoes\b/.test(t)){const dt=dia(t);let ent,sai,r=dt.s.match(/\bdas? (\d{1,2})(?::(\d{2}))?\s?h?(?:oras?)?\s+(?:as|ate as|ate)\s+(\d{1,2})(?::(\d{2}))?/);
  if(r){ent=pad(+r[1])+':'+(r[2]||'00');sai=pad(+r[3])+':'+(r[4]||'00')}else if(/noturn|noite/.test(dt.s)){ent='19:00';sai='07:00'}else if(/diurn|\bdia\b|manha/.test(dt.s)){ent='07:00';sai='19:00'}
  const d=dt.d||HOJE;if(!ent){PEND={fill:t2=>{const x=t2.match(/\bdas? (\d{1,2})(?::(\d{2}))?\s?h?(?:oras?)?\s+(?:as|ate as|ate)\s+(\d{1,2})(?::(\d{2}))?/);if(!x)return false;S.pl.push({id:uid(),date:d,ent:pad(+x[1])+':'+(x[2]||'00'),sai:pad(+x[3])+':'+(x[4]||'00'),obs:'',hosp:S.hosp.length===1?S.hosp[0].id:'',val:0});save();render();say(`${OK()} Plantão registrado para ${whenTxt(d)}.`)}};return{m:'Qual o horário? Diga, por exemplo: das 19 às 7.'}}
  S.pl.push({id:uid(),date:d,ent,sai,obs:'',hosp:S.hosp.length===1?S.hosp[0].id:'',val:0});save();render();return{did:1,m:`${OK()} Plantão de ${ent} às ${sai} registrado para ${whenTxt(d)}.`}}
 if(/^(?:anota\w*|nota|cria\w* (?:uma )?nota|nova nota|escreve\w*|guarda\w*|salva\w*)\b/.test(t)&&!/\b(lista|feira|carrinho)\b/.test(t)&&!(money(t).v!=null&&/reais|real|r\$|quilo|kg/.test(t))){
  let body=raw.replace(/^\s*(?:kayla,?\s*)?(?:por favor,?\s*)?(?:anota(?:r)?|cria(?:r)?(?: uma)? nota|nova nota|nota|escreve(?:r)?|guarda(?:r)?|salva(?:r)?)\s*(?:que|sobre|:|isso:?)?\s*/i,'').trim();
  let cor='';const mc=N(body).match(/\b(?:nota|cor|de cor|na cor)\s+(vermelh[ao]|laranja|amarel[ao]|verde|azul|roxo|rosa)\b/);
  if(mc){cor={vermelha:'vermelho',amarela:'amarelo'}[mc[1]]||mc[1].replace(/a$/,'o').replace('laranjo','laranja');body=body.replace(new RegExp('(?:nota |cor |de cor |na cor )'+mc[1]+'\\w*','i'),'').trim()}
  if(!body)return{m:'O que você quer anotar?'};
  let title,text;const ci=body.indexOf(':');if(ci>0&&ci<50){title=body.slice(0,ci).trim();text=body.slice(ci+1).trim()}else{title=body.split(/\s+/).slice(0,5).join(' ');text=body}
  S.notes.push({id:uid(),title:cap(title),text:cap(text),color:cor,at:Date.now()});save();go('notas');return{did:1,m:`${OK()} Criei ${/^(a|o)?\s?nota/.test(W('nota','nota'))?'a nota':'a '+W('nota','nota')} “${cap(title)}”.`}}
 const itens=/\b(lista|feira|carrinho|cesta|compras)\b/.test(t),vb=/^(?:adiciona\w*|coloca\w*|poe|bota|inclui\w*|anota\w*|compra\w*|pega\w*|registra\w*|preciso de|falta)\b/.test(t);
 const dtx=dia(t),tmx=tempo(dtx.s),hasM=money(tmx.s).v!=null&&/reais|real|r\$|quilo|kg|\d,\d/.test(t);
 if(itens||(vb&&hasM&&dtx.d==null)||(S.market&&hasM&&dtx.d==null&&tmx.h==null)){const r=shopAdd(t,fix);if(r)return r}
 const vev=/^(?:agenda\w*|marca\w*|compromisso|evento|lembr\w+|tenho|preciso|reuniao|consulta|vou|tem)\b/.test(t);
 if(vev||dtx.d||tmx.h!=null){let title=tmx.s.replace(LEAD,'').replace(TRAIL,'').trim(),d=dtx.d,h=tmx.h!=null?pad(tmx.h)+':'+pad(tmx.mi):'';
  const grava=()=>{S.ev.push({id:uid(),title:cap(fix(title)),date:d||HOJE,time:h,done:false});save();go('agenda');say(`${OK()} ${cap(fix(title))} — ${whenTxt(d||HOJE,h)}.`);0};
  const ask2=()=>{PEND={fill:t2=>{const a=dia(t2),b=tempo(a.s);if(!a.d&&b.h==null)return false;d=a.d;if(b.h!=null)h=pad(b.h)+':'+pad(b.mi);grava()}};return{m:'Para quando? Pode dizer o dia e a hora.'}};
  if(!title){PEND={fill:t2=>{title=t2.replace(LEAD,'').trim();if(!title)return false;if(!d&&!h)return ask2();grava()}};return{m:'Qual é o compromisso?'}}
  if(!d&&!h)return ask2();grava();return{m:''}}
 PEND=null;const first=t.split(' ')[0];
 return{m:'Ainda não sei o que fazer com isso. É um compromisso, uma nota, um gasto, um ganho ou um item de compra? Eu aprendo com a sua resposta.',chips:[['📅 Compromisso','ev'],['📝 Nota','nota'],['💸 Gasto','gasto'],['💵 Ganho','ganho'],['🛒 Compra','shop']].map(([l,k])=>[l,()=>{M.verbs[first]=k;sv();run(raw,true)}])}}

function run(raw,quiet){raw=String(raw||'').trim();if(!raw)return;if(!quiet)bub('u',raw);setSt('Pensando…',1);
 let t=w2n(N(raw)).replace(/^(?:(?:oi|ola|ei|ok|e)\s+)?kayla\b[, ]*/,'').replace(/^por favor\s+/,'');
 for(const k in M.alias)t=t.replace(new RegExp('\\b'+re(k)+'\\b','g'),M.alias[k]);
 if(!quiet)learn(t);
 const snap=JSON.stringify(S);let r;undone=false;
 try{
  if(PEND){const p=PEND;PEND=null;r=p.fill(t,raw);if(r===false)r=act(raw,t)}else r=act(raw,t)
 }catch(e){r={m:'Tive um problema ao fazer isso. Pode repetir de outro jeito?'}}
 if(!undone&&JSON.stringify(S)!==snap){UNDO.snaps.push(snap);if(UNDO.snaps.length>8)UNDO.snaps.shift()}
 if(r&&r.m)say(r.m,r.chips);else setSt('Toque no microfone e fale')}

/* ---------- eventos ---------- */
function open(listenNow){sh.hidden=false;fillSet();if(!M.hi){M.hi=1;sv();say(`Oi${who()}! Eu sou a KAYLA, sua assistente. Pode me pedir para marcar ${W('ev','compromisso')}s, criar notas, registrar preços na feira e lançar gastos e ganhos. Por exemplo: marca dentista amanhã às 3 da tarde.`)}
 else if(listenNow)listen()}
function close(){sh.hidden=true;try{if(ouvindo)rec.stop()}catch(e){}stopV()}
fab.onclick=()=>open(true);$k('#kx').onclick=close;sh.onclick=e=>{if(e.target===sh)close()};
$k('#kmic').onclick=listen;$k('#kgo').onclick=()=>{const v=$k('#kin').value;$k('#kin').value='';run(v)};
$k('#kin').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$k('#kgo').onclick()}};
$k('#kgear').onclick=()=>{const s=$k('#kset');s.hidden=!s.hidden;fillSet()};
$k('#kvoz').onchange=e=>{M.voice=e.target.value;sv();speak('Oi! Essa é a minha voz.')};
$k('#kr').oninput=e=>{M.rate=+e.target.value;sv()};$k('#kp').oninput=e=>{M.pitch=+e.target.value;sv()};
$k('#kon').onchange=e=>{M.on=e.target.checked;sv()};$k('#kek').oninput=e=>{M.ek=e.target.value.trim();sv()};$k('#kvid').oninput=e=>{M.vid=e.target.value.trim();sv()};$k('#kt').onclick=()=>speak('Oi! Eu sou a KAYLA. Como posso ajudar você hoje?');
$k('#kfg').onclick=()=>{if(confirm('Apagar tudo o que a KAYLA aprendeu sobre o seu jeito de falar?')){const v=M.voice,r=M.rate,p=M.pitch,o=M.on;M=Object.assign({},D0,{voice:v,rate:r,pitch:p,on:o,hi:1,ek:M.ek,vid:M.vid});sv();say('Pronto, esqueci o que tinha aprendido. Vamos começar de novo!')}};
window.KAYLA={run,open};
}catch(err){console.error('KAYLA',err)}})();
