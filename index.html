<style>
:root{--bg:#f1f5f7;--sf:#fff;--ink:#14232e;--mute:#5d6f7c;--ac:#0f7b8a;--acs:#dff1f3;--ln:#dbe4ea;--ok:#2f9e6b;--rd:#c8483c;--onac:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a21;--sf:#172630;--ink:#e8f0f4;--mute:#8fa3b0;--ac:#4fc3d1;--acs:#1b3a44;--ln:#263a46;--ok:#4cc58d;--rd:#e8776b;--onac:#06232a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a21;--sf:#172630;--ink:#e8f0f4;--mute:#8fa3b0;--ac:#4fc3d1;--acs:#1b3a44;--ln:#263a46;--ok:#4cc58d;--rd:#e8776b;--onac:#06232a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
main{max-width:640px;margin:0 auto;padding:20px 16px}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;gap:12px}
h1{font:800 30px/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em;margin:0}
h1 span{color:var(--ac)}
.hoje{color:var(--mute);font-size:14px;text-align:right;text-transform:capitalize}
h2{font:700 20px/1.2 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 12px}
h3{font:600 14px/1.2 Figtree,sans-serif;color:var(--mute);margin:18px 0 8px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
input,textarea,button{font:inherit;color:inherit}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px 12px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
textarea{resize:vertical;min-height:110px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac);flex:none;padding:0}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:var(--onac);font-weight:600}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) button.pri{color:#06232a}}
button.ghost{background:transparent;color:var(--mute);padding:6px 8px;font-weight:500}
button.ghost:hover{color:var(--rd)}
button.sec{background:var(--acs);color:var(--ac)}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}
.item.done .t{text-decoration:line-through;color:var(--mute)}
.hora{font:700 13px "Bricolage Grotesque",sans-serif;color:var(--ac);min-width:46px}
.vazio{color:var(--mute);text-align:center;padding:22px 8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;width:100%;max-width:640px}
nav button{flex:1;background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;padding:6px 2px;font-weight:500}
nav button b{font-size:20px;font-weight:400;line-height:1}
nav button.on{color:var(--ac);background:var(--acs)}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-h strong{font:700 18px "Bricolage Grotesque",sans-serif;text-transform:capitalize}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dw{text-align:center;color:var(--mute);font-size:12px;padding:4px 0}
.d{aspect-ratio:1;border-radius:10px;background:transparent;color:var(--ink);padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:500;position:relative}
.d.out{opacity:.3}
.d.hj{border:2px solid var(--ac)}

function _t(k,v){let x=(I18N[LANG]&&I18N[LANG][k])||k;if(v)x=x.replace(/\{(\w+)\}/g,(m,n)=>v[n]!=null?v[n]:m);return x}

const PATS=[];Object.keys(I18N.en).forEach(k=>{if(k.includes('{')){const nm=[];const re=new RegExp('^'+k.replace(/[.*+?^$()|[\]\\]/g,'\\$&').replace(/\{(\w+)\}/g,(m,n)=>{nm.push(n);return '(.+?)'})+'$');PATS.push([k,re,nm])}});
function _tx(str){if(LANG==='pt')return str;const m=str.match(/^(\s*)([\s\S]*?)(\s*)$/),core=m[2];if(!core)return str;const d=I18N[LANG];let r=d[core],pre='';
 if(r==null){const e=core.match(/^([^\p{L}\p{N}]*)([\s\S]*)$/u);if(e[1]&&d[e[2]]!=null){pre=e[1];r=d[e[2]]}}
 if(r==null)for(const p of PATS){const x=core.match(p[1]);if(x){const v={};p[2].forEach((n,i)=>v[n]=x[i+1]);r=_t(p[0],v);break}}
 if(r==null&&core.includes(' · ')){const ps=core.split(' · '),tp=ps.map(_tx);if(tp.some((x,i)=>x!==ps[i]))r=tp.join(' · ')}
 return r==null?str:m[1]+pre+r+m[3]}
let _busy=false;
function trDom(root){if(LANG==='pt'||_busy||!root)return;_busy=true;try{
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT,{acceptNode:n=>n.nodeType===1&&/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.tagName)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
 const L=[];let n=w.currentNode;while(n){L.push(n);n=w.nextNode()}
 L.forEach(n=>{if(n.nodeType===3){const v=_tx(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}else['placeholder','aria-label','title'].forEach(a=>{const x=n.getAttribute&&n.getAttribute(a);if(x){const v=_tx(x);if(v!==x)n.setAttribute(a,v)}})})
}finally{_busy=false}}
new MutationObserver(ms=>{if(LANG==='pt'||_busy)return;ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)trDom(n);else if(n.nodeType===3&&n.parentNode&&n.parentNode.tagName!=='TEXTAREA'){_busy=true;const v=_tx(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;_busy=false}}))}).observe(document.body,{childList:true,subtree:true});

/* ---------- Agenda ---------- */
function evItem(e){if(e.id===edEv)return evEdit(e);return `<div class="item ${e.done?'done':''}"><input type="checkbox" ${e.done?'checked':''} onchange="togEv('${e.id}')" aria-label="Concluir"><span class="hora">${e.time||'—'}</span><span class="t">${esc(e.title)}</span><button class="ghost" onclick="edEv='${e.id}';render()" aria-label="Editar">✎</button><button class="ghost" onclick="delEv('${e.id}')" aria-label="Excluir">✕</button></div>`}
function addEv(dateId,titleId,timeId){const t=$('#'+titleId).value.trim();if(!t){$('#'+titleId).focus();return}
 S.ev.push({id:uid(),title:t,date:dateId?$('#'+dateId).value:sel,time:$('#'+timeId).value,done:false});save();render()}
function togEv(id){const e=S.ev.find(x=>x.id===id);e.done=!e.done;save();render()}
function delEv(id){S.ev=S.ev.filter(x=>x.id!==id);save();render()}
const sortEv=a=>a.sort((x,y)=>(x.date+(x.time||'99')).localeCompare(y.date+(y.time||'99')));
function vAgenda(){
 const fut=sortEv(S.ev.filter(e=>e.date>=HOJE)),pas=sortEv(S.ev.filter(e=>e.date<HOJE)).reverse().slice(0,5);
 const grp=l=>{const g={};l.forEach(e=>(g[e.date]=g[e.date]||[]).push(e));return Object.keys(g).map(d=>`<h3>${d===HOJE?_t('Hoje'):fmt(d)}</h3><div class="card">${g[d].map(evItem).join('')}</div>`).join('')};
 return `<h2>${_t('Agenda')}</h2><div class="card"><input id="at" placeholder="Novo compromisso" onkeydown="if(event.key==='Enter')addEv('ad','at','ah')"><div class="row" style="margin-top:8px"><input type="date" id="ad" value="${HOJE}"><input type="time" id="ah"><button onclick="addEv('ad','at','ah')">Adicionar</button></div></div>`
 +(fut.length?grp(fut):'<div class="vazio">Nenhum compromisso à frente. Adicione o primeiro acima.</div>')
 +(pas.length?'<h3>Anteriores</h3>'+`<div class="card">${pas.map(evItem).join('')}</div>`:'')}

/* ---------- Calendário ---------- */
const shiftIco=p=>{const h=(mins(p.ent)||0)/60;return h>=5&&h<17?'☀️':'🌙'};
const mins=t=>{const a=String(t||'').split(':').map(Number);return a.length<2||isNaN(a[0])||isNaN(a[1])?null:a[0]*60+a[1]};
function durMin(p){const a=mins(p.ent),b=mins(p.sai);if(a==null||b==null)return 0;let d=b-a;if(d<=0)d+=1440;return d}
const fmtDur=m=>{const h=Math.floor(m/60),r=m%60;return h+'h'+(r?String(r).padStart(2,'0'):'')};
const cruza=p=>{const a=mins(p.ent),b=mins(p.sai);return a!=null&&b!=null&&b<=a};
const plSort=(a,b)=>(a.date+a.ent).localeCompare(b.date+b.ent);
function calGrid(kind){
 const y=mes.getFullYear(),m=mes.getMonth(),off=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
 let h=[0,1,2,3,4,5,6].map(i=>new Date(2024,0,7+i).toLocaleDateString(LOC(),{weekday:'narrow'})).map(d=>`<div class="dw">${d}</div>`).join('');
 for(let i=0;i<off+n;i++){
  if(i<off){h+='<div></div>';continue}
  const d=i-off+1,k=iso(new Date(y,m,d)),pls=S.pl.filter(p=>p.date===k),hs=kind==='pl'?[...new Set(pls.map(p=>p.hosp).filter(Boolean))].map(hospBy).filter(Boolean):[];
  const inner=kind==='pl'?(pls.length?`<span class="pmk">${pls.slice(0,2).map(shiftIco).join('')}</span>`+(hs.length?`<span class="hds">${hs.slice(0,3).map(hd).join('')}</span>`:''):''):`<span class="dots">${S.ev.some(e=>e.date===k)?'<i></i>':''}${S.diary[k]?'<i class="dr"></i>':''}${pls.length?'<i class="pl"></i>':''}</span>`;
  h+=`<button class="d ${k===HOJE?'hj':''} ${k===sel?'sel':''} ${kind==='pl'&&pls.length?'plt':''}" ${hs[0]?`data-c="${hs[0].cor}"`:''} onclick="${kind==='pl'?`tapPl('${k}')`:`sel='${k}';edPl=null;render()`}" aria-label="Dia ${d}">${d}${inner}</button>`}
 return h}
const calHead=()=>{const y=mes.getFullYear(),m=mes.getMonth();return `<div class="cal-h"><button class="sec" onclick="mes=new Date(${y},${m-1},1);render()" aria-label="Mês anterior">‹</button><strong>${mes.toLocaleDateString(LOC(),{month:'long',year:'numeric'})}</strong><button class="sec" onclick="mes=new Date(${y},${m+1},1);render()" aria-label="Próximo mês">›</button></div>`};
const calSeg=()=>`<div class="seg">${[['cal','📅 Calendário'],['pl','🩺 Meus Plantões']].map(a=>`<button class="${calSub===a[0]?'on':''}" onclick="calSub='${a[0]}';edPl=null;render()">${a[1]}</button>`).join('')}</div>`;

function porHosp(a){const m=new Map();a.forEach(p=>{const h=hospBy(p.hosp),k=h?h.id:'';let r=m.get(k);if(!r){r={h:h||null,n:0,min:0,val:0};m.set(k,r)}r.n++;r.min+=durMin(p);r.val+=Number(p.val)||0});
 const o=S.hosp.map(h=>m.get(h.id)).filter(Boolean);if(m.get(''))o.push(m.get(''));return o}

 return `<div class="hb">${porHosp(a).map(r=>`<div class="hr"><span class="hn">${r.h?hd(r.h)+' '+esc(r.h.name):'Sem hospital'}</span><span class="hv">${r.n} · ${fmtDur(r.min)} · <b>${BRL(r.val)}</b></span></div>`).join('')}</div>`}
const hospSel=(id,pre,selId)=>S.hosp.length?`<label class="fl2">Hospital<select id="${id}" onchange="plHospCh('${pre}')"><option value="">Sem hospital</option>${S.hosp.map(h=>`<option value="${h.id}" ${h.id===selId?'selected':''}>${esc(h.name)}</option>`).join('')}</select></label>`:'';
const valIn=(id,v)=>`<label class="fl2">Diária (R$)<input type="number" id="${id}" step="0.01" min="0" inputmode="decimal" placeholder="0,00" value="${v?v:''}"></label>`;

function qkH(id){plQuickH=id;render()}
const QK={d:['07:00','19:00'],n:['19:00','07:00']};
function setQuick(k){if(plQuick&&plQuick.k===k){plQuick=null}else{const t=QK[k]||(plQuick&&plQuick.k==='c'?[plQuick.ent,plQuick.sai]:['','']);plQuick={k,ent:t[0],sai:t[1]}}render()}
function setQuickT(f,v){if(plQuick)plQuick[f]=v}
function tapPl(k){
 if(!plQuick){sel=k;edPl=null;render();return}
 if(!plQuick.ent||!plQuick.sai){const e=$(plQuick.ent?'#pq-o':'#pq-i');e&&e.focus();return}
 const hq=hospDef(),hid=hq?hq.id:'',ex=S.pl.find(p=>p.date===k&&p.ent===plQuick.ent&&p.sai===plQuick.sai&&(p.hosp||'')===hid);
 const y=window.scrollY;
 if(ex){const go=()=>{S.pl=S.pl.filter(x=>x.id!==ex.id);sel=k;save();render();window.scrollTo(0,y)};if(ex.obs)ask('Remover este plantão (tem observações)?',go,'Remover');else go();return}
 S.pl.push({id:uid(),date:k,ent:plQuick.ent,sai:plQuick.sai,obs:'',hosp:hid,val:hq&&hq.val?hq.val:0});sel=k;edPl=null;save();render();window.scrollTo(0,y)}
function quickBar(){

 +`<div class="seg">${b('d','☀️ 07–19')}${b('n','🌙 19–07')}${b('c','✏️ Outro')}</div>`

 +`<p class="hint">${q?`Modo ativo${h?' em <b>'+esc(h.name)+'</b>'+(h.val?' (diária '+BRL(h.val)+')':''):''}: toque nos dias para adicionar o plantão. Toque de novo no mesmo dia para remover. Toque no botão ativo para sair do modo.`:'Escolha o tipo de plantão e depois toque nos dias do calendário, quantos quiser.'+(S.hosp.length?'':' Cadastre seus hospitais na aba 🏥 Hospitais.')}</p></div>`}
function savePl(id){const p=S.pl.find(x=>x.id===id),i=$('#pe-i').value,o=$('#pe-o').value;if(!i){$('#pe-i').focus();return}if(!o){$('#pe-o').focus();return}
 p.date=$('#pe-d').value||p.date;p.ent=i;p.sai=o;p.obs=$('#pe-ob').value.trim();if($('#pe-h'))p.hosp=$('#pe-h').value;p.val=vlr($('#pe-v').value);edPl=null;save();render()}

</div>

const plSeg=()=>`<div class="seg s3">${[['reg','✍️ Registrar'],['hist','🗂 Histórico'],['hosp','🏥 Hospitais']].map(a=>`<button class="${plSub===a[0]?'on':''}" onclick="plSub='${a[0]}';edPl=null;edHosp=null;hpCor=null;render()">${a[1]}</button>`).join('')}</div>`;
function addPlH(){const d=$('#ph-d').value,i=$('#ph-i').value,o=$('#ph-o').value;if(!d){$('#ph-d').focus();return}if(!i){$('#ph-i').focus();return}if(!o){$('#ph-o').focus();return}

function vPlHist(){
 const anos=[...new Set(S.pl.map(p=>p.date.slice(0,4)))].sort().reverse();if(plAno!=='todos'&&!anos.includes(plAno))plAno='todos';
 const lista=S.pl.filter(p=>plAno==='todos'||p.date.startsWith(plAno)).sort((a,b)=>plSort(b,a)),tm=lista.reduce((s,p)=>s+durMin(p),0),g={};
 lista.forEach(p=>(g[p.date.slice(0,7)]=g[p.date.slice(0,7)]||[]).push(p));
 return `<h2>${_t('Calendário')}</h2>${calSeg()}${plSeg()}`
 +`<div class="card"><strong>Adicionar plantão ao histórico</strong><input type="date" id="ph-d" value="${HOJE}" style="margin-top:8px"><div class="row" style="margin-top:8px"><label class="fl2">Entrada<input type="time" id="ph-i"></label><label class="fl2">Saída<input type="time" id="ph-o"></label></div><div class="row" style="margin-top:8px"><button class="sec" onclick="$('#ph-i').value='07:00';$('#ph-o').value='19:00'">☀️ 07–19</button><button class="sec" onclick="$('#ph-i').value='19:00';$('#ph-o').value='07:00'">🌙 19–07</button></div><div class="row" style="margin-top:8px">${hospSel('ph-h','ph',(hospDef()||{}).id)}${valIn('ph-v',(hospDef()||{}).val)}</div><textarea id="ph-ob" style="min-height:56px;margin-top:8px" placeholder="Observações (opcional)"></textarea><button style="margin-top:8px;width:100%" onclick="addPlH()">Adicionar ao histórico</button></div>`
 +(anos.length>1?`<div class="seg">${['todos',...anos].map(a=>`<button class="${plAno===a?'on':''}" onclick="plAno='${a}';render()">${a==='todos'?'Todos':a}</button>`).join('')}</div>`:'')
 +`<div class="card tot"><div class="r"><span>Plantões${plAno==='todos'?' no total':' em '+plAno}</span><strong>${lista.length}</strong></div><div class="r"><span>Horas trabalhadas</span><strong>${fmtDur(tm)}</strong></div><div class="r"><span>Total das diárias</span><strong class="mn">${BRL(somaVal(lista))}</strong></div>${breakHtml(lista)}</div>`

const nextCor=()=>{const u=S.hosp.map(h=>h.cor),c=CORES.find(x=>!u.includes(x[0]));return (c||CORES[0])[0]};

let sub='atual',aberto=null,cmp={a:{p:'',s:'',u:'g',q:'1'},b:{p:'',s:'',u:'g',q:'1'}};
const FAM={g:['w',1],kg:['w',1000],ml:['v',1],L:['v',1000],un:['u',1]};
const pct=n=>n.toFixed(1).replace('.',',')+'%';
function side(o){const p=num(o.p),s=num(o.s),q=num(o.q)||1,f=FAM[o.u];if(!(p>0&&s>0))return null;const div=f[0]==='u'?1:1000,amt=s*f[1]*q/div,pay=p*q;return{fam:f[0],pay,amt,per:pay/amt}}
function cm(k,f,v){cmp[k][f]=v;calcCmp()}
function calcCmp(){const el=$('#cres');if(!el)return;const A=side(cmp.a),B=side(cmp.b),msg=t=>{el.innerHTML='<p style="margin:0">'+t+'</p>'};
 if(!A||!B)return msg('Preencha o preço e o tamanho das duas opções para comparar.');
 if(A.fam!==B.fam)return msg('Essas unidades não podem ser comparadas. Use peso (g, kg), volume (ml, L) ou unidades nas duas opções.');
 const lb={w:'kg',v:'L',u:'un'}[A.fam];
 if(Math.abs(A.per-B.per)<1e-9)return msg('As duas opções custam o mesmo por '+lb+' ('+brl(A.per)+'). Não há vantagem em nenhuma delas.');
 const aw=A.per<B.per,w=aw?'A':'B',l=aw?'B':'A',W=aw?A:B,L=aw?B:A,econ=(L.per-W.per)/L.per*100,mais=(L.per-W.per)/W.per*100,sv=(L.per-W.per)*L.amt;
 el.innerHTML=`<div class="r"><span>Opção A</span><b>${brl(A.per)}/${lb}</b></div><div class="r"><span>Opção B</span><b>${brl(B.per)}/${lb}</b></div><div style="border-top:1px solid var(--ac);margin:10px 0"></div><div class="r"><span>Compensa mais</span><strong>Opção ${w}</strong></div><p style="margin:8px 0 0"><b>Vantagem de ${pct(econ)}:</b> a opção ${w} custa ${pct(econ)} menos por ${lb}.</p><p style="margin:6px 0 0"><b>Desvantagem de ${pct(mais)}:</b> a opção ${l} custa ${pct(mais)} mais que a ${w}.</p><p style="margin:6px 0 0;font-size:14px">Para levar o mesmo conteúdo da opção ${l} (${(+L.amt.toFixed(3)).toLocaleString(LOC())} ${lb}) pela opção ${w}, você economiza ${brl(sv)}.</p>`}

function precos(){const P={},rec=[];
 S.hist.forEach(h=>(h.items||[]).forEach(x=>rec.push({market:h.market,date:h.date,title:x.title,price:x.price,unit:x.unit})));

function vMercados(){
 const P=precos(),keys=Object.keys(P).sort((a,b)=>P[a].t.localeCompare(P[b].t)),L=S.shop;

 let lista;

  lista=rows.map(r=>`<div class="item">${logo(r.m,34)}<span class="t"><b>${esc(r.m.nome)}</b><br><small style="color:var(--mute)">${r.c} de ${L.length} ${L.length===1?'item':'itens'} com preço</small></span>${best===r?'<span class="melhor">Mais barato</span>':''}<b>${r.c?brl(r.t):'—'}</b></div>`).join('')+'<p class="hint">O total soma só os itens que têm preço registrado naquele mercado. O selo vai para o mais barato entre os mercados com mais itens cobertos.</p>'}

function vComparar(){
 const box=(k,t)=>`<div class="card"><h3 style="margin:0 0 8px">${t}</h3><input inputmode="decimal" placeholder="Preço da embalagem (R$)" value="${esc(cmp[k].p)}" oninput="cm('${k}','p',this.value)" aria-label="Preço da embalagem"><div class="row" style="margin-top:8px"><input inputmode="decimal" placeholder="Tamanho" value="${esc(cmp[k].s)}" oninput="cm('${k}','s',this.value)" aria-label="Tamanho da embalagem"><select aria-label="Unidade do tamanho" onchange="cm('${k}','u',this.value)">${['g','kg','ml','L','un'].map(u=>`<option ${cmp[k].u===u?'selected':''}>${u}</option>`).join('')}</select><input inputmode="decimal" placeholder="Qtd" value="${esc(cmp[k].q)}" style="width:70px" oninput="cm('${k}','q',this.value)" aria-label="Quantidade de embalagens"></div></div>`;
 return `<p class="hint" style="margin:0 0 10px">Compare dois produtos, ou levar uma ou duas embalagens. Informe o preço de cada embalagem, o tamanho dela e quantas você levaria.</p>`+box('a','Opção A')+box('b','Opção B')+`<div class="card tot" id="cres"></div>`}
const brl=n=>(+n||0).toLocaleString(LOC(),{style:'currency',currency:'BRL'});
const num=v=>{let s=String(v).replace(/[^\d.,-]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^[1-9]\d{0,2}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return parseFloat(s)||0};
const lineTotal=x=>(x.price||0)*(x.qty==null?1:x.qty)/(x.unit==='g'?1000:1);
const tot=l=>l.reduce((s,x)=>s+lineTotal(x),0);
const wt=u=>u==='kg'||u==='g';
const qtyOf=(u,v)=>{const n=num(v);return wt(u)?Math.max(0,n):Math.max(1,n||1)};
const unitSel=(u,cb)=>`<select class="un" onchange="${cb}" aria-label="Unidade">${['un','kg','g'].map(a=>`<option value="${a}" ${(u||'un')===a?'selected':''}>${a}</option>`).join('')}</select>`;
const qtyTxt=x=>wt(x.unit)?String(x.qty).replace('.',',')+' '+x.unit:x.qty;

async function removerSom(){try{await somSet(null)}catch(e){}delete S.notif.sound;save();render()}
function beepIni(){try{beepCtx=beepCtx||new (window.AudioContext||window.webkitAudioContext)();const c=beepCtx;if(c.state==='suspended')c.resume();
 const bip=()=>{[0,.25,.5].forEach(d=>{const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(c.destination);o.start(c.currentTime+d);o.stop(c.currentTime+d+.15)})};
 bip();beepT=setInterval(bip,1500)}catch(e){}}
async function tocar(){pararSom();const b=await somGet();
 if(b){try{alarmAud=new Audio(URL.createObjectURL(b));alarmAud.loop=true;await alarmAud.play();return}catch(e){alarmAud=null}}
 beepIni()}
function pararSom(){if(alarmAud){try{alarmAud.pause()}catch(e){}alarmAud=null}if(beepT){clearInterval(beepT);beepT=null}}
function pararAlarme(){pararSom();clearTimeout(alarmStop);if(alarmOv){alarmOv.remove();alarmOv=null}try{navigator.vibrate&&navigator.vibrate(0)}catch(e){}}
function alarme(title,body){
 pararAlarme();
 try{navigator.vibrate&&navigator.vibrate([500,250,500,250,500])}catch(e){}
 if(!nat()&&document.hidden&&'Notification' in window&&Notification.permission==='granted'){try{new Notification(title,{body})}catch(e){}}
 const o=document.createElement('div');o.className='ov';o.setAttribute('role','alertdialog');
 o.innerHTML=`<div class="dlg alarme"><div class="bell" aria-hidden="true">🔔</div><p>${esc(title)}</p><div class="abody">${esc(body||'')}</div><div class="row"><button id="al-ok" style="background:var(--ac);color:var(--onac)">Parar</button><button class="sec" id="al-sn">Soneca 5 min</button></div></div>`;
 document.body.appendChild(o);alarmOv=o;
 o.querySelector('#al-ok').onclick=pararAlarme;
 o.querySelector('#al-sn').onclick=()=>{pararAlarme();setTimeout(()=>alarme(title,body),300000);const L=LNp();if(nat()&&L)L.schedule({notifications:[{id:nid('sn'+Date.now()),title,body:(body||'')+' (soneca)',channelId:'agenda',schedule:{at:new Date(Date.now()+300000),allowWhileIdle:true}}]}).catch(()=>{})};
 tocar();alarmStop=setTimeout(pararAlarme,90000)}
function tick(){if(!S.notif||!S.notif.on||!S.user.name)return;const now=Date.now();
 gatilhos().filter(x=>x.at<=now&&x.at>now-5*60000&&!fired.has(x.key+'@'+x.at)).forEach(x=>{
  fired.add(x.key+'@'+x.at);alarme(x.title,x.body)});
 try{const a=[...fired];localStorage.setItem('mp-fired',JSON.stringify(a.slice(-200)))}catch(e){}}
function initLembretes(){setInterval(tick,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();schedSoon()}});
 const L=LNp();if(nat()&&L){try{L.addListener('localNotificationReceived',()=>tick());L.addListener('localNotificationActionPerformed',()=>tick())}catch(e){}schedSoon()}
 setTimeout(tick,1500)}
function cfgLembretes(){const N=S.notif,on=N.on,sn=N.sound,app=nat();
 const sel=(id,l,opts,cur,fn)=>`<label class="fl" for="${id}">${l}</label><select id="${id}" style="width:100%" onchange="${fn}">${opts.map(o=>`<option value="${o[0]}" ${+o[0]===+cur?'selected':''}>${o[1]}</option>`).join('')}</select>`;
 return `<h3>${_t('Lembretes e alarme')}</h3><div class="card"><button class="${on?'sec':''}" style="width:100%" onclick="ativarLembretes(${!on})">${on?'🔔 Lembretes ativados · tocar para desativar':'🔕 Ativar lembretes de compromissos'}</button>`
 +(on?sel('nt-l','Avisar compromissos',[[0,'Na hora'],[5,'5 min antes'],[10,'10 min antes'],[15,'15 min antes'],[30,'30 min antes'],[60,'1 hora antes']],N.lead,"setNotif('lead',this.value)")
  +sel('nt-p','Lembrar meus plantões',[[0,'Não lembrar'],[30,'30 min antes'],[60,'1 hora antes'],[120,'2 horas antes'],[180,'3 horas antes']],N.plOn?N.plLead:0,"setNotif('plLead',this.value)"):'')
 +`<label class="fl">Música do alarme</label><div class="somnome">🎵 ${sn?esc(sn.name):'Som padrão (bipes)'}</div><div class="row" style="margin-top:8px"><button class="sec" onclick="$('#nt-f').click()">🎵 Escolher música</button><button class="sec" onclick="alarme('Teste do alarme','É assim que o alarme vai tocar.')">▶ Testar</button>${sn?'<button class="ghost" onclick="removerSom()">Remover</button>':''}</div><input type="file" id="nt-f" accept="audio/*" style="display:none" onchange="escolherSom(this)">`
 +`<p class="hint">Escolha qualquer música dos arquivos do seu celular. Com o app aberto, ou ao tocar na notificação, a música toca em repetição até você parar. Com o app fechado, o celular mostra a notificação com o som padrão dele, pois o Android não deixa um app trocar o som sem estar aberto.${app?'':' Neste navegador os avisos só funcionam com a página aberta.'} A música fica só neste aparelho e não entra no backup.</p></div>`}


/* ---------- Carteira (v1.6) ---------- */
const CCATS=[['contas','🏠','Contas'],['feira','🛒','Feira / mercado'],['extra','🎉','Gastos extras'],['transp','🚗','Transporte'],['saude','💊','Saúde'],['outros','📦','Outros']];
const ccat=id=>CCATS.find(c=>c[0]===id)||CCATS[5];
const cR2=n=>Math.round((+n||0)*100)/100;
const cSum=a=>cR2(a.reduce((s,x)=>s+(+x.val||0),0));
function normCart(){
 const c=S.cart=(S.cart&&typeof S.cart==='object'&&!Array.isArray(S.cart))?S.cart:{};
 c.base=cR2(c.base);delete c.usePl;
 ['rendas','fixas','gastos'].forEach(k=>{c[k]=Array.isArray(c[k])?c[k].filter(x=>x&&typeof x==='object'):[]});
 c.fixas.forEach(f=>{f.val=cR2(f.val);f.dia=Math.min(31,Math.max(1,parseInt(f.dia)||1));f.desc=String(f.desc||'');f.cat=f.cat||'contas';f.ini=f.ini||HOJE.slice(0,7)});
 c.gastos.forEach(g=>{g.val=cR2(g.val);g.date=g.date||HOJE;g.cat=g.cat||'outros';g.desc=String(g.desc||'')});
 c.rendas.forEach(r=>{r.val=cR2(r.val);r.m=r.m||HOJE.slice(0,7);r.desc=String(r.desc||'')});
 c.pagas=(c.pagas&&typeof c.pagas==='object'&&!Array.isArray(c.pagas))?c.pagas:{};
 const N=S.notif=S.notif||{};if(N.cwOn===undefined)N.cwOn=true;if(N.cwLead===undefined||isNaN(+N.cwLead))N.cwLead=2;if(!/^\d{2}:\d{2}$/.test(N.cwHora||''))N.cwHora='09:00'}
let cSub='res',cMes=HOJE.slice(0,7),cEd=null;
/* aceita 1500 | 1500,50 | 1.500,50 | 1.500 | 15.5 */
const cNum=v=>{let s=String(v==null?'':v).trim().replace(/[^\d.,]/g,'');
 if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');
 else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
 const n=parseFloat(s);return isNaN(n)||n<0?0:cR2(n)};
const cTxt=n=>n?String(cR2(n)).replace('.',','):'';
const cMesTxt=()=>new Date(cMes+'-01T12:00').toLocaleDateString(LOC(),{month:'long',year:'numeric'});
const cAtual=()=>cMes===HOJE.slice(0,7);
const cDataPad=()=>cAtual()?HOJE:cMes+'-01';
const cPrev=m=>{const a=m.split('-').map(Number);return iso(new Date(a[0],a[1]-2,1)).slice(0,7)};
function cMove(n){const a=cMes.split('-').map(Number);cMes=iso(new Date(a[0],a[1]-1+n,1)).slice(0,7);cEd=null;render()}
const cFix=m=>S.cart.fixas.filter(f=>f.ini<=m&&(!f.fim||m<=f.fim)).sort((a,b)=>a.dia-b.dia||a.desc.localeCompare(b.desc));
const cPago=(m,id)=>!!(S.cart.pagas[m]&&S.cart.pagas[m][id]);
const cGas=m=>S.cart.gastos.filter(g=>g.date.slice(0,7)===m).sort((a,b)=>b.date.localeCompare(a.date));
const cRen=m=>S.cart.rendas.filter(r=>r.m===m);
function cCalc(m){
 const c=S.cart,fx=cFix(m),gs=cGas(m),re=cRen(m);
 const rExtra=cSum(re),renda=cR2(c.base+rExtra);
 const fixTot=cSum(fx),fixPago=cSum(fx.filter(f=>cPago(m,f.id))),gasTot=cSum(gs);
 const gastos=cR2(fixTot+gasTot),porCat={};
 fx.concat(gs).forEach(x=>{const k=ccat(x.cat)[0];porCat[k]=cR2((porCat[k]||0)+x.val)});
 return {fx,gs,re,rExtra,renda,fixTot,fixPago,gasTot,gastos,porCat,sobra:cR2(renda-gastos),falta:cR2(fixTot-fixPago)}}
const cSel=(id,cur)=>`<select id="${id}" aria-label="Categoria">${CCATS.map(c=>`<option value="${c[0]}" ${c[0]===cur?'selected':''}>${c[1]} ${c[2]}</option>`).join('')}</select>`;
const cClear=ids=>ids.forEach(i=>{const e=$('#'+i);if(e)e.value=''});
const cFoco=id=>{const e=$('#'+id);if(e)e.focus()};

function vCarteira(){
 const k=cCalc(cMes);
 const seg=`<div class="seg s4">${[['res','📊 Resumo'],['gas','💸 Gastos'],['fix','📌 Fixas'],['ren','💵 Renda']].map(a=>`<button class="${cSub===a[0]?'on':''}" onclick="cSub='${a[0]}';cEd=null;render()">${a[1]}</button>`).join('')}</div>`;
 const nv=`<div class="cal-h"><button class="sec" onclick="cMove(-1)" aria-label="Mês anterior">‹</button><strong class="cw-m">${esc(cMesTxt())}</strong><button class="sec" onclick="cMove(1)" aria-label="Próximo mês">›</button></div>`;
 return `<h2>${_t('Carteira')}</h2>`+seg+nv+(cSub==='res'?cResumo(k):cSub==='gas'?cGastos(k):cSub==='fix'?cFixas(k):cRenda(k))}

/* --- Resumo --- */
function cResumo(k){
 const real=k.renda>0?Math.round(k.gastos/k.renda*100):(k.gastos>0?100:0),cap=Math.min(100,real);
 const cls=k.renda>0&&k.gastos>k.renda?'over':real>=80?'warn':'';
 const aviso=k.renda<=0?`<p class="hint">Informe quanto você ganha na aba <b>Renda</b> para ver quanto sobra no mês.</p>`
  :k.gastos>k.renda?`<p class="cw-warn">⚠️ Os gastos passaram da renda em ${BRL(-k.sobra)}.</p>`
  :real>=80?`<p class="cw-warn">Atenção: você já usou ${real}% da renda do mês.</p>`:'';
 const cats=CCATS.map(c=>[c,k.porCat[c[0]]||0]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
 const catHtml=cats.length?cats.map(x=>{const p=k.gastos>0?Math.round(x[1]/k.gastos*100):0;return `<div class="cw-cat"><div class="top"><span>${x[0][1]} ${x[0][2]}</span><span class="cw-v">${BRL(x[1])} <small style="color:var(--mute);font-weight:500">· ${p}%</small></span></div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join(''):'<div class="vazio" style="padding:14px 8px">Nenhum gasto lançado neste mês.</div>';
 return `<div class="card tot">
  <div class="cw-row"><span>💵 Renda do mês</span><b class="cw-in">${BRL(k.renda)}</b></div>
  <div class="cw-row"><span>💸 Gastos do mês</span><b class="cw-out">${BRL(k.gastos)}</b></div>
  <div class="cw-sobra"><span>${k.sobra<0?'Falta':'Sobra'}</span><strong class="${k.sobra<0?'neg':''}">${BRL(Math.abs(k.sobra))}</strong></div>
  <div class="cw-bar ${cls}" role="progressbar" aria-valuenow="${cap}" aria-valuemin="0" aria-valuemax="100" aria-label="Quanto da renda já foi usada"><i style="width:${cap}%"></i></div>
  <small style="color:var(--mute)">${k.renda>0?'Você usou '+real+'% da renda':'Sem renda informada'}</small>${aviso}
  ${k.falta>0?`<p class="hint">📌 Contas fixas ainda por pagar: <b>${BRL(k.falta)}</b></p>`:''}</div>
 <div class="row"><button style="flex:1" onclick="cSub='gas';render();cFoco('cw-gd')">＋ Lançar gasto</button><button class="sec" style="flex:1" onclick="cSub='fix';render()">📌 Contas fixas</button></div>
 <h3>Para onde foi o dinheiro</h3><div class="card">${catHtml}</div>`}

/* --- Gastos avulsos --- */
function cEditForm(kind,x){
 return `<div class="item" style="flex-wrap:wrap"><input id="cw-e-d" value="${esc(x.desc)}" placeholder="${kind==='f'?'Conta':'Descrição'}" aria-label="Descrição">
  <div class="row" style="width:100%"><input id="cw-e-v" inputmode="decimal" value="${cTxt(x.val)}" placeholder="Valor" aria-label="Valor">${kind==='g'?`<input type="date" id="cw-e-dt" value="${x.date}" aria-label="Data">`:`<input id="cw-e-dia" type="number" min="1" max="31" inputmode="numeric" value="${x.dia}" style="width:96px" aria-label="Dia do vencimento">`}${cSel('cw-e-c',x.cat)}</div>
  <div class="row" style="width:100%"><button onclick="cSaveEd()">Salvar</button><button class="ghost" onclick="cEd=null;render()">Cancelar</button></div></div>`}
function cGItem(g){
 if(cEd&&cEd.k==='g'&&cEd.id===g.id)return cEditForm('g',g);
 const c=ccat(g.cat);
 return `<div class="item"><span class="cw-ic" aria-hidden="true">${c[1]}</span><div class="t" onclick="cEdit('g','${g.id}')" style="cursor:pointer"><b>${esc(g.desc||c[2])}</b><br><small style="color:var(--mute)">${fmt(g.date,{weekday:'short',day:'2-digit',month:'short'})} · ${c[2]}</small></div><b class="cw-v">${BRL(g.val)}</b><button class="ghost" onclick="cDelG('${g.id}')" aria-label="Excluir gasto">✕</button></div>`}
function cGastos(k){
 const form=`<div class="card"><input id="cw-gd" placeholder="O que foi? (ex.: Feira, Uber, Presente)" maxlength="60" onkeydown="if(event.key==='Enter')cFoco('cw-gv')">
  <div class="row" style="margin-top:8px"><input id="cw-gv" inputmode="decimal" placeholder="Valor (R$)" onkeydown="if(event.key==='Enter')cAddG()">${cSel('cw-gc','feira')}</div>
  <div class="row" style="margin-top:8px"><input type="date" id="cw-gdt" value="${cDataPad()}" aria-label="Data"><button onclick="cAddG()">＋ Adicionar</button></div></div>`;
 return form+`<h3>Gastos do mês · ${BRL(k.gasTot)}</h3>`+(k.gs.length?`<div class="card">${k.gs.map(cGItem).join('')}</div><p class="hint">Toque em um gasto para editar.</p>`:'<div class="vazio">Nenhum gasto avulso neste mês.</div>')}
function cAddG(){
 const d=$('#cw-gd').value.trim(),v=cNum($('#cw-gv').value),c=$('#cw-gc').value,dt=$('#cw-gdt').value||HOJE;
 if(!v){info('Informe o valor do gasto.');return}
 S.cart.gastos.push({id:uid(),date:dt,cat:c,desc:d,val:v});cMes=dt.slice(0,7);
 save();render();cClear(['cw-gd','cw-gv']);cFoco('cw-gd')}
function cDelG(id){ask('Excluir este gasto?',()=>{S.cart.gastos=S.cart.gastos.filter(x=>x.id!==id);save();render()})}
function cEdit(kind,id){cEd={k:kind,id:id};render();cFoco('cw-e-v')}
function cSaveEd(){
 if(!cEd)return;const L=cEd.k==='g'?S.cart.gastos:cEd.k==='r'?S.cart.rendas:S.cart.fixas,x=L.find(i=>i.id===cEd.id);
 if(!x){cEd=null;render();return}
 const v=cNum($('#cw-e-v').value),d=$('#cw-e-d').value.trim();
 if(!v){info('Informe o valor.');return}
 if(cEd.k==='f'&&!d){info('Informe o nome da conta.');return}
 x.desc=d;x.val=v;if(cEd.k!=='r')x.cat=$('#cw-e-c').value;
 if(cEd.k==='g'){x.date=$('#cw-e-dt').value||x.date;cMes=x.date.slice(0,7)}
 else if(cEd.k==='f')x.dia=Math.min(31,Math.max(1,parseInt($('#cw-e-dia').value)||x.dia));
 cEd=null;save();render()}

/* --- Contas fixas (repetem todo mês) --- */
function cFItem(f){
 if(cEd&&cEd.k==='f'&&cEd.id===f.id)return cEditForm('f',f);
 const pg=cPago(cMes,f.id),atr=!pg&&cAtual()&&f.dia<(+HOJE.slice(8,10)),c=ccat(f.cat);
 return `<div class="item ${pg?'done':''}"><input type="checkbox" ${pg?'checked':''} onchange="cTogPago('${f.id}')" aria-label="Marcar como paga"><div class="t" onclick="cEdit('f','${f.id}')" style="cursor:pointer"><b>${esc(f.desc)}</b><br><small class="${atr?'cw-late':''}" ${atr?'':'style="color:var(--mute)"'}>${c[1]} vence dia ${f.dia}${pg?' · paga ✓':atr?' · atrasada':''}</small></div><b class="cw-v">${BRL(f.val)}</b><button class="ghost" onclick="cDelF('${f.id}')" aria-label="Remover conta fixa">✕</button></div>`}
/* --- Lembrete de contas perto de vencer --- */
function cwGatilhos(N){
 const out=[],hh=String(N.cwHora||'09:00').split(':').map(Number),H=isNaN(hh[0])?9:hh[0],M=isNaN(hh[1])?0:hh[1],lead=Math.max(0,+N.cwLead||0),now=new Date();
 for(let k=0;k<3;k++){
  const base=new Date(now.getFullYear(),now.getMonth()+k,1),ym=iso(base).slice(0,7),ult=new Date(base.getFullYear(),base.getMonth()+1,0).getDate();
  cFix(ym).forEach(f=>{
   if(cPago(ym,f.id))return;
   const dia=Math.min(f.dia,ult),venc=new Date(base.getFullYear(),base.getMonth(),dia,H,M,0,0),
    dd=String(dia).padStart(2,'0')+'/'+String(base.getMonth()+1).padStart(2,'0'),corpo=BRL(f.val)+' · vencimento em '+dd;
   if(lead>0){const a=new Date(venc.getTime());a.setDate(a.getDate()-lead);
    out.push({key:'c'+f.id+ym+'a',at:a.getTime(),title:'💰 '+f.desc+' vence '+(lead===1?'amanhã':'em '+lead+' dias'),body:corpo})}
   out.push({key:'c'+f.id+ym+'b',at:venc.getTime(),title:'💰 '+f.desc+' vence hoje',body:corpo+' · ainda não está marcada como paga'})})}
 return out}
function setCw(k,v){S.notif[k]=k==='cwOn'?!!v:k==='cwHora'?String(v||'09:00'):+v;save();agendarNotifs(true);render()}
function cwLembrete(){
 const N=S.notif,sn=N.sound;
 if(!N.on)return `<div class="card"><b>🔔 Lembrete de contas</b><p class="hint" style="margin:6px 0 10px">Receba um aviso no celular antes de a conta vencer, com o alarme que você escolher.</p><button style="width:100%" onclick="ativarLembretes(true)">🔔 Ativar lembretes</button></div>`;
 const on=N.cwOn!==false,opts=[[0,'Só no dia do vencimento'],[1,'1 dia antes'],[2,'2 dias antes'],[3,'3 dias antes'],[5,'5 dias antes'],[7,'7 dias antes']];
 return `<div class="card"><button class="${on?'sec':''}" style="width:100%" onclick="setCw('cwOn',${!on})">${on?'🔔 Avisos de contas ligados · tocar para desligar':'🔕 Avisos de contas desligados · tocar para ligar'}</button>`
 +(on?`<label class="fl" for="cw-lead">Avisar</label><select id="cw-lead" style="width:100%" onchange="setCw('cwLead',this.value)">${opts.map(o=>`<option value="${o[0]}" ${o[0]===(+N.cwLead||0)?'selected':''}>${o[1]}</option>`).join('')}</select>`
  +`<label class="fl" for="cw-hora">Horário do aviso</label><input type="time" id="cw-hora" value="${esc(N.cwHora||'09:00')}" onchange="setCw('cwHora',this.value)">`
  +`<label class="fl">Alarme</label><div class="somnome">🎵 ${sn?esc(sn.name):'Som padrão (bipes)'}</div><div class="row" style="margin-top:8px"><button class="sec" onclick="$('#cw-snd').click()">🎵 Escolher música</button><button class="sec" onclick="alarme('💰 Teste de aviso de conta','É assim que o alarme vai tocar.')">▶ Testar</button>${sn?'<button class="ghost" onclick="removerSom()">Remover</button>':''}</div><input type="file" id="cw-snd" accept="audio/*" style="display:none" onchange="escolherSom(this)">`
  +`<p class="hint">Você é avisado até o dia do vencimento, e some o aviso assim que marcar a conta como paga. Com o app aberto, ou ao tocar na notificação, a música escolhida toca em repetição até você parar. Com o app fechado, o celular usa o som padrão dele. O mesmo alarme vale para os lembretes da agenda.</p>`:'')+`</div>`}
function cFixas(k){
 const form=`<div class="card"><input id="cw-fd" placeholder="Conta (ex.: Aluguel, Luz, Internet)" maxlength="60" onkeydown="if(event.key==='Enter')cFoco('cw-fv')">
  <div class="row" style="margin-top:8px"><input id="cw-fv" inputmode="decimal" placeholder="Valor (R$)" onkeydown="if(event.key==='Enter')cAddF()"><input id="cw-fdia" type="number" min="1" max="31" inputmode="numeric" placeholder="Vence dia" style="width:116px" onkeydown="if(event.key==='Enter')cAddF()"></div>
  <div class="row" style="margin-top:8px">${cSel('cw-fc','contas')}<button onclick="cAddF()">＋ Adicionar</button></div>
  <p class="hint">A conta passa a aparecer todo mês, a partir de ${esc(cMesTxt())}. Marque ✓ quando pagar.</p></div>`;
 const resumo=k.fx.length?`<div class="card tot"><div class="cw-row"><span>Total das contas fixas</span><b>${BRL(k.fixTot)}</b></div><div class="cw-row"><span>✓ Já pago</span><b class="cw-in">${BRL(k.fixPago)}</b></div><div class="cw-row"><span>A pagar</span><b class="${k.falta>0?'cw-out':''}">${BRL(k.falta)}</b></div></div>`:'';

const PINK='mp-pin';
const pinRec=()=>{try{return JSON.parse(localStorage.getItem(PINK)||'null')}catch(e){return null}};
const pinSave=r=>{try{if(r)localStorage.setItem(PINK,JSON.stringify(r));else localStorage.removeItem(PINK);return true}catch(e){return false}};
async function pinHash(p,salt){const s=salt+':'+p;
 try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
 let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return 'f'+h.toString(16)}
let PIN_LK=null,pinHidAt=0;
/* Mostra o teclado numérico. o={title,sub,lock,forgot,cancel,check(v)->null|mensagem}. Resolve com os 4 dígitos, ou null se cancelar. */
function pinEntry(o){return new Promise(res=>{
 const el=document.createElement('div'),lg=document.querySelector('.logo');
 el.className=o.lock?'pinlock':'ov';el.setAttribute('role','dialog');el.setAttribute('aria-label',o.title);
 el.innerHTML=`<div class="${o.lock?'pinbox':'dlg pinbox'}">${o.lock&&lg?lg.outerHTML.replace('class="logo"','class="logo big"'):''}<div class="pt">${esc(o.title)}</div><div class="pd">${esc(o.sub||'')}</div><div class="pdots" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div class="pmsg" role="alert"></div><div class="pgrid">`
  +[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-k="${n}">${n}</button>`).join('')
  +`<button type="button" class="fn" data-k="${o.cancel?'x':o.forgot?'f':''}">${o.cancel?'Cancelar':o.forgot?'Esqueci':''}</button><button type="button" data-k="0">0</button><button type="button" class="fn" data-k="b" aria-label="Apagar">⌫</button></div></div>`;
 document.body.appendChild(el);
 let v='',busy=false;const dots=[...el.querySelectorAll('.pdots i')],msg=el.querySelector('.pmsg'),dg=el.querySelector('.pdots');
 const paint=()=>dots.forEach((d,i)=>d.classList.toggle('f',i<v.length));
 const end=r=>{document.removeEventListener('keydown',kd,true);el.remove();res(r)};
 async function press(k){if(busy)return;
  if(k==='x'){end(null);return}
  if(k==='f'){pinForgot();return}
  if(k==='b'){v=v.slice(0,-1);msg.textContent='';paint();return}
  if(!/^\d$/.test(k)||v.length>=4)return;
  v+=k;msg.textContent='';paint();
  if(v.length<4)return;
  busy=true;await new Promise(r=>setTimeout(r,120));
  const bad=o.check?await o.check(v):null;
  if(!bad){end(v);return}
  msg.textContent=bad;dg.classList.remove('sh');void dg.offsetWidth;dg.classList.add('sh');
  try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}
  v='';paint();busy=false}
 function kd(e){if(!document.body.contains(el))return;
  if(/^\d$/.test(e.key)){e.preventDefault();e.stopPropagation();press(e.key)}
  else if(e.key==='Backspace'){e.preventDefault();press('b')}
  else if(e.key==='Escape'&&o.cancel){e.preventDefault();press('x')}}
 document.addEventListener('keydown',kd,true);
 el.addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(b&&b.dataset.k)press(b.dataset.k)});
})}
const pinChecker=r=>async v=>{
 const n=Date.now();if(r.u&&n<r.u)return 'Muitas tentativas. Aguarde '+Math.ceil((r.u-n)/1000)+' s.';
 if((await pinHash(v,r.s))===r.h){if(r.f||r.u){r.f=0;r.u=0;pinSave(r)}return null}
 r.f=(r.f||0)+1;if(r.f%5===0){r.u=Date.now()+Math.min(300,30*(r.f/5))*1000;pinSave(r);return 'Senha incorreta. Aguarde '+Math.ceil((r.u-Date.now())/1000)+' s.'}
 pinSave(r);return 'Senha incorreta.'};
function lockApp(){const r=pinRec();if(!r||PIN_LK)return PIN_LK||Promise.resolve();
 PIN_LK=pinEntry({lock:true,forgot:true,title:'Digite sua senha',sub:'JC ORGANIZA está protegido',check:pinChecker(r)}).then(()=>{PIN_LK=null;pinHidAt=0});
 return PIN_LK}
function pinForgot(){
 ask('Não existe recuperação de senha. Para entrar de novo, é preciso APAGAR todos os dados deste aparelho (agenda, notas, diário…). Se tiver um backup, você poderá restaurá-lo depois. Continuar?',()=>{
  ask('Tem certeza? Esta ação não pode ser desfeita.',()=>{
   try{['minha-agenda','minha-agenda-logos','minha-agenda-fotos','mp-fired',PINK,'mp-perm-asked'].forEach(k=>localStorage.removeItem(k))}catch(e){}
   try{indexedDB.deleteDatabase('meu-plano-som')}catch(e){}
   location.reload()},'Apagar tudo')},'Continuar')}
async function pinNova(titulo){
 const a=await pinEntry({title:titulo||'Crie sua senha',sub:'Escolha 4 números',cancel:true});if(a===null)return null;

 return b}
async function pinCriar(){const p=await pinNova();if(p===null)return;
 const s=uid()+uid(),r={s,h:await pinHash(p,s),g:60,f:0,u:0};
 if(!pinSave(r)||!pinRec()){info('Não foi possível guardar a senha neste aparelho.');return}

 r.s=uid()+uid();r.h=await pinHash(p,r.s);r.f=0;r.u=0;pinSave(r);render();info('Senha alterada.')}

function pinGrace(v){const r=pinRec();if(!r)return;r.g=+v;pinSave(r);render()}
function cfgSeguranca(){const r=pinRec();

 return `<h3>${_t('Segurança')}</h3><div class="card">`

   +`<div class="row"><button class="sec" style="flex:1" onclick="pinAlterar()">Alterar senha</button><button class="sec" style="flex:1" onclick="pinRemover()">Remover</button></div>`

  :`<button style="width:100%" onclick="pinCriar()">🔓 Criar senha de 4 dígitos</button><p class="hint">Proteja o app com uma senha numérica. Ela será pedida sempre que abrir o JC ORGANIZA.</p>`)

async function permStatus(){
 const out={arq:'na',aud:'na',not:'na',cam:'na'};
 if(!nat()){if('Notification' in window)out.not={granted:'granted',denied:'denied'}[Notification.permission]||'prompt';try{const q=await navigator.permissions.query({name:'camera'});out.cam=q.state}catch(e){}return out}
 const L=LNp(),M=MPp(),F=plug('Filesystem');
 try{if(L)out.not=(await L.checkPermissions()).display}catch(e){}
 try{if(M){const p=await M.checkPermissions();out.arq=(p.images==='granted'&&p.video==='granted')?'granted':(p.images==='denied'||p.video==='denied'?'denied':'prompt');out.aud=p.audio;out.cam=p.camera||'prompt'}
  else if(F){const p=await F.checkPermissions();out.arq=p.publicStorage}}catch(e){}

   if(nat()&&L){const p=await L.requestPermissions();if(p.display!=='granted'&&!quiet)info('Notificações bloqueadas. Ative em: Ajustes do celular › Apps › JC ORGANIZA › Notificações.')}

   else if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){const st=await navigator.mediaDevices.getUserMedia({video:true});st.getTracks().forEach(t=>t.stop())}

   else if(nat()&&F)await F.requestPermissions();
   else if(!quiet)info('No navegador, o acesso é pedido quando você escolhe um arquivo.');
  }else if(id==='aud'){
   if(nat()&&M)await M.requestPermissions({permissions:['audio']});

  }
 }catch(e){if(!quiet)info('Não foi possível pedir esta permissão agora.')}
 permRefresh()}

function parseEtiquetas(txt){
 const lines=String(txt||'').split(/\r?\n/).map(l=>l.replace(/[|_~=•«»]+/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean);
 const R1=/(?:R\s*\$?\s*)?(\d{1,4})\s*[,.]\s*(\d{2})(?!\d)/,R2=/R\s*\$\s*(\d{1,3})\s+(\d{2})(?!\d)/;
 const letras=s=>(s.match(/[A-Za-zÀ-ÿ]/g)||[]).length;
 const ruido=s=>/^(oferta|promocao|preco|por|de|cod|codigo|ean|un|kg|unid|unidade|leve|pague|economize|validade|data|r)$/.test(nrm(s).replace(/[^a-z ]/g,'').trim());
 const titulo=s=>{const up=s.replace(/[^A-Za-zÀ-ÿ]/g,'');return up&&up===up.toUpperCase()?s.toLowerCase().replace(/(^|[\s\-\/])([a-zà-ÿ])/g,(m,a,b)=>a+b.toUpperCase()):s};
 const limpa=s=>titulo(String(s).replace(/\b\d{6,}\b/g,' ').replace(/[^\wÀ-ÿ%.,\/\- ]/g,' ').replace(/\s+/g,' ').replace(/^[\s.,\-\/]+|[\s.,\-\/]+$/g,'')).slice(0,60);
 const out=[];let nome=[];
 for(const l of lines){
  let m=l.match(R1),p=null,rest=l;
  if(m){p=parseFloat(m[1]+'.'+m[2]);rest=l.replace(R1,' ')}
  else{m=l.match(R2);if(m){p=parseFloat(m[1]+'.'+m[2]);rest=l.replace(R2,' ')}}
  if(p!=null&&p>=0.05&&p<10000){
   rest=rest.replace(/R\s*\$/g,' ').trim();
   let nm=nome.join(' ');
   if(!nm&&letras(rest)>=4)nm=rest;
   const kg=/\bkg\b|\/\s*kg|quilo/i.test(l+' '+nm);
   out.push({on:true,nome:limpa(nm),preco:String(p.toFixed(2)).replace('.',','),un:kg?'kg':'un'});
   nome=[];
  }else if(letras(l)>=3&&!ruido(l)){nome.push(l);if(nome.length>3)nome.shift()}
 }
 return out}

function scTopo(){return `<div class="sc-top"><b>📷 Preços em ${esc(S.market)}</b><button onclick="scFechar()" aria-label="Fechar">✕ Fechar</button></div>`}
function scParar(){if(SC.stream){try{SC.stream.getTracks().forEach(t=>t.stop())}catch(e){}SC.stream=null}}
function scFechar(){scParar();if(SC.worker){try{SC.worker.terminate()}catch(e){}SC.worker=null}const o=$('#scan');if(o)o.remove();document.body.style.overflow=''}

function abrirScanner(){
 if(!(S.market||'').trim()){tab='compras';sub='atual';escMk=true;nav();render();window.scrollTo(0,0);info('Escolha primeiro em qual mercado você está. Depois toque em Escanear.');return}
 if($('#scan'))return;
 const o=document.createElement('div');o.id='scan';o.className='scan';o.setAttribute('role','dialog');o.setAttribute('aria-label','Escanear preços');
 document.body.appendChild(o);document.body.style.overflow='hidden';
 SC.rows=[];SC.thumb='';scCam()}

async function scCam(){
 const o=$('#scan');if(!o)return;scParar();
 o.innerHTML=scTopo()+`<div class="sc-cam"><video id="sc-v" autoplay playsinline muted></video><div class="sc-guia"></div><div class="sc-dica">Enquadre a etiqueta (nome e preço) e toque no botão branco.</div><div class="sc-msg" id="sc-m"><p>Abrindo a câmera…</p></div></div>`
 +`<div class="sc-bar"><button onclick="$('#sc-f').click()">🖼️ Foto</button><button class="sc-shot" id="sc-b" onclick="scFoto()" aria-label="Tirar foto" disabled></button><button onclick="scRev()" ${SC.rows.length?'':'disabled'}>Itens (${SC.rows.length})</button></div>`
 +`<input type="file" id="sc-f" accept="image/*" capture="environment" hidden onchange="scArquivo(this)">`;
 try{
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia))throw new Error('semcam');
  const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
  if(!$('#scan')){st.getTracks().forEach(t=>t.stop());return}
  SC.stream=st;const v=$('#sc-v');v.srcObject=st;try{await v.play()}catch(e){}
  const m=$('#sc-m');if(m)m.remove();const b=$('#sc-b');if(b)b.disabled=false;
 }catch(e){
  const m=$('#sc-m');if(m)m.innerHTML=`<p style="font-size:42px;margin:0">📷</p><p>Não foi possível abrir a câmera ao vivo.${nat()?' Confira se a permissão da câmera está liberada.':''}</p><div class="row" style="justify-content:center"><button onclick="$('#sc-f').click()">Tirar foto pelo celular</button>${nat()?'<button class="sec" onclick="permAjustes()">Ajustes do celular</button>':''}</div>`}}

function scQuadro(src,w,h){const k=Math.min(1,1600/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));c.getContext('2d').drawImage(src,0,0,c.width,c.height);return c}
function scFoto(){const v=$('#sc-v');if(!v||!v.videoWidth)return;const c=scQuadro(v,v.videoWidth,v.videoHeight);scParar();scLer(c)}
function scArquivo(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;scParar();
 const u=URL.createObjectURL(f),im=new Image();
 im.onload=()=>{const c=scQuadro(im,im.naturalWidth||im.width,im.naturalHeight||im.height);URL.revokeObjectURL(u);scLer(c)};
 im.onerror=()=>{URL.revokeObjectURL(u);info('Não foi possível abrir essa foto.');scCam()};im.src=u}
function scPrep(c){const o=document.createElement('canvas');o.width=c.width;o.height=c.height;const x=o.getContext('2d');x.drawImage(c,0,0);
 const d=x.getImageData(0,0,o.width,o.height),p=d.data;let mn=255,mx=0;
 for(let i=0;i<p.length;i+=4){const g=(p[i]*.3+p[i+1]*.59+p[i+2]*.11)|0;p[i]=p[i+1]=p[i+2]=g;if(g<mn)mn=g;if(g>mx)mx=g}
 const k=mx>mn?255/(mx-mn):1;for(let i=0;i<p.length;i+=4){const g=Math.max(0,Math.min(255,((p[i]-mn)*k)|0));p[i]=p[i+1]=p[i+2]=g}
 x.putImageData(d,0,0);return o}
function scProg(f,txt){const e=$('#sc-pg');if(e)e.style.width=Math.round(Math.max(0,Math.min(1,f||0))*100)+'%';const t=$('#sc-pt');if(t&&txt)t.textContent=txt}
async function scLer(c){
 try{const k=Math.min(1,160/Math.max(c.width,c.height)),s=document.createElement('canvas');s.width=Math.round(c.width*k);s.height=Math.round(c.height*k);s.getContext('2d').drawImage(c,0,0,s.width,s.height);SC.thumb=s.toDataURL('image/jpeg',.6)}catch(e){SC.thumb=''}
 scRev(true);
 let aviso='';
 try{
  const T=await loadTess();
  if(!SC.worker)SC.worker=await T.createWorker((LANGS.find(l=>l[0]===LANG)||LANGS[0])[3],1,{logger:m=>{if(m&&typeof m.progress==='number')scProg(m.progress,m.status==='recognizing text'?'Lendo o texto da foto…':'Preparando o leitor (só na primeira vez)…')}});
  const r=await SC.worker.recognize(scPrep(c)),novos=parseEtiquetas(r&&r.data&&r.data.text);
  if(novos.length)SC.rows=SC.rows.concat(novos);
  else{SC.rows.push({on:true,nome:'',preco:'',un:'un'});aviso='Não consegui ler um preço nesta foto. Preencha à mão ou tire outra foto mais de perto, com boa luz.'}
 }catch(e){
  SC.rows.push({on:true,nome:'',preco:'',un:'un'});
  aviso='O leitor automático de texto não carregou (ele precisa de internet na primeira vez). Preencha o nome e o preço à mão.'}
 if(!$('#scan'))return;scRev(false,aviso)}

function scLinha(r,i){return `<div class="sc-lin"><input type="checkbox" ${r.on?'checked':''} onchange="scSet(${i},'on',this.checked)" aria-label="Incluir este item"><div class="c"><input value="${esc(r.nome)}" placeholder="Nome do produto" maxlength="60" oninput="scSet(${i},'nome',this.value)" aria-label="Nome do produto"><div class="row"><input class="pr" inputmode="decimal" value="${esc(r.preco)}" placeholder="R$ 0,00" oninput="scSet(${i},'preco',this.value)" aria-label="Preço"><select onchange="scSet(${i},'un',this.value)" aria-label="Tipo de preço"><option value="un" ${r.un!=='kg'?'selected':''}>por unidade</option><option value="kg" ${r.un==='kg'?'selected':''}>por kg</option></select></div></div><button class="ghost" onclick="scDel(${i})" aria-label="Remover linha">✕</button></div>`}
function scConta(){const b=$('#sc-sv');if(b)b.textContent='Salvar preços ('+SC.rows.filter(r=>r.on).length+')'}
function scSet(i,k,v){if(SC.rows[i]){SC.rows[i][k]=v;if(k==='on')scConta()}}
function scDel(i){SC.rows.splice(i,1);scRev()}
function scAdd(){SC.rows.push({on:true,nome:'',preco:'',un:'un'});scRev();const r=$('.sc-rev');if(r)r.scrollTop=r.scrollHeight}
function scRev(busy,aviso){
 const o=$('#scan');if(!o)return;scParar();const L=SC.rows;
 o.innerHTML=scTopo()+`<div class="sc-rev"><div class="card"><div class="sc-prev">${SC.thumb?`<img src="${SC.thumb}" alt="Foto da etiqueta">`:''}<div class="t"><b id="sc-pt">${busy?'Lendo o texto da foto…':(L.length+(L.length===1?' item para conferir':' itens para conferir'))}</b><br><small>${busy?'Aguarde alguns segundos.':'Corrija o que precisar e salve em '+esc(S.market)+'.'}</small>${busy?'<div class="sc-prog"><i id="sc-pg"></i></div>':''}</div></div>${aviso?`<p class="hint" style="color:var(--rd);margin-top:10px">${esc(aviso)}</p>`:''}</div>`
 +(busy?'':`<div class="card">${L.map(scLinha).join('')||'<div class="vazio" style="padding:10px">Nenhum item. Toque em Adicionar linha ou tire uma foto.</div>'}<button class="sec" style="margin-top:10px;width:100%" onclick="scAdd()">＋ Adicionar linha</button></div><div class="sc-act"><button class="sec" onclick="scCam()">📷 Outra foto</button><button id="sc-sv" onclick="scSalvar()">Salvar preços (${L.filter(r=>r.on).length})</button></div>`)+`</div>`}
function scSalvar(){
 const sel=SC.rows.filter(r=>r.on),ok=sel.filter(r=>String(r.nome).trim()&&num(r.preco)>0);
 if(!ok.length){info('Marque ao menos um item com nome e preço maior que zero.');return}
 const mk=(S.market||'').trim(),id=mkId(mk)||addMk(mk),nome=(MK().find(x=>x.id===id)||{nome:mk}).nome;
 ok.forEach(r=>{const t=String(r.nome).trim().replace(/\s+/g,' '),p=num(r.preco),un=r.un==='kg'?'kg':'un';
  S.scans=S.scans.filter(x=>!(x.market===nome&&x.date===HOJE&&nrm(x.title)===nrm(t)&&wt(x.unit)===(un==='kg')));
  S.scans.unshift({id:uid(),market:nome,date:HOJE,title:t,price:p,unit:un});
  S.prods[t.toLowerCase()]={name:t,price:p,unit:un}});
 if(S.scans.length>1500)S.scans.length=1500;
 const n=ok.length,pul=sel.length-n;save();scFechar();tab='compras';sub='mkt';nav();render();window.scrollTo(0,0);
 info(n+(n===1?' preço registrado':' preços registrados')+' em '+nome+'.'+(pul?' '+pul+(pul===1?' linha sem nome ou preço ficou de fora.':' linhas sem nome ou preço ficaram de fora.'):'')+' Veja a comparação em Mercados.')}

function vEscanear(){
 const rec=(S.scans||[]).slice(0,10);
 return mkBar()+`<div class="card"><div class="scan-hero"><span class="si2">📷</span><div class="t"><b>Escanear preços na prateleira</b><br><small>Aponte a câmera para a etiqueta. O app lê o nome e o preço, você confere e salva no mercado escolhido.</small></div></div><button style="width:100%;margin-top:12px" onclick="abrirScanner()">📷 Abrir câmera</button><p class="hint">Na primeira leitura o app baixa o leitor de texto, então precisa de internet. A foto não fica guardada: só o nome e o preço.</p></div>`
 +(rec.length?`<h3>Últimos preços lidos</h3><div class="card">${rec.map(x=>`<div class="item">${logoNome(x.market)}<span class="t">${esc(x.title)}<br><small style="color:var(--mute)">${esc(x.market)} · ${fmt(x.date,{day:'numeric',month:'short'})}</small></span><b>${brl(x.price)}${wt(x.unit)?'<small>/kg</small>':''}</b><button class="ghost" onclick="delScan('${x.id}')" aria-label="Excluir">✕</button></div>`).join('')}</div>`
 :'<div class="vazio">Nenhum preço lido ainda. Os preços que você escanear aparecem aqui e na comparação entre mercados.</div>')}

try{matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>applyTheme())}catch(e){}

applyTheme();nav();render();initSW();initLembretes();lockApp().then(()=>setTimeout(permIntro,600));

</script>
