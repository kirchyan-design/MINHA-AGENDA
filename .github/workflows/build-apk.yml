name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Preparar pasta www
        run: |
          mkdir -p www
          for f in index.html style.css script.js; do
            if [ -f "$f" ]; then cp "$f" www/; fi
          done
          test -f www/index.html || { echo "ERRO: index.html nao encontrado"; exit 1; }
          ls www

      - name: Criar projeto Android
        run: npx cap add android

      - name: Permitir salvar backup em Documentos (Android)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q WRITE_EXTERNAL_STORAGE "$M" || sed -i '/android.permission.INTERNET/a\    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />' "$M"
          grep -q requestLegacyExternalStorage "$M" || sed -i 's#<application#<application android:requestLegacyExternalStorage="true"#' "$M"
          grep -n "EXTERNAL_STORAGE\|requestLegacy" "$M" || true

      - name: Permissões de notificação e alarme (Android)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM RECEIVE_BOOT_COMPLETED VIBRATE WAKE_LOCK; do
            grep -q "android.permission.$P\"" "$M" || sed -i "/android.permission.INTERNET/a\    <uses-permission android:name=\"android.permission.$P\" />" "$M"
          done
          grep -n "uses-permission" "$M" || true

      - name: Aplicar o ícone do aplicativo (Android)
        run: |
          command -v convert >/dev/null || sudo apt-get install -y imagemagick
          R=android/app/src/main/res
          if [ -f icon-512.png ]; then
            for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
              IFS=: read n a f <<< "$d"
              mkdir -p "$R/mipmap-$n"
              convert icon-512.png -resize ${a}x${a} "$R/mipmap-$n/ic_launcher.png"
              convert icon-512.png -resize ${a}x${a} "$R/mipmap-$n/ic_launcher_round.png"
              if [ -f android-icon-fg.png ]; then convert android-icon-fg.png -resize ${f}x${f} "$R/mipmap-$n/ic_launcher_foreground.png"; fi
            done
            if [ -f "$R/values/ic_launcher_background.xml" ]; then sed -i 's/#FFFFFF/#0F7B8A/I' "$R/values/ic_launcher_background.xml"; fi
          fi
          if [ -f notif-icon.png ]; then mkdir -p "$R/drawable"; cp notif-icon.png "$R/drawable/ic_stat_agenda.png"; fi

      - name: Copiar o app para o Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: MinhaAgenda-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
