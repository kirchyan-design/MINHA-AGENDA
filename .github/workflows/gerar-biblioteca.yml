name: Gerar Biblioteca (livros em PDF)

# Roda à mão: Actions > Gerar Biblioteca > Run workflow.
# Baixa os livros em português de domínio público (Projeto Gutenberg), cria um PDF de cada um
# na pasta biblioteca/ e atualiza biblioteca/livros.json. O app lê esses arquivos no menu BIBLIOTECA.
on:
  workflow_dispatch:
    inputs:
      refazer:
        description: 'Recriar também os PDFs que já existem (para ganharem capa nova)'
        type: boolean
        default: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar reportlab
        run: pip install reportlab
      - name: Gerar os PDFs
        env:
          REFAZER: ${{ inputs.refazer && '1' || '0' }}
        run: python3 biblioteca/gerar-livros.py
      - name: Salvar no repositório
        if: always()   # salva os PDFs que ficaram prontos mesmo se algum livro falhar
        run: |
          git config user.name "biblioteca-bot"
          git config user.email "biblioteca-bot@users.noreply.github.com"
          git add biblioteca
          git diff --cached --quiet || git commit -m "Biblioteca: livros em PDF"
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git push
