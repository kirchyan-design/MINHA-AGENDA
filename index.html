  const m=$('#sc-m');if(m)m.innerHTML=`<p style="font-size:42px;margin:0">📷</p><p>Não foi possível abrir a câmera ao vivo.${nat()?' Confira se a permissão da câmera está liberada.':''}</p><div class="row" style="justify-content:center"><button onclick="$('#sc-f').click()">Tirar foto pelo celular</button>${nat()?'<button class="sec" onclick="permAjustes()">Ajustes do celular</button>':''}</div>`}}

function scQuadro(src,w,h){const k=Math.min(1,1600/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));c.getContext('2d').drawImage(src,0,0,c.width,c.height);return c}
/* moldura vertical (formato de etiqueta): calcula o retângulo em pixels e posiciona a dica logo abaixo */
function scBox(){const c=$('.sc-cam'),g=$('.sc-guia');if(!c||!g)return null;
 const cw=c.clientWidth,ch=c.clientHeight;if(!cw||!ch)return null;
 let w,h,y;
 if(ch>=cw){ /* celular em pé: moldura vertical, bem ampla */
  w=cw*.92;h=w*1.4;const mh=ch*.8;if(h>mh){h=mh;w=h/1.4}
  y=Math.max(8,(ch-h)/2-ch*.04)
 }else{ /* celular deitado: moldura mais larga, cabe na altura baixa */
  h=ch*.68;w=h*1.5;if(w>cw*.8){w=cw*.8;h=w/1.5}
  y=Math.max(6,(ch-h)/2-ch*.06)}
 const x=(cw-w)/2;
 g.style.left=x+'px';g.style.top=y+'px';g.style.width=w+'px';g.style.height=h+'px';
 const d=$('.sc-dica');if(d)d.style.top=Math.min(ch-34,y+h+8)+'px';
 SC.box={x,y,w,h,cw,ch};return SC.box}
/* ao girar o celular, refaz a moldura (também depois de a tela terminar de girar) */
function scGirou(){if(!$('.sc-guia'))return;scBox();setTimeout(scBox,150);setTimeout(scBox,450)}
window.addEventListener('resize',scGirou);window.addEventListener('orientationchange',scGirou);
try{matchMedia('(orientation:portrait)').addEventListener('change',scGirou)}catch(e){}
/* recorta do vídeo só o que está dentro da moldura (o vídeo usa object-fit:cover) */
function scRecorte(v){const b=scBox(),vw=v.videoWidth,vh=v.videoHeight;
 if(!b)return scQuadro(v,vw,vh);
 const k=Math.max(b.cw/vw,b.ch/vh),ox=(vw*k-b.cw)/2,oy=(vh*k-b.ch)/2;
 let sx=(b.x+ox)/k,sy=(b.y+oy)/k,sw=b.w/k,sh=b.h/k;
 sx=Math.max(0,sx);sy=Math.max(0,sy);sw=Math.min(sw,vw-sx);sh=Math.min(sh,vh-sy);
 const mx=Math.max(sw,sh),m=mx>1600?1600/mx:(mx<1100?Math.min(2,1200/mx):1);
 const c=document.createElement('canvas');c.width=Math.max(1,Math.round(sw*m));c.height=Math.max(1,Math.round(sh*m));
 c.getContext('2d').drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);return c}
function scFoto(){const v=$('#sc-v');if(!v||!v.videoWidth)return;const c=scRecorte(v);scParar();scLer(c)}
function scArquivo(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;scParar();
 const u=URL.createObjectURL(f),im=new Image();
 im.onload=()=>{const c=scQuadro(im,im.naturalWidth||im.width,im.naturalHeight||im.height);URL.revokeObjectURL(u);scLer(c)};
 im.onerror=()=>{URL.revokeObjectURL(u);info('Não foi possível abrir essa foto.');scCam()};im.src=u}
function scPrep(c){const o=document.createElement('canvas');o.width=c.width;o.height=c.height;const x=o.getContext('2d');x.drawImage(c,0,0);
 const d=x.getImageData(0,0,o.width,o.height),p=d.data;let mn=255,mx=0;
 for(let i=0;i<p.length;i+=4){const g=(p[i]*.3+p[i+1]*.59+p[i+2]*.11)|0;p[i]=p[i+1]=p[i+2]=g;if(g<mn)mn=g;if(g>mx)mx=g}
 const k=mx>mn?255/(mx-mn):1;for(let i=0;i<p.length;i+=4){const g=Math.max(0,Math.min(255,((p[i]-mn)*k)|0));p[i]=p[i+1]=p[i+2]=g}
 x.putImageData(d,0,0);return o}
function scProg(f,txt){const e=$('#sc-pg');if(e)e.style.width=Math.round(Math.max(0,Math.min(1,f||0))*100)+'%';const t=$('#sc-pt');if(t&&txt)t.textContent=txt}
async function scLer(c){
 try{const k=Math.min(1,160/Math.max(c.width,c.height)),s=document.createElement('canvas');s.width=Math.round(c.width*k);s.height=Math.round(c.height*k);s.getContext('2d').drawImage(c,0,0,s.width,s.height);SC.thumb=s.toDataURL('image/jpeg',.6)}catch(e){SC.thumb=''}
 scRev(true);
 let aviso='',w=null;
 try{w=await ocrCriar()}catch(e){
  SC.rows.push({on:true,nome:'',preco:'',un:'un'});
  aviso=navigator.onLine===false
   ?'O leitor de texto ainda não está guardado neste aparelho. Conecte à internet uma vez para ele ser baixado, ou preencha o nome e o preço à mão.'
   :'Não consegui carregar o leitor de texto agora. Confira a internet e toque em Outra foto para tentar de novo, ou preencha o nome e o preço à mão.'}
 if(w){
  try{
   const r=await w.recognize(scPrep(c)),novos=parseEtiquetas(r&&r.data&&r.data.text);
   if(novos.length)SC.rows=SC.rows.concat(novos);
   else{SC.rows.push({on:true,nome:'',preco:'',un:'un'});aviso='Não consegui ler um preço nesta foto. Preencha à mão ou tire outra foto mais de perto, com boa luz.'}
  }catch(e){
   try{SC.worker.terminate()}catch(_){}SC.worker=null;
   SC.rows.push({on:true,nome:'',preco:'',un:'un'});
   aviso='A leitura da foto falhou. Toque em Outra foto para tentar de novo ou preencha à mão.'}}
 if(!$('#scan'))return;scRev(false,aviso)}

function scLinha(r,i){return `<div class="sc-lin"><input type="checkbox" ${r.on?'checked':''} onchange="scSet(${i},'on',this.checked)" aria-label="Incluir este item"><div class="c"><input value="${esc(r.nome)}" placeholder="Nome do produto" maxlength="60" oninput="scSet(${i},'nome',this.value)" aria-label="Nome do produto"><div class="row"><input class="pr" inputmode="decimal" value="${esc(r.preco)}" placeholder="R$ 0,00" oninput="scSet(${i},'preco',this.value)" aria-label="Preço"><select onchange="scSet(${i},'un',this.value)" aria-label="Tipo de preço"><option value="un" ${r.un!=='kg'?'selected':''}>por unidade</option><option value="kg" ${r.un==='kg'?'selected':''}>por kg</option></select></div></div><button class="ghost" onclick="scDel(${i})" aria-label="Remover linha">✕</button></div>`}
function scConta(){const b=$('#sc-sv');if(b)b.textContent='Adicionar à lista ('+SC.rows.filter(r=>r.on).length+')'}
function scSet(i,k,v){if(SC.rows[i]){SC.rows[i][k]=v;if(k==='on')scConta()}}
function scDel(i){SC.rows.splice(i,1);scRev()}
function scAdd(){SC.rows.push({on:true,nome:'',preco:'',un:'un'});scRev();const r=$('.sc-rev');if(r)r.scrollTop=r.scrollHeight}
function scRev(busy,aviso){
 const o=$('#scan');if(!o)return;scParar();const L=SC.rows;
 o.innerHTML=scTopo()+`<div class="sc-rev"><div class="card"><div class="sc-prev">${SC.thumb?`<img src="${SC.thumb}" alt="Foto da etiqueta">`:''}<div class="t"><b id="sc-pt">${busy?'Lendo o texto da foto…':(L.length+(L.length===1?' item para conferir':' itens para conferir'))}</b><br><small>${busy?'Aguarde alguns segundos.':'Corrija o que precisar e salve em '+esc(S.market)+'.'}</small>${busy?'<div class="sc-prog"><i id="sc-pg"></i></div>':''}</div></div>${aviso?`<p class="hint" style="color:var(--rd);margin-top:10px">${esc(aviso)}</p>`:''}</div>`
 +(busy?'':`<div class="card">${L.map(scLinha).join('')||'<div class="vazio" style="padding:10px">Nenhum item. Toque em Adicionar linha ou tire uma foto.</div>'}<button class="sec" style="margin-top:10px;width:100%" onclick="scAdd()">＋ Adicionar linha</button></div><div class="sc-act"><button class="sec" onclick="scCam()">📷 Outra foto</button><button id="sc-sv" onclick="scSalvar()">Adicionar à lista (${L.filter(r=>r.on).length})</button></div>`)+`</div>`}
function scSalvar(){
 const sel=SC.rows.filter(r=>r.on),ok=sel.filter(r=>String(r.nome).trim()&&num(r.preco)>0);
 if(!ok.length){info('Marque ao menos um item com nome e preço maior que zero.');return}
 const mk=(S.market||'').trim(),id=mkId(mk)||addMk(mk),nome=(MK().find(x=>x.id===id)||{nome:mk}).nome;
 let novos=0,atual=0;
 ok.forEach(r=>{const t=String(r.nome).trim().replace(/\s+/g,' '),p=num(r.preco),un=r.un==='kg'?'kg':'un';
  S.scans=S.scans.filter(x=>!(x.market===nome&&x.date===HOJE&&nrm(x.title)===nrm(t)&&wt(x.unit)===(un==='kg')));
  S.scans.unshift({id:uid(),market:nome,date:HOJE,title:t,price:p,unit:un});
  S.prods[t.toLowerCase()]={name:t,price:p,unit:un};
  /* entra na lista de compras que o usuário está montando agora (se já estiver lá, só atualiza o preço) */
  const ja=S.shop.find(x=>!x.done&&nrm(x.title)===nrm(t)&&wt(x.unit)===(un==='kg'));
  if(ja){ja.price=p;atual++}
  else{S.shop.push({id:uid(),title:t,price:p,unit:un,qty:1,done:false});novos++}});
 if(S.scans.length>1500)S.scans.length=1500;
 const n=ok.length,pul=sel.length-n;save();scFechar();tab='compras';sub='atual';nav();render();window.scrollTo(0,0);
 info((novos?novos+(novos===1?' produto adicionado':' produtos adicionados')+' à lista de compras':'')+(novos&&atual?' e ':'')+(atual?atual+(atual===1?' produto já estava na lista (preço atualizado)':' produtos já estavam na lista (preços atualizados)'):'')+'. Preço registrado em '+nome+'.'+(pul?' '+pul+(pul===1?' linha sem nome ou preço ficou de fora.':' linhas sem nome ou preço ficaram de fora.'):''))}

function ptNumeros(txt){
 const tk=String(txt).split(/\s+/).filter(Boolean),out=[],val=w=>{const k=nrm(w);return Object.prototype.hasOwnProperty.call(PTN,k)?PTN[k]:null};let i=0;

   if(v==null&&nrm(tk[j])==='e'&&j+1<tk.length&&val(tk[j+1])!=null){j++;continue}
   if(v==null)break;

   if(cur!==null&&((n===0&&pr===3)||(n>0&&n<pr)))cur+=v;else{if(cur!==null)gr.push(cur);cur=v}
   pr=n;j++}
  gr.push(cur);out.push(gr.join(' '));i=j}

 t=ptNumeros(t).replace(/(\d)\s*(?:v[ií]rgula)\s*(\d)/gi,'$1,$2');
 let kg=false;const mk=/\s*\b(?:por|o|a|\/)\s*(?:kg|quilos?|quilogramas?)\b/i;if(mk.test(t)){kg=true;t=t.replace(mk,' ')}
 const P=[
  [/(\d{1,4})\s*[,.]\s*(\d{1,2})(?!\d)/g,(a,b)=>+(a+'.'+String(b).padEnd(2,'0'))],
  [/(\d{1,4})\s*(?:reais|real)\s*(?:e\s*)?(\d{1,2})(?:\s*centavos?)?(?!\d)/g,(a,b)=>+(a+'.'+String(b).padStart(2,'0'))],
  [/(\d{1,4})\s+e\s+(\d{2})(?!\d)(?:\s*centavos?)?/g,(a,b)=>+(a+'.'+b)],
  [/(\d{1,4})\s+(\d{2})(?:\s*centavos?)?\s*$/g,(a,b)=>+(a+'.'+b)],

 for(const [re,f] of P){const all=[...t.matchAll(re)];if(!all.length)continue;const m=all[all.length-1];const v=f(m[1],m[2]);
  if(v>0&&v<10000){preco=Math.round(v*100)/100;nome=(t.slice(0,m.index)+' '+t.slice(m.index+m[0].length));break}}
 nome=nome.replace(/\b(?:reais|real|centavos?)\b/gi,' ')
  .replace(/^\s*(?:por favor\s+)?(?:adicionar|adicione|adiciona|anotar|anote|colocar|coloque|coloca|incluir|inclua|registrar|registre|comprar|compre)\s+/i,'')
  .replace(/\s+(?:por|a|de|custa|custou|est[aá]|no valor de|valor|pre[cç]o|na promo[cç][aã]o)\s*$/i,'')
  .replace(/[^\wÀ-ÿ%.,\/\- ]/g,' ').replace(/\s+/g,' ').replace(/^[\s.,\-\/]+|[\s.,\-\/]+$/g,'');
 const peq=/^(?:de|da|do|das|dos|e|em|no|na|com|para|sem)$/;
 nome=nome.split(' ').map((w,i)=>i&&peq.test(w.toLowerCase())?w.toLowerCase():(w.charAt(0).toUpperCase()+w.slice(1).toLowerCase())).join(' ').slice(0,60);

function feiraCmd(txt,soFimTroca){
 let t=nrm(String(txt||'')).replace(/[.,!?;:]+/g,' ').replace(/\s+/g,' ').trim();
 t=t.replace(/^(?:kayla|por favor)\s+/,'').replace(/\s+(?:por favor|kayla|obrigad[oa])$/,'').trim();
 let m;
 /* FINALIZAR */
 if(/^(?:finalizar|finaliza|finalize|finalizado|encerrar|encerra|fechar|fecha)(?:\s+(?:a\s+|essa\s+|esta\s+)?(?:lista|compra|compras|feira))?$/.test(t)){
  if(!S.shop.length)return {ic:'⚠️',msg:'A lista está vazia',sub:'Adicione produtos antes de finalizar.'};
  if(!(S.market||'').trim()){escMk=true;render();return {ic:'🏪',msg:'Escolha o mercado para finalizar',sub:'Depois diga FINALIZAR de novo.'}}
  const bk=S.shop.slice(),mk=S.market,n=bk.length,total=tot(bk);finish();const hid=S.hist[0]&&S.hist[0].id;
  return {ic:'✅',msg:'Lista finalizada · '+n+(n===1?' produto':' produtos')+' · '+brl(total),sub:'Salva no histórico de '+esc(mk)+'.',
   undo:()=>{S.hist=S.hist.filter(h=>h.id!==hid);S.shop=bk;S.market=mk;S.mkSkip=false;sub='atual';save();render()}}}
 if(soFimTroca&&!/^(?:troc\w+|troqu\w+|mud\w+)\b/.test(t))return null;
 /* TROCAR PARA (mercado) */
 if((m=t.match(/^(?:trocar|troca|troque|mudar|muda|mude)\s+(?:de\s+mercado\s+)?(?:para|pra|pro)\s+(?:o\s+|a\s+)?(?:mercado\s+)?(.+)$/))){

  const antes=S.market,mkAntes=S.mkSkip;S.market=mk.nome;S.mkSkip=false;escMk=false;save();render();

 if(soFimTroca)return null;
 /* EXCLUIR (produto) */
 if((m=t.match(/^(?:excluir|exclui|exclua|apagar|apaga|apague|remover|remove|remova|tirar|tira|tire|deletar|deleta|delete)(?:\s+(?:o\s+|a\s+|os\s+|as\s+)?(?:produto|item)?\s*(.*))?$/))){

  else{const qn=nrm(q);for(let k=L.length-1;k>=0;k--){if(nrm(L[k].title)===qn){i=k;break}}
   if(i<0)for(let k=L.length-1;k>=0;k--){const d=nrm(L[k].title);if(d.includes(qn)||(d.length>=3&&qn.includes(d))){i=k;break}}}

   O workflow "Gerar APK" publica JC-Organiza.apk + version.json na última Release do repositório.
   O plugin nativo ApkUpdate (criado no workflow) faz a checagem, o download e a instalação. */
const APK_BASE='https://github.com/kirchyan-design/MINHA-AGENDA/releases/latest/download/';
const APK_URL=APK_BASE+'JC-Organiza.apk',APK_VER=APK_BASE+'version.json';
const APKP=()=>{let p=plug('ApkUpdate');if(p)return p;try{const C=window.Capacitor;if(C&&C.registerPlugin&&C.isPluginAvailable&&C.isPluginAvailable('ApkUpdate'))return C.registerPlugin('ApkUpdate')}catch(e){}return null};
function apkDiag(){try{const C=window.Capacitor||{};const n=new Set(Object.keys(C.Plugins||{}));(C.PluginHeaders||[]).forEach(h=>n.add(h.name));return [...n].join(', ')||'nenhum'}catch(e){return 'indisponível'}}
let APK_ST=null,APK_L=null; /* APK_ST: null = sem aviso | {tipo:'novo'|'antigo',fase,pct,msg,nome} */
function apkCard(){const s=APK_ST;if(!s)return '';
 const ver=s.nome?' ('+esc(s.nome)+')':'';let corpo,btn='';
 if(s.tipo==='antigo'){
  corpo='Há uma versão nova do aplicativo. Baixe e instale por cima do app atual, sem desinstalar. Depois disso, as próximas atualizações são feitas aqui dentro, com um toque.';
  btn=`<a class="apk-btn" href="${APK_URL}" target="_blank" rel="noopener">⬇️ BAIXAR ATUALIZAÇÃO</a><div class="row" style="margin-top:10px"><button class="sec" onclick="apkDispensar()">Agora não</button></div>`}
 else if(s.fase==='baixando'){
  corpo=`<b id="apk-pct">Baixando… ${s.pct||0}%</b><span class="apk-bar"><i id="apk-bar" style="width:${s.pct||0}%"></i></span>Não feche o app até terminar.`}
 else if(s.fase==='permissao'){
  corpo='Para instalar, o Android precisa da sua permissão. Na tela que abriu, ative <b>“Permitir desta fonte”</b> e volte ao app. Depois toque no botão abaixo.';
  btn=`<button class="apk-btn" onclick="apkInstalar()">✅ JÁ PERMITI, INSTALAR</button>`}
 else if(s.fase==='instalando'){
  corpo='Confirme a instalação na tela do Android. Se ela não apareceu, toque no botão abaixo.';
  btn=`<button class="apk-btn" onclick="apkInstalar()">📲 INSTALAR</button>`}
 else if(s.fase==='erro'){
  corpo='Não foi possível baixar agora: '+esc(s.msg||'verifique a conexão')+'.';
  btn=`<button class="apk-btn" onclick="apkBaixar()">🔁 TENTAR DE NOVO</button>`}
 else{
  corpo='Há uma versão nova do aplicativo. É só tocar no botão: o app baixa e abre a instalação por cima do atual, sem perder seus dados.';
  btn=`<button class="apk-btn" onclick="apkBaixar()">⬇️ BAIXAR E INSTALAR</button>`}
 return `<div class="card apk" id="apk-aviso" role="region" aria-label="Atualização disponível"><h4>📣 Atualização do aplicativo${ver}</h4><p>${corpo}</p>${btn}</div>`}
function apkAviso(){return ''}
function apkDesenha(){updPill()}
function apkBarra(){const t=$('#upd-t');if(t&&APK_ST)t.textContent='Baixando… '+(APK_ST.pct||0)+'%'}
function apkDispensar(){try{localStorage.setItem('ma-apk-dispensa',String(Date.now()))}catch(e){}APK_ST=null;apkDesenha()}
async function apkChecar(manual){
 if(!nat())return;
 if(APK_ST&&APK_ST.tipo==='novo'&&APK_ST.fase&&APK_ST.fase!=='pronto')return;
 const P=APKP();
 if(!P){ /* APK antigo (sem o atualizador interno): botão leva ao download da versão nova */
  APK_ST={tipo:'antigo'};UPD_HIDE=false;apkDesenha();
  if(manual===true)apkAntigoAviso();else apkAntigoQuandoLivre();
  return}
 try{
  const inf=await P.info(),r=await P.fetchText({url:APK_VER}),v=JSON.parse(r.text||'{}');
  if((+v.versionCode||0)>(+inf.versionCode||0)){APK_ST={tipo:'novo',fase:'pronto',nome:v.versionName||''};UPD_HIDE=false;apkDesenha()}
  else{APK_ST=null;apkDesenha();if(manual===true)info('Você já está com a versão mais recente do aplicativo.')}
 }catch(e){if(manual===true)info('Não foi possível verificar a atualização agora. Confira a conexão e tente de novo.')}}
async function apkBaixar(){
 const P=APKP();if(!P||!APK_ST||APK_ST.fase==='baixando')return;
 APK_ST.fase='baixando';APK_ST.pct=0;apkDesenha();
 try{
  if(!APK_L)APK_L=await P.addListener('progress',e=>{if(APK_ST&&APK_ST.fase==='baixando'){APK_ST.pct=Math.max(0,Math.min(100,Math.round(+e.percent||0)));apkBarra()}});
  await P.download({url:APK_URL});
  await apkInstalar()
 }catch(e){APK_ST.fase='erro';APK_ST.msg=(e&&e.message)||'falha no download';apkDesenha()}}
async function apkInstalar(){
 const P=APKP();if(!P||!APK_ST)return;
 try{const r=await P.install();APK_ST.fase=(r&&r.permissao===false)?'permissao':'instalando';apkDesenha()}
 catch(e){APK_ST.fase='erro';APK_ST.msg=(e&&e.message)||'falha ao abrir a instalação';apkDesenha()}}

/* ---------- v2.8: pede o microfone (uma vez) e mostra as novidades depois de cada atualização ---------- */
async function micPerguntar(){
 if(!nat()||PIN_LK||permAsking||!S.user.name)return;
 const st=await micEstado();if(st==='granted'||st==='na')return;
 /* enquanto o microfone não estiver liberado, pergunta de novo (no máximo uma vez por dia) */
 const hoje=new Date().toISOString().slice(0,10);let d='';try{d=localStorage.getItem('ma-mic-dia')||''}catch(e){}
 if(d===hoje)return;
 permAsking=true;const neg=st==='denied';
 const o=document.createElement('div');o.className='ov';o.setAttribute('role','alertdialog');
 o.innerHTML='<div class="dlg"><p>🎤 '+(neg?'Microfone bloqueado':'Permitir o microfone?')+'</p><div class="hint" style="margin:0 0 14px">'+(neg?'Para falar o produto e o preço na lista de compras, permita o microfone nos ajustes do celular.':'Usado só na lista de compras: você segura o botão do microfone, fala o produto e o preço, e o item é registrado.')+'</div><div class="row"><button id="mc-ok">'+(neg?'Abrir ajustes':'Permitir')+'</button><button class="sec" id="mc-no">Agora não</button></div></div>';
 document.body.appendChild(o);
 const fim=()=>{try{localStorage.setItem('ma-mic-dia',hoje)}catch(e){}permAsking=false;o.remove()};
 o.querySelector('#mc-no').onclick=fim;
 o.querySelector('#mc-ok').onclick=async()=>{fim();if(neg)permAjustes();else await permPedir('mic',false)}}
function micQuandoLivre(n){n=n||0;if(PIN_LK||permAsking||document.querySelector('.ov')){if(n<120)setTimeout(()=>micQuandoLivre(n+1),1000);return}micPerguntar()}

   Mostra só as manchetes; ao tocar, abre a matéria no site do veículo. Cada fonte tenta o feed direto e,
   se falhar, usa a busca de notícias do Google restrita ao site do veículo. */
const NW_SRC=[
 ['cnn','CNN Brasil',['cnnbrasil.com.br'],['https://www.cnnbrasil.com.br/feed/']],
 ['g1','G1',['g1.globo.com'],['https://g1.globo.com/rss/g1/']],
 ['jc','Jornal do Commercio',['jc.ne10.uol.com.br','jc.com.br'],[]],
 ['dp','Diário de Pernambuco',['diariodepernambuco.com.br'],[]],

const NW_KEY='ma-noticias',NW_TTL=20*60*1000;
const nwCfg=()=>{if(!S.news||typeof S.news!=='object')S.news={on:false,src:'all'};if(!S.news.src)S.news.src='all';return S.news};
const nwGN=d=>'https://news.google.com/rss/search?q='+encodeURIComponent('('+d.map(x=>'site:'+x).join(' OR ')+') when:2d')+'&hl=pt-BR&gl=BR&ceid=BR:pt-419';
let NW={busy:false,t:0,d:{},sig:''};
try{const c=JSON.parse(localStorage.getItem(NW_KEY)||'null');if(c&&c.d){NW.d=c.d;NW.t=c.t||0}}catch(e){}
async function nwGet(u){
 try{const H=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.CapacitorHttp;
  if(H&&H.get){const r=await H.get({url:u,responseType:'text'});if(r&&r.status<400&&typeof r.data==='string'&&r.data.length>100)return r.data}}catch(e){}
 const tent=[u,'https://api.allorigins.win/raw?url='+encodeURIComponent(u),'https://corsproxy.io/?'+encodeURIComponent(u)];
 for(const t of tent){try{const c=new AbortController(),to=setTimeout(()=>c.abort(),9000);const r=await fetch(t,{signal:c.signal});clearTimeout(to);
  if(r.ok){const x=await r.text();if(x&&x.length>100&&/<(item|entry)[\s>]/.test(x))return x}}catch(e){}}
 return ''}
function nwParse(xml,gn){
 const d=new DOMParser().parseFromString(xml,'text/xml');if(d.querySelector('parsererror'))return [];
 return [...d.querySelectorAll('item,entry')].slice(0,14).map(it=>{
  const q=n=>{const e=it.querySelector(n);return e?(e.textContent||'').trim():''};
  let t=q('title').replace(/\s+/g,' ');if(gn)t=t.replace(/\s+-\s+[^-]+$/,'');
  const le=it.querySelector('link');let l=le?(le.getAttribute('href')||(le.textContent||'').trim()):'';
  return {t,l,d:Date.parse(q('pubDate')||q('updated')||q('published'))||0}}).filter(x=>x.t&&/^https?:/.test(x.l))}
async function nwFonte(s){
 for(const u of s[3]){const x=await nwGet(u);if(x){const r=nwParse(x,false);if(r.length)return r}}
 const x=await nwGet(nwGN(s[2]));return x?nwParse(x,true):[]}

  const rs=await Promise.all(lista.map(async s=>[s[0],await nwFonte(s).catch(()=>[])]));
  rs.forEach(([k,v])=>{if(v.length)NW.d[k]=v});
  if(rs.some(r=>r[1].length)){NW.t=Date.now();try{localStorage.setItem(NW_KEY,JSON.stringify({t:NW.t,d:NW.d}))}catch(e){}}}

/* ---------- Menu Flow giratório: carrossel 3D no lugar do menu de baixo (Configurações › Menu) ---------- */
const FL={rot:0,tgt:0,raf:0,drag:null,lang:'',N:TABS.length,PX:2.4,key:''};
const flStep=()=>360/FL.N;
const flIdx=()=>{const i=Math.round(FL.tgt/flStep());return ((i%FL.N)+FL.N)%FL.N};
function flBuild(){
 let el=document.getElementById('flow');
 if(!el){el=document.createElement('div');el.id='flow';el.setAttribute('role','tablist');el.setAttribute('aria-label','Menu');document.body.appendChild(el);flBind(el);window.addEventListener('resize',flLayout)}
 el.innerHTML='<div class="fl-st">'+TABS.map((t,i)=>`<button class="fl-i" type="button" data-i="${i}" role="tab" aria-label="${esc(_t(t[2]))}"><span class="fl-ic">${svg(t[0])}</span><span class="fl-l">${esc(_t(t[2]))}</span></button>`).join('')+'</div>';
 FL.lang=(typeof LANG!=='undefined'?LANG:'');FL.key=TABS.map(t=>t[0]).join()}
function flLayout(){
 const el=document.getElementById('flow');if(!el)return;
 const st=el.querySelector('.fl-st');if(!st)return;
 const R=Math.min(150,(st.clientWidth||window.innerWidth)*.34),step=flStep();
 const ci=Math.round(FL.rot/step);
 el.querySelectorAll('.fl-i').forEach(b=>{
  const i=+b.dataset.i;let th=((i*step-FL.rot)%360+540)%360-180;
  const rad=th*Math.PI/180,z=(Math.cos(rad)+1)/2;
  const x=R*Math.sin(rad)*1.18,sc=.5+.5*Math.pow(z,2.2),op=.2+.8*Math.pow(z,1.6),y=-8*Math.cos(rad);
  b.style.transform=`translate(-50%,-50%) translate(${x.toFixed(1)}px,${y.toFixed(1)}px) perspective(520px) rotateY(${(th*.6).toFixed(1)}deg) scale(${sc.toFixed(3)})`;
  b.style.opacity=op.toFixed(2);b.style.zIndex=Math.round(z*100);
  b.style.pointerEvents=z<.25?'none':'auto';
  const l=b.querySelector('.fl-l');if(l)l.style.opacity=Math.max(0,1-Math.abs(th)/38).toFixed(2);
  const c=Math.abs(th)<step/2;b.classList.toggle('c',c);b.setAttribute('aria-selected',c?'true':'false')})}
function flAnim(){
 cancelAnimationFrame(FL.raf);
 const red=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
 const f=()=>{
  const d=FL.tgt-FL.rot;
  if(red||Math.abs(d)<.12){FL.rot=FL.tgt;flLayout();flCommit();return}
  FL.rot+=d*.2;flLayout();FL.raf=requestAnimationFrame(f)};
 FL.raf=requestAnimationFrame(f)}
function flCommit(){const t=TABS[flIdx()][0];if(t!==tab)go(t)}
function flTo(i){
 const step=flStep(),d=((i*step-FL.rot)%360+540)%360-180;
 FL.tgt=Math.round((FL.rot+d)/step)*step;flAnim()}
function flSync(jump){
 const el=document.getElementById('flow');if(!el)return;
 const i=TABS.findIndex(t=>t[0]===tab),step=flStep();
 if(i<0)return; /* Configurações não é um ícone do carrossel: não girar de volta ao primeiro (era isso que te levava ao Início) */
 if(FL.drag)return;
 const d=((i*step-FL.rot)%360+540)%360-180;
 if(Math.abs(d)<.5&&Math.abs(FL.tgt-FL.rot)<.5){flLayout();return}
 if(flIdx()===i&&FL.raf&&Math.abs(FL.tgt-FL.rot)>.5)return; /* já girando para este ícone */
 FL.tgt=FL.rot+d;
 if(jump){FL.rot=FL.tgt;flLayout()}else flAnim()}
function flBind(el){
 el.addEventListener('pointerdown',e=>{if(e.button&&e.button!==0)return;cancelAnimationFrame(FL.raf);FL.drag={x:e.clientX,r:FL.rot,mv:false,lx:e.clientX,lt:performance.now(),v:0,id:e.pointerId};try{el.setPointerCapture(e.pointerId)}catch(_){}});
 el.addEventListener('pointermove',e=>{const d=FL.drag;if(!d||e.pointerId!==d.id)return;
  const dx=e.clientX-d.x;if(Math.abs(dx)>6)d.mv=true;
  if(d.mv){FL.rot=d.r-dx/FL.PX;const now=performance.now(),dt=now-d.lt;if(dt>0){d.v=(d.lx-e.clientX)/FL.PX/dt;d.lx=e.clientX;d.lt=now}flLayout()}});
 const fim=e=>{const d=FL.drag;if(!d||e.pointerId!==d.id)return;FL.drag=null;
  if(!d.mv){const b=document.elementFromPoint(e.clientX,e.clientY),it=b&&b.closest&&b.closest('.fl-i');if(it)flTo(+it.dataset.i);else{FL.tgt=Math.round(FL.rot/flStep())*flStep();flAnim()}return}
  const step=flStep();FL.tgt=Math.round((FL.rot+d.v*140)/step)*step;flAnim()};
 el.addEventListener('pointerup',fim);el.addEventListener('pointercancel',fim);
 el.addEventListener('click',e=>{if(e.detail===0){const it=e.target.closest&&e.target.closest('.fl-i');if(it)flTo(+it.dataset.i)}}) /* teclado */ }
function flApply(){
 const on=!!S.flow&&!!(S.user&&S.user.name);
 document.body.classList.toggle('flow',on);
 if(!on)return;
 if(!document.getElementById('flow')||FL.lang!==(typeof LANG!=='undefined'?LANG:'')||FL.key!==TABS.map(t=>t[0]).join()){flBuild();flSync(true)}else flSync(false)}
function flTog(){S.flow=!S.flow;save();flApply();render()}

 +`</div>`}

function kParse(txt,now){now=now||new Date();const n=kNorm(txt);let date=null,time=null,t=txt;
 const rm=r=>{t=t.replace(r,' ')};
 let m;
 if(/\bdepois de amanh[aã](?![A-Za-zÀ-ÿ])/i.test(t)){const d=new Date(now);d.setDate(d.getDate()+2);date=iso(d);rm(/\bdepois de amanh[aã](?![A-Za-zÀ-ÿ])/i)}

 else if(/\bhoje\b/i.test(t)){date=iso(now);rm(/\bhoje\b/i)}
 else if((m=t.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))){let y=m[3]?+m[3]:now.getFullYear();if(y<100)y+=2000;const d=new Date(y,+m[2]-1,+m[1]);if(!m[3]&&iso(d)<iso(now))d.setFullYear(y+1);date=iso(d);rm(m[0])}
 else if((m=t.match(/\bdia\s+(\d{1,2})\b/i))){const d=new Date(now.getFullYear(),now.getMonth(),+m[1]);if(iso(d)<iso(now))d.setMonth(d.getMonth()+1);date=iso(d);rm(m[0])}
 else{const w=n.match(/\b(domingo|segunda|terca|quarta|quinta|sexta|sabado)(?:-feira)?\b/);
  if(w){const alvo=K_SEM.indexOf(w[1]);const d=new Date(now);let add=(alvo-d.getDay()+7)%7;if(add===0)add=7;d.setDate(d.getDate()+add);date=iso(d);
   t=t.replace(/(?:\b(?:na|no|pr[oó]xim[ao])\s+)?\b(domingo|segunda|ter[cç]a|quarta|quinta|sexta|s[aá]bado)(-feira)?\b/i,' ')}}
 /* hora */
 if((m=t.match(/\bdaqui a\s+(\d{1,3})\s*(min\w*|hora\w*|h)\b/i))){const d=new Date(now.getTime()+(/^min/i.test(m[2])?+m[1]*60000:+m[1]*3600000));date=iso(d);time=kP2(d.getHours())+':'+kP2(d.getMinutes());rm(m[0])}
 else if(/\bmeio[- ]dia\b/i.test(t)){time='12:00';rm(/\bmeio[- ]dia\b/i)}
 else if(/\bmeia[- ]noite\b/i.test(t)){time='00:00';rm(/\bmeia[- ]noite\b/i)}
 else if((m=t.match(/(?<![\wÀ-ÿ])(?:[aà]s\s+)?(\d{1,2})\s*(?::|h)\s*(\d{2})?\b/i))||(m=t.match(/(?<![\wÀ-ÿ])[aà]s\s+(\d{1,2})\b/i))){let h=+m[1];const mi=m[2]?+m[2]:0;
  if(h<=23&&mi<=59){if(h<12&&/\b(tarde|noite)\b/i.test(t))h+=12;time=kP2(h)+':'+kP2(mi);rm(m[0]);t=t.replace(/\b(da|de)\s+(manh[aã]|tarde|noite|madrugada)(?![A-Za-zÀ-ÿ])/i,' ')}}
 /* título */
 t=t.replace(/\b(kayla|por favor|pfv)\b/gi,' ').replace(/^\s*(me\s+)?(agende|agendar|marque|marcar|crie|criar|coloque|colocar|adicione|adicionar|anote|anotar|lembre|lembrar|lembrete|alarme|compromisso)\b\s*((?:de|do|da|para|pra|que|sobre|um|uma|o|a)(?=\s))?\s*(compromisso|lembrete|alarme)?\s*((?:de|do|da|para|pra|que|sobre)(?=\s))?/i,' ')
  .replace(/^\s*(?:de|do|da|para|pra|que|um|uma|o|a|às|as|em|no|na)(?=\s)\s*/i,' ').replace(/\s+(em|no|na|às|as|para|pra|de|do|da)\s*$/i,'').replace(/\s+/g,' ').trim();
 if(t)t=t[0].toUpperCase()+t.slice(1);
 return {title:t,date:date,time:time}}

 }catch(e){WK.busy=false;try{console.warn('Kayla wake:',e)}catch(x){}}}
function wakeOuviu(txt){
 if(WK.busy||!WK.on)return;WK.txt=txt;
 if(!WK.heard){if(!WK_RX.test(wakeBase(txt)))return;WK.heard=true}
 /* espera uma pausa na fala para pegar o comando inteiro */
 clearTimeout(WK.dt);WK.dt=setTimeout(wakeAgir,1200)}
/* o reconhecedor do Android/Chrome encerra sozinho depois de um silêncio: se já ouviu o nome, age; senão, o vigia religa */
function wakeFimSessao(sq){
 if(sq!==WK.seq)return;
 if(WK.heard){clearTimeout(WK.dt);wakeAgir();return}
 wakeParar();WK.espera=Date.now()+500}
async function wakeIniciar(){
 if(WK.on||WK.busy)return;
 const N=nat()?plug('SpeechRecognition'):null,W=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!N&&!W)return;
 const sq=++WK.seq;WK.on=true;WK.txt='';WK.heard=false;
 try{
  if(N){
   if((await micEstado())!=='granted'){
    if(!WK.pediu){WK.pediu=1;try{await micPedirNativo()}catch(e){}}
    await wakeParar();WK.espera=Date.now()+15000;return}
   try{const a=await N.available();if(a&&a.available===false){await wakeParar();WK.espera=Date.now()+60000;return}}catch(e){}
   if(sq!==WK.seq)return;
   WK.ls=await N.addListener('partialResults',e=>{if(sq!==WK.seq)return;const m=e&&e.matches&&e.matches[0];if(m)wakeOuviu(m)});
   try{WK.ls2=await N.addListener('listeningState',e=>{if(e&&e.status==='stopped')wakeFimSessao(sq)})}catch(e){}
   if(sq!==WK.seq){try{WK.ls.remove()}catch(x){}return}
   wakeUi();
   await N.start({language:LOC(),maxResults:3,partialResults:true,popup:false});
   WK.falhas=0
  }else{
   const r=new W();WK.w=r;r.lang=LOC();r.continuous=true;r.interimResults=true;r.maxAlternatives=1;
   r.onresult=e=>{if(sq!==WK.seq)return;try{const i=e.results.length-1;wakeOuviu(e.results[i][0].transcript)}catch(x){}};
   r.onerror=e=>{const er=(e&&e.error)||'';
    if(er==='not-allowed'||er==='service-not-allowed'){wakeSet(false);try{render()}catch(x){}info('Preciso da permissão do microfone para ouvir o nome “Kayla”. Libere o microfone neste navegador e ligue a opção de novo.')}};
   r.onend=()=>wakeFimSessao(sq);
   wakeUi();r.start();WK.falhas=0}
 }catch(e){
  /* erro ao abrir o microfone: tenta de novo com espera crescente (evita ficar repetindo sem parar) */
  WK.falhas++;if(sq===WK.seq){await wakeParar();WK.espera=Date.now()+Math.min(30000,1500*WK.falhas*WK.falhas)}}}
async function wakeTog(){
