<style>
:root{--bg:#f1f5f7;--sf:#fff;--ink:#14232e;--mute:#5d6f7c;--ac:#0f7b8a;--acs:#dff1f3;--ln:#dbe4ea;--ok:#2f9e6b;--rd:#c8483c;--onac:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a21;--sf:#172630;--ink:#e8f0f4;--mute:#8fa3b0;--ac:#4fc3d1;--acs:#1b3a44;--ln:#263a46;--ok:#4cc58d;--rd:#e8776b;--onac:#06232a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a21;--sf:#172630;--ink:#e8f0f4;--mute:#8fa3b0;--ac:#4fc3d1;--acs:#1b3a44;--ln:#263a46;--ok:#4cc58d;--rd:#e8776b;--onac:#06232a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
main{max-width:640px;margin:0 auto;padding:20px 16px}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;gap:12px}
h1{font:800 30px/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em;margin:0}
h1 span{color:var(--ac)}
.hoje{color:var(--mute);font-size:14px;text-align:right;text-transform:capitalize}
h2{font:700 20px/1.2 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 12px}
h3{font:600 14px/1.2 Figtree,sans-serif;color:var(--mute);margin:18px 0 8px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
input,textarea,button{font:inherit;color:inherit}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px 12px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
textarea{resize:vertical;min-height:110px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac);flex:none;padding:0}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:var(--onac);font-weight:600}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) button.pri{color:#06232a}}
button.ghost{background:transparent;color:var(--mute);padding:6px 8px;font-weight:500}
button.ghost:hover{color:var(--rd)}
button.sec{background:var(--acs);color:var(--ac)}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}
.item.done .t{text-decoration:line-through;color:var(--mute)}
.hora{font:700 13px "Bricolage Grotesque",sans-serif;color:var(--ac);min-width:46px}
.vazio{color:var(--mute);text-align:center;padding:22px 8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;width:100%;max-width:640px}
nav button{flex:1;background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;padding:6px 2px;font-weight:500}
nav button b{font-size:20px;font-weight:400;line-height:1}
nav button.on{color:var(--ac);background:var(--acs)}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-h strong{font:700 18px "Bricolage Grotesque",sans-serif;text-transform:capitalize}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dw{text-align:center;color:var(--mute);font-size:12px;padding:4px 0}
.d{aspect-ratio:1;border-radius:10px;background:transparent;color:var(--ink);padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:500;position:relative}
.d.out{opacity:.3}
.d.hj{border:2px solid var(--ac)}

main{padding:14px 16px 20px}

/* ---- cabeçalho ---- */
header{align-items:center;margin-bottom:20px}
header h1{font-size:21px;letter-spacing:-.025em}
.logo{width:42px;height:42px;border-radius:13px;box-shadow:var(--sh);background:#fff}
.cfg{width:44px;height:44px;padding:0;border-radius:15px;display:grid;place-items:center;background:var(--sf);color:var(--ink);border:1px solid var(--ln2);box-shadow:var(--sh)}
.cfg svg{width:21px;height:21px}
.cfg.on{background:var(--grad);color:var(--onac);border-color:transparent}
.greet{margin-bottom:6px}
.greet .greet-row{gap:12px}
.greet .av{width:40px;height:40px;font-size:18px}
.greet .gt{font-size:17px}

/* ---- títulos ---- */
h2{font:800 28px/1.1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.03em;margin:4px 2px 16px}
h3{font:700 12px/1.2 Figtree,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin:24px 4px 10px}
h3[style*="capitalize"]{letter-spacing:.01em;font-size:14px;text-transform:capitalize}
.gt{font:800 26px/1.1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.03em}

/* ---- cartões ---- */
.card{border:1px solid var(--ln2);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.card.tot{background:linear-gradient(140deg,var(--acs),color-mix(in srgb,var(--acs) 35%,var(--sf)));border-color:color-mix(in srgb,var(--ac) 28%,transparent)}
.card.qk{border:1.5px solid color-mix(in srgb,var(--ac) 55%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--acs) 55%,var(--sf)),var(--sf))}
.card strong{font-weight:700}
.vazio{border:1.5px dashed var(--ln);border-radius:var(--r);padding:26px 18px;line-height:1.5;margin-bottom:14px}
.vazio::before{content:"✦";display:grid;place-items:center;width:46px;height:46px;margin:0 auto 10px;border-radius:50%;background:var(--acs);color:var(--ac);font-size:18px}

/* ---- campos ---- */
input,textarea,select{background:var(--fld);border:1.5px solid transparent;border-radius:var(--rs);padding:12px 14px;transition:border-color .15s,box-shadow .15s,background .15s}
input:not([type=checkbox]):hover,textarea:hover,select:hover{border-color:var(--ln)}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--ac);background:var(--sf);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 18%,transparent)}
input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--mute) 80%,transparent)}
.nota input,.nota textarea,.nota input:focus,.nota textarea:focus{background:transparent;border:0;box-shadow:none}
.nota input:focus,.nota textarea:focus{outline:0}
select{padding:11px 10px}
.fl,.fl2{font-size:12px;letter-spacing:.02em}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:26px;height:26px;border-radius:50%;border:2px solid color-mix(in srgb,var(--mute) 55%,transparent);background:transparent;display:grid;place-content:center;padding:0;cursor:pointer;transition:background .15s,border-color .15s}
input[type=checkbox]::after{content:"";width:6px;height:11px;border:solid var(--onac);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px) scale(0);transition:transform .15s}
input[type=checkbox]:checked{background:var(--ac);border-color:var(--ac)}
input[type=checkbox]:checked::after{transform:rotate(45deg) translate(-1px,-1px) scale(1)}
input[type=checkbox]:focus-visible{box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 25%,transparent)}

/* ---- botões ---- */
button{border-radius:var(--rs);padding:12px 16px;font-weight:650}
button:not([class]),button.pri{background:var(--grad);color:var(--onac);box-shadow:0 8px 18px -10px var(--ac),inset 0 1px 0 rgba(255,255,255,.18)}
button.sec{background:var(--acs);color:var(--ac);font-weight:650}
button.sec:hover{background:color-mix(in srgb,var(--ac) 20%,var(--sf))}
button.ghost{border-radius:12px}
button:disabled{opacity:.5}
@media(prefers-reduced-motion:no-preference){button{transition:background .15s,transform .12s,box-shadow .15s,color .15s,border-color .15s}button:active{transform:scale(.97)}}
.row{gap:10px}

/* ---- lista de itens ---- */
.item{padding:13px 0;gap:12px;border-bottom:1px solid var(--ln2)}
.item.done .t{opacity:.6}
.hora{background:var(--acs);color:var(--ac);padding:5px 9px;border-radius:10px;min-width:54px;text-align:center;font-size:13px;letter-spacing:.01em}
.item .hora[style*="min-width:28px"]{background:transparent;padding:0}
.pq input,.pq select{padding:8px 8px;background:var(--fld)}
.plrow:active,.ent:active{background:var(--fld)}
.ent{transition:transform .12s}

/* ---- segmentado (abas internas) ---- */
.seg{background:color-mix(in srgb,var(--ink) 6.5%,transparent);padding:4px;border-radius:18px;gap:2px;margin-bottom:14px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{background:transparent;border:0;border-radius:14px;color:var(--mute);font-weight:600;padding:10px 12px}
.seg button.on{background:var(--sf);color:var(--ac);box-shadow:0 1px 2px rgba(18,52,66,.1),0 4px 12px -6px var(--shc)}
.qk .seg{background:color-mix(in srgb,var(--ink) 6.5%,transparent)}
.qk .seg button.on{background:var(--grad);color:var(--onac);box-shadow:0 6px 14px -8px var(--ac)}

/* ---- calendário ---- */
.cal-h{margin-bottom:14px}
.cal-h strong{font-size:19px;letter-spacing:-.02em}
.cal-h button{width:40px;height:40px;padding:0;border-radius:14px;font-size:22px;line-height:1;display:grid;place-items:center}
.grid{gap:6px}
.dw{font-weight:700;font-size:11px;letter-spacing:.06em;color:var(--mute);padding:2px 0 6px}
.d{border-radius:15px;font-weight:600;font-size:15px;background:transparent}
.d:not(.sel):not(.plt):hover{background:var(--fld)}
.d.hj{border:0;box-shadow:inset 0 0 0 2px var(--ac);color:var(--ac);font-weight:800}
.d.sel{background:var(--grad);color:var(--onac);box-shadow:0 8px 16px -8px var(--ac);font-weight:800}
.d.sel.hj{box-shadow:0 8px 16px -8px var(--ac)}
.d.plt.sel{background:var(--grad)}
.dots{bottom:6px}
.dots i{width:5px;height:5px}

/* ---- notas, humor, fotos ---- */
.nota{border-radius:var(--r)}
.nota[data-c]{border-left-width:0;box-shadow:inset 6px 0 0 var(--nc),var(--sh)}
.sw{width:30px;height:30px}
.humor{gap:8px}
.humor button{background:var(--fld);border-radius:16px;font-size:24px;padding:8px 12px;border:2px solid transparent}
.humor button.on{border-color:var(--ac);background:var(--acs);transform:scale(1.06)}
.foto{border-radius:14px}

/* ---- Início ---- */
.hero{position:relative;overflow:hidden;border:0;border-radius:28px;padding:20px 20px 18px;margin-bottom:16px;background:var(--grad);color:var(--onac);box-shadow:0 22px 40px -22px var(--ac)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}
.hero::before{width:190px;height:190px;right:-60px;top:-80px}
.hero::after{width:120px;height:120px;right:40px;bottom:-70px;background:rgba(255,255,255,.08)}
:root[data-eff="dark"] .hero::before,:root[data-eff="dark"] .hero::after{background:rgba(0,0,0,.1)}
.hero .greet-row{position:relative;z-index:1;gap:14px}
.hero .av{width:58px;height:58px;font-size:25px;background:rgba(255,255,255,.22);color:inherit;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
:root[data-eff="dark"] .hero .av{background:rgba(0,0,0,.14);box-shadow:0 0 0 3px rgba(0,0,0,.14)}
.hero .gt{font-size:24px;color:inherit}
.hero .gd{color:inherit;opacity:.82;font-size:14px}
.hero .chips{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);color:inherit;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:650;backdrop-filter:blur(4px)}
:root[data-eff="dark"] .chip{background:rgba(0,0,0,.14)}
.chip svg{width:15px;height:15px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 6px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--sf);color:var(--ink);border:1px solid var(--ln2);box-shadow:var(--sh);padding:14px 4px 12px;border-radius:20px;font-size:12px;font-weight:650;line-height:1.1}
.qa .qi{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--h) 16%,var(--sf));color:var(--h);position:relative}
.qa .qi svg{width:22px;height:22px}
.qa .qi::after{content:"+";position:absolute;right:-5px;top:-5px;width:18px;height:18px;border-radius:50%;background:var(--h);color:#fff;font:800 13px/18px Figtree,sans-serif;text-align:center}
.stats{gap:12px}
.stat{border-radius:22px;padding:14px;gap:3px;border:1px solid var(--ln2);box-shadow:var(--sh);position:relative}
.stat .si{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;margin-bottom:8px;background:color-mix(in srgb,var(--h) 16%,var(--sf));color:var(--h)}
.stat .si svg{width:22px;height:22px}
.stat b{font-size:17px}
.stat small{line-height:1.3}
.stat::after{content:"›";position:absolute;right:14px;top:12px;color:var(--mute);font-size:20px;line-height:1}
.frase{position:relative;overflow:hidden;border:1px solid color-mix(in srgb,var(--ac) 22%,transparent);background:linear-gradient(140deg,var(--acs),color-mix(in srgb,var(--acs) 30%,var(--sf)));box-shadow:none}
.frase::after{content:"”";position:absolute;right:14px;top:-26px;font:800 120px/1 "Bricolage Grotesque",serif;color:var(--ac);opacity:.14;pointer-events:none}
.cn-tot strong{font-size:38px}
.si2{display:grid;place-items:center;width:34px;height:34px;border-radius:12px;background:var(--fld);font-size:17px}

/* ---- barra de navegação flutuante ---- */
nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;padding:6px;border:1px solid var(--ln2);border-radius:28px;background:color-mix(in srgb,var(--sf) 86%,transparent);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);box-shadow:0 18px 40px -12px var(--shc),0 2px 6px rgba(18,52,66,.08);z-index:30}
nav div{max-width:none;gap:2px}
nav button{padding:3px 0 2px;gap:3px;background:none;border-radius:20px;font-size:10.5px;font-weight:600;letter-spacing:0;color:var(--mute);min-width:0}
nav button .ni{display:grid;place-items:center;width:46px;height:30px;border-radius:15px;transition:background .2s,color .2s,transform .2s}
nav button .ni svg{width:22px;height:22px}
nav button.on{background:none;color:var(--ac)}
nav button.on .ni{background:var(--acs)}
nav button.on .nl{font-weight:800}
@media(max-width:380px){nav button{font-size:9.5px}nav button .ni{width:38px}}
.upd{bottom:calc(88px + env(safe-area-inset-bottom,0px));border-radius:18px}

/* ---- diálogos ---- */
.ov{background:rgba(8,20,28,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.dlg{border-radius:26px;padding:22px;box-shadow:var(--sh2);border:0}
@media(prefers-reduced-motion:no-preference){.dlg{animation:pop .22s cubic-bezier(.2,.8,.3,1.2)}@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}}}

/* ---- cartões de cor, mercado, carteira ---- */
.cor,.mk,.hc,.mh{border-radius:16px}
.mk{border-radius:18px}
.mh{box-shadow:var(--sh)}
.cw-bar{height:12px}
.cw-bar i{background:var(--grad)}
.cw-cat .bar{height:8px;background:var(--fld)}
.cw-cat .bar i{background:var(--grad)}
.melhor{padding:3px 9px}
.mt th{font-size:12px;color:var(--mute);font-weight:700}
.tot strong{letter-spacing:-.03em}

/* ---- tela de bloqueio (PIN) ---- */
.pgrid{gap:12px}
.pgrid button{border-radius:22px;padding:16px 0;box-shadow:var(--sh);border:1px solid var(--ln2)}
.pgrid button.fn{box-shadow:none}
.pdots i{width:14px;height:14px}

/* ---- boas-vindas ---- */
.welcome{min-height:calc(100vh - 80px);min-height:calc(100svh - 80px);display:flex;flex-direction:column;justify-content:center;text-align:center;padding:12px 0}
.wl{width:116px;height:116px;margin:0 auto 18px;border-radius:34px;background:#fff;display:grid;place-items:center;box-shadow:0 24px 44px -20px var(--ac),0 0 0 6px color-mix(in srgb,var(--ac) 14%,transparent)}
.wl .logo{width:92px;height:92px;box-shadow:none;border-radius:26px}
.wt{font:800 34px/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.03em;margin:0 0 10px;white-space:normal}
.wt span{color:var(--ac)}
.ws{color:var(--mute);margin:0 auto 22px;max-width:320px;font-size:16px;line-height:1.5}
.welcome .card{text-align:left;padding:18px}
.welcome .card .fl{margin:0 0 8px;font-size:14px;color:var(--ink)}
.welcome .card input{font-size:17px;padding:14px 16px}
.wbig{width:100%;margin-top:12px;padding:15px;font-size:17px;border-radius:16px}
.wf{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:2px 0 16px;padding:0;list-style:none}
.wf li{background:var(--sf);border:1px solid var(--ln2);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--mute);box-shadow:var(--sh)}

/* ---- animação ao trocar de aba ---- */
@media(prefers-reduced-motion:no-preference){
 #v.enter>*{animation:rise .4s cubic-bezier(.2,.7,.2,1) both}
 #v.enter>*:nth-child(2){animation-delay:.04s}#v.enter>*:nth-child(3){animation-delay:.08s}#v.enter>*:nth-child(4){animation-delay:.12s}#v.enter>*:nth-child(5){animation-delay:.16s}#v.enter>*:nth-child(n+6){animation-delay:.2s}
 @keyframes rise{from{opacity:0;transform:translateY(12px)}}
}

/* ---- ajustes finos ---- */
.greet{display:none}
.cal-h strong,h3[style*="capitalize"]{text-transform:none!important}
.cal-h strong::first-letter,h3[style*="capitalize"]::first-letter{text-transform:uppercase}
.seg button{font-size:13px;padding:10px 7px}
.row>input[type=date]{flex:1.5 1 140px;min-width:0}
.row>input[type=time]{flex:1 1 110px;min-width:0}
nav{left:8px;right:8px;padding:6px 4px}
nav button{font-size:10px;letter-spacing:-.02em}
nav button .ni{width:44px}
.qa button{font-size:11.5px;letter-spacing:-.01em}
.seg button{font-size:12.5px;padding:10px 4px;white-space:nowrap}


/* ---- pergunta ao ChatGPT no Início ---- */
.gsearch{display:flex;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--ln2);border-radius:999px;padding:5px 5px 5px 16px;margin:0 0 16px;box-shadow:var(--sh);transition:box-shadow .15s,border-color .15s}
.gsearch:focus-within{border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 18%,transparent),var(--sh)}
.gsearch>svg{width:20px;height:20px;color:var(--mute);flex:none}
.gsearch input{flex:1;min-width:0;background:transparent;border:0;box-shadow:none;padding:11px 0;font-size:16px}
.gsearch input:focus{background:transparent;box-shadow:none;border:0}
.gsearch button{flex:none;padding:10px 18px;border-radius:999px;font-size:14px}

.frase cite{display:block;font-style:normal;font-weight:800;font-size:13px;color:var(--ac);letter-spacing:.02em;margin:2px 0 4px}
.frase p{font-size:17px;line-height:1.4}

main{position:relative;z-index:1}

/* =====================================================================
   v2.1 — SCANNER DE PREÇOS (câmera)
   ===================================================================== */
.scan{position:fixed;inset:0;z-index:48;background:#000;color:#fff;display:flex;flex-direction:column}
.scan *{box-sizing:border-box}
.scan .sc-top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:rgba(0,0,0,.55);position:relative;z-index:2}
.scan .sc-top b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.scan .sc-top button{background:rgba(255,255,255,.16);color:#fff;box-shadow:none;padding:9px 14px}
.scan .sc-cam{position:relative;flex:1;min-height:0;overflow:hidden;background:#000}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan .sc-guia{position:absolute;left:14%;top:14%;width:72%;height:62%;border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 100vmax rgba(0,0,0,.58);pointer-events:none;z-index:1}
.scan .sc-guia::before,.scan .sc-guia::after{content:'';position:absolute;left:10%;right:10%;height:2px;background:rgba(255,255,255,.35)}
.scan .sc-guia::before{top:33%}.scan .sc-guia::after{bottom:30%}
.scan .sc-dica{position:absolute;left:0;right:0;top:80%;text-align:center;font-size:13px;opacity:.95;padding:0 22px;pointer-events:none;text-shadow:0 1px 4px #000;z-index:1}
.scan .sc-bar{display:flex;align-items:center;justify-content:space-around;gap:10px;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.6)}
.scan .sc-bar button{background:rgba(255,255,255,.16);color:#fff;box-shadow:none;min-width:84px;padding:11px 12px;font-size:13px}
.scan .sc-shot{width:72px;height:72px;min-width:72px!important;border-radius:50%!important;padding:0!important;background:#fff!important;border:5px solid rgba(255,255,255,.5)!important;background-clip:padding-box!important}
.scan .sc-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:30px;background:#0b0b0c}
.scan .sc-msg p{margin:0;opacity:.9;line-height:1.5}
.scan .sc-rev{flex:1;min-height:0;overflow-y:auto;background:var(--bg);color:var(--ink);padding:14px 14px 18px}
.scan .sc-rev .card{margin-bottom:12px}
.scan .sc-prev{display:flex;gap:12px;align-items:center}
.scan .sc-prev img{width:76px;height:76px;object-fit:cover;border-radius:14px;flex:none;background:#000}
.scan .sc-prev .t{flex:1;min-width:0}
.scan .sc-prev small{color:var(--mute)}
.scan .sc-prog{height:8px;border-radius:999px;background:var(--fld);overflow:hidden;margin-top:8px}
.scan .sc-prog i{display:block;height:100%;width:0;background:var(--grad);transition:width .2s}
.scan .sc-lin{display:flex;gap:8px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--ln2)}
.scan .sc-lin:last-child{border-bottom:0}
.scan .sc-lin .c{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.scan .sc-lin .c .row{flex-wrap:nowrap}
.scan .sc-lin input[type=checkbox]{margin-top:10px}
.scan .sc-lin .pr{width:100px;flex:none}
.scan .sc-lin select{flex:none}
.scan .sc-act{display:flex;gap:10px;flex-wrap:wrap}
.scan .sc-act button{flex:1 1 140px}
.scan-hero{display:flex;gap:12px;align-items:center}
.scan-hero .si2{width:46px;height:46px;font-size:24px;border-radius:16px;flex:none}
.scan-hero .t{flex:1;min-width:0}
.scan-hero small{color:var(--mute)}
.drw{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45)}
.drw aside{position:absolute;left:0;top:0;bottom:0;width:min(78vw,300px);background:var(--sf);border-right:1px solid var(--ln);padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px;overflow-y:auto;box-shadow:8px 0 30px rgba(0,0,0,.25);animation:dslide .2s ease-out}
@keyframes dslide{from{transform:translateX(-100%)}}
.drw .dh{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;font-weight:700;font-size:17px}
.drw button{display:flex;align-items:center;gap:14px;width:100%;background:none;color:var(--ink);text-align:left;padding:12px;border-radius:14px;font-size:16px;font-weight:600;box-shadow:none}
.drw button.on{background:var(--acs);color:var(--ac)}.drw button svg{width:22px;height:22px;flex:none}.drw hr{border:0;border-top:1px solid var(--ln);margin:8px 0;width:100%}

/* ---------- recado do criador (02/11 e 03/11) ---------- */
.dev-dlg{position:relative;padding-top:34px;text-align:center}
.dev-dlg p{font-weight:700;line-height:1.45;margin:6px 0 0}
.dev-x{position:absolute;top:8px;right:8px;width:36px;height:36px;min-width:0;padding:0;border-radius:50%;border:0;background:var(--bg);color:var(--tx);font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}

/* ---------- recado: guia das Configurações (aparece uma única vez) ---------- */
.dlg.rc-dlg{position:relative;display:flex;flex-direction:column;max-width:380px;padding:0;overflow:hidden;max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px)}
.rc-h{padding:20px 56px 12px 20px}
.dlg .rc-h p{margin:0;font-weight:700;font-size:17px;line-height:1.35}

function _t(k,v){let x=(I18N[LANG]&&I18N[LANG][k])||k;if(v)x=x.replace(/\{(\w+)\}/g,(m,n)=>v[n]!=null?v[n]:m);return x}
function setLang(l){if(!LANGS.some(x=>x[0]===l))return;S.lang=l;LANG=l;document.documentElement.lang=LOC();try{if(SC.worker){SC.worker.terminate();SC.worker=null}}catch(e){}save();nav();render();trDom(document.body)}
function cfgIdioma(){return `<h3>${_t('Idioma')}</h3><div class="card"><div class="seg s4">${LANGS.map(l=>`<button class="${LANG===l[0]?'on':''}" aria-pressed="${LANG===l[0]}" onclick="setLang('${l[0]}')">${l[1]}</button>`).join('')}</div><p class="hint">${_t('Muda os textos do app. Seus dados não são alterados.')}</p></div>`}

const PATS=[];Object.keys(I18N.en).forEach(k=>{if(k.includes('{')){const nm=[];const re=new RegExp('^'+k.replace(/[.*+?^$()|[\]\\]/g,'\\$&').replace(/\{(\w+)\}/g,(m,n)=>{nm.push(n);return '(.+?)'})+'$');PATS.push([k,re,nm])}});
function _tx(str){if(LANG==='pt')return str;const m=str.match(/^(\s*)([\s\S]*?)(\s*)$/),core=m[2];if(!core)return str;const d=I18N[LANG];let r=d[core],pre='';
 if(r==null){const e=core.match(/^([^\p{L}\p{N}]*)([\s\S]*)$/u);if(e[1]&&d[e[2]]!=null){pre=e[1];r=d[e[2]]}}
 if(r==null)for(const p of PATS){const x=core.match(p[1]);if(x){const v={};p[2].forEach((n,i)=>v[n]=x[i+1]);r=_t(p[0],v);break}}
 if(r==null&&core.includes(' · ')){const ps=core.split(' · '),tp=ps.map(_tx);if(tp.some((x,i)=>x!==ps[i]))r=tp.join(' · ')}
 return r==null?str:m[1]+pre+r+m[3]}
let _busy=false;
function trDom(root){if(LANG==='pt'||_busy||!root)return;_busy=true;try{
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT,{acceptNode:n=>n.nodeType===1&&/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.tagName)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
 const L=[];let n=w.currentNode;while(n){L.push(n);n=w.nextNode()}
 L.forEach(n=>{if(n.nodeType===3){const v=_tx(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}else['placeholder','aria-label','title'].forEach(a=>{const x=n.getAttribute&&n.getAttribute(a);if(x){const v=_tx(x);if(v!==x)n.setAttribute(a,v)}})})
}finally{_busy=false}}
new MutationObserver(ms=>{if(LANG==='pt'||_busy)return;ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)trDom(n);else if(n.nodeType===3&&n.parentNode&&n.parentNode.tagName!=='TEXTAREA'){_busy=true;const v=_tx(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;_busy=false}}))}).observe(document.body,{childList:true,subtree:true});

/* TABS = só os menus ativos (Configurações › Menus do app). A lista é atualizada no próprio lugar. */
const TABS=[];
function tabsAtualizar(){const off=Array.isArray(S.tabsOff)?S.tabsOff:[];let v=TABS_ALL.filter(t=>!off.includes(t[0]));if(!v.length)v=[TABS_ALL[0]];TABS.length=0;v.forEach(t=>TABS.push(t));try{FL.N=TABS.length}catch(e){}}

function nav(){tabsAtualizar();if(!window._tabChk){window._tabChk=1;if(tab!=='config'&&!TABS.some(t=>t[0]===tab))tab=TABS[0][0]}$('#nav').innerHTML=TABS.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')"${tab===t[0]?' aria-current="page"':''}><span class="ni">${svg(t[0])}</span><span class="nl">${_t(t[2])}</span></button>`).join('');const n=$('#nav'),b=n.querySelector('.on');if(b&&n.scrollWidth>n.clientWidth)n.scrollLeft=b.offsetLeft-(n.clientWidth-b.offsetWidth)/2;navHint(n)}
function navHint(n){
 if(!(S.user&&S.user.name))return; /* tela de login: sem aviso */
 if(window._nvh||n.scrollWidth<=n.clientWidth)return;window._nvh=1;
 const h=document.createElement('div');h.className='nvhint';h.textContent='👉 '+_t('Deslize o menu para o lado e veja mais opções');document.body.appendChild(h);
 const fim=()=>{h.classList.remove('on');setTimeout(()=>h.remove(),500);n.removeEventListener('scroll',fim)};
 setTimeout(()=>h.classList.add('on'),600);n.addEventListener('scroll',fim,{once:true});setTimeout(fim,6000)}

function evItem(e){if(e.id===edEv)return evEdit(e);return `<div class="item ${e.done?'done':''}"><input type="checkbox" ${e.done?'checked':''} onchange="togEv('${e.id}')" aria-label="Concluir"><span class="hora">${e.time||'—'}</span><span class="t">${esc(e.title)}</span><button class="ghost" onclick="edEv='${e.id}';render()" aria-label="Editar">✎</button><button class="ghost" onclick="delEv('${e.id}')" aria-label="Excluir">✕</button></div>`}
function addEv(dateId,titleId,timeId){const t=$('#'+titleId).value.trim();if(!t){$('#'+titleId).focus();return}
 S.ev.push({id:uid(),title:t,date:dateId?$('#'+dateId).value:sel,time:$('#'+timeId).value,done:false});save();render()}
function togEv(id){const e=S.ev.find(x=>x.id===id);e.done=!e.done;save();render()}
function delEv(id){S.ev=S.ev.filter(x=>x.id!==id);save();render()}
const sortEv=a=>a.sort((x,y)=>(x.date+(x.time||'99')).localeCompare(y.date+(y.time||'99')));

/* ---------- Calendário ---------- */
const shiftIco=p=>{const h=(mins(p.ent)||0)/60;return h>=5&&h<17?'☀️':'🌙'};
const mins=t=>{const a=String(t||'').split(':').map(Number);return a.length<2||isNaN(a[0])||isNaN(a[1])?null:a[0]*60+a[1]};
function durMin(p){const a=mins(p.ent),b=mins(p.sai);if(a==null||b==null)return 0;let d=b-a;if(d<=0)d+=1440;return d}
const fmtDur=m=>{const h=Math.floor(m/60),r=m%60;return h+'h'+(r?String(r).padStart(2,'0'):'')};
const cruza=p=>{const a=mins(p.ent),b=mins(p.sai);return a!=null&&b!=null&&b<=a};
const plSort=(a,b)=>(a.date+a.ent).localeCompare(b.date+b.ent);
function calGrid(kind){
 const y=mes.getFullYear(),m=mes.getMonth(),off=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
 let h=[0,1,2,3,4,5,6].map(i=>new Date(2024,0,7+i).toLocaleDateString(LOC(),{weekday:'narrow'})).map(d=>`<div class="dw">${d}</div>`).join('');
 for(let i=0;i<off+n;i++){
  if(i<off){h+='<div></div>';continue}
  const d=i-off+1,k=iso(new Date(y,m,d)),pls=S.pl.filter(p=>p.date===k),hs=kind==='pl'?[...new Set(pls.map(p=>p.hosp).filter(Boolean))].map(hospBy).filter(Boolean):[];
  const inner=kind==='pl'?(pls.length?`<span class="pmk">${pls.slice(0,2).map(shiftIco).join('')}</span>`+(hs.length?`<span class="hds">${hs.slice(0,3).map(hd).join('')}</span>`:''):''):`<span class="dots">${S.ev.some(e=>e.date===k)?'<i></i>':''}${S.diary[k]?'<i class="dr"></i>':''}${pls.length?'<i class="pl"></i>':''}</span>`;
  h+=`<button class="d ${k===HOJE?'hj':''} ${k===sel?'sel':''} ${kind==='pl'&&pls.length?'plt':''}" ${hs[0]?`data-c="${hs[0].cor}"`:''} onclick="${kind==='pl'?`tapPl('${k}')`:`sel='${k}';edPl=null;render()`}" aria-label="Dia ${d}">${d}${inner}</button>`}
 return h}
const calHead=()=>{const y=mes.getFullYear(),m=mes.getMonth();return `<div class="cal-h"><button class="sec" onclick="mes=new Date(${y},${m-1},1);render()" aria-label="Mês anterior">‹</button><strong>${mes.toLocaleDateString(LOC(),{month:'long',year:'numeric'})}</strong><button class="sec" onclick="mes=new Date(${y},${m+1},1);render()" aria-label="Próximo mês">›</button></div>`};
const calSeg=()=>`<div class="seg">${[['cal','📅 Calendário'],['pl','🩺 Meus Plantões']].map(a=>`<button class="${calSub===a[0]?'on':''}" onclick="calSub='${a[0]}';edPl=null;render()">${a[1]}</button>`).join('')}</div>`;

 return `<h2>${_t('Calendário')}</h2>${calSeg()}<div class="card">${calHead()}<div class="grid">${calGrid('cal')}</div><p style="font-size:12px;color:var(--mute);margin:10px 0 0">Ponto azul: compromisso. Vermelho: diário. Verde: plantão.</p></div>
 <h3 style="text-transform:capitalize">${fmt(sel,{weekday:'long',day:'numeric',month:'long'})}</h3>
 <div class="card">${pls.length?pls.map(p=>`<div class="item"><span class="hora">${shiftIco(p)}</span><span class="t">Plantão ${p.ent} → ${p.sai}${hospBy(p.hosp)?`<br><small style="color:var(--mute)">${hd(hospBy(p.hosp))} ${esc(hospBy(p.hosp).name)}</small>`:''}${p.obs?`<br><small style="color:var(--mute)">${esc(p.obs)}</small>`:''}</span><button class="ghost" onclick="calSub='pl';render()" aria-label="Ver plantão">›</button></div>`).join(''):''}${evs.length?evs.map(evItem).join(''):(pls.length?'':'<div class="vazio" style="padding:10px">Nada marcado neste dia.</div>')}
 <div class="row" style="margin-top:10px"><input id="ct" placeholder="Novo compromisso" onkeydown="if(event.key==='Enter')addEv('','ct','ch')"><input type="time" id="ch" style="width:120px"><button onclick="addEv('','ct','ch')">＋</button></div>
 ${S.diary[sel]?`<button class="sec" style="margin-top:10px" onclick="dsel=sel;go('diario')">Ver diário deste dia ${S.diary[sel].mood||''}</button>`:''}</div>`}

function plItem(p,sd){
 if(p.id===edPl)return `<div class="item" style="flex-wrap:wrap"><div class="row" style="width:100%"><input type="date" id="pe-d" value="${p.date}"></div><div class="row" style="width:100%"><label class="fl2">Entrada<input type="time" id="pe-i" value="${p.ent}"></label><label class="fl2">Saída<input type="time" id="pe-o" value="${p.sai}"></label></div><div class="row" style="width:100%">${hospSel('pe-h','pe',p.hosp)}${valIn('pe-v',p.val)}</div><textarea id="pe-ob" style="min-height:60px" placeholder="Observações (opcional)">${esc(p.obs||'')}</textarea><div class="row" style="width:100%"><button onclick="savePl('${p.id}')">Salvar</button><button class="ghost" onclick="edPl=null;render()">Cancelar</button></div></div>`;

function porHosp(a){const m=new Map();a.forEach(p=>{const h=hospBy(p.hosp),k=h?h.id:'';let r=m.get(k);if(!r){r={h:h||null,n:0,min:0,val:0};m.set(k,r)}r.n++;r.min+=durMin(p);r.val+=Number(p.val)||0});
 const o=S.hosp.map(h=>m.get(h.id)).filter(Boolean);if(m.get(''))o.push(m.get(''));return o}

 return `<div class="hb">${porHosp(a).map(r=>`<div class="hr"><span class="hn">${r.h?hd(r.h)+' '+esc(r.h.name):'Sem hospital'}</span><span class="hv">${r.n} · ${fmtDur(r.min)} · <b>${BRL(r.val)}</b></span></div>`).join('')}</div>`}

const valIn=(id,v)=>`<label class="fl2">Diária (R$)<input type="number" id="${id}" step="0.01" min="0" inputmode="decimal" placeholder="0,00" value="${v?v:''}"></label>`;

function qkH(id){plQuickH=id;render()}
const QK={d:['07:00','19:00'],n:['19:00','07:00']};
function setQuick(k){if(plQuick&&plQuick.k===k){plQuick=null}else{const t=QK[k]||(plQuick&&plQuick.k==='c'?[plQuick.ent,plQuick.sai]:['','']);plQuick={k,ent:t[0],sai:t[1]}}render()}
function setQuickT(f,v){if(plQuick)plQuick[f]=v}
function tapPl(k){
 if(!plQuick){sel=k;edPl=null;render();return}
 if(!plQuick.ent||!plQuick.sai){const e=$(plQuick.ent?'#pq-o':'#pq-i');e&&e.focus();return}
 const hq=hospDef(),hid=hq?hq.id:'',ex=S.pl.find(p=>p.date===k&&p.ent===plQuick.ent&&p.sai===plQuick.sai&&(p.hosp||'')===hid);
 const y=window.scrollY;
 if(ex){const go=()=>{S.pl=S.pl.filter(x=>x.id!==ex.id);sel=k;save();render();window.scrollTo(0,y)};if(ex.obs)ask('Remover este plantão (tem observações)?',go,'Remover');else go();return}
 S.pl.push({id:uid(),date:k,ent:plQuick.ent,sai:plQuick.sai,obs:'',hosp:hid,val:hq&&hq.val?hq.val:0});sel=k;edPl=null;save();render();window.scrollTo(0,y)}
function quickBar(){
 const q=plQuick,h=hospDef(),b=(k,t)=>`<button class="${q&&q.k===k?'on':''}" onclick="setQuick('${k}')">${t}</button>`;
 return `<div class="card qk"><strong>⚡ Marcar vários dias</strong>`
 +(S.hosp.length?`<div class="hch" role="group" aria-label="Hospital">${S.hosp.map(x=>`<button class="hc ${h&&h.id===x.id?'on':''}" data-c="${x.cor}" onclick="qkH('${x.id}')"><i class="hdot"></i>${esc(x.name)}</button>`).join('')}</div>`:'')
 +`<div class="seg">${b('d','☀️ 07–19')}${b('n','🌙 19–07')}${b('c','✏️ Outro')}</div>`
 +(q&&q.k==='c'?`<div class="row" style="margin-top:8px"><label class="fl2">Entrada<input type="time" id="pq-i" value="${q.ent}" onchange="setQuickT('ent',this.value)"></label><label class="fl2">Saída<input type="time" id="pq-o" value="${q.sai}" onchange="setQuickT('sai',this.value)"></label></div>`:'')
 +`<p class="hint">${q?`Modo ativo${h?' em <b>'+esc(h.name)+'</b>'+(h.val?' (diária '+BRL(h.val)+')':''):''}: toque nos dias para adicionar o plantão. Toque de novo no mesmo dia para remover. Toque no botão ativo para sair do modo.`:'Escolha o tipo de plantão e depois toque nos dias do calendário, quantos quiser.'+(S.hosp.length?'':' Cadastre seus hospitais na aba 🏥 Hospitais.')}</p></div>`}
function savePl(id){const p=S.pl.find(x=>x.id===id),i=$('#pe-i').value,o=$('#pe-o').value;if(!i){$('#pe-i').focus();return}if(!o){$('#pe-o').focus();return}
 p.date=$('#pe-d').value||p.date;p.ent=i;p.sai=o;p.obs=$('#pe-ob').value.trim();if($('#pe-h'))p.hosp=$('#pe-h').value;p.val=vlr($('#pe-v').value);edPl=null;save();render()}
function vPlantoes(){

 const dia=S.pl.filter(p=>p.date===sel).sort(plSort),mp=S.pl.filter(p=>p.date.startsWith(key)).sort(plSort),tm=mp.reduce((s,p)=>s+durMin(p),0);
 return `<h2>${_t('Calendário')}</h2>${calSeg()}${plSeg()}${quickBar()}<div class="card">${calHead()}<div class="grid">${calGrid('pl')}</div><p style="font-size:12px;color:var(--mute);margin:10px 0 0">${plQuick?'Dias coloridos já têm plantão; a cor indica o hospital. ':'Toque em um dia para ver os plantões dele. '}☀️ diurno · 🌙 noturno.</p>${S.hosp.length?`<div class="hleg">${S.hosp.map(h=>`<span>${hd(h)} ${esc(h.name)}</span>`).join('')}</div>`:''}</div>
 <h3 style="text-transform:capitalize">${fmt(sel,{weekday:'long',day:'numeric',month:'long'})}</h3>
 <div class="card">${dia.length?dia.map(plItem).join(''):'<div class="vazio" style="padding:10px">Nenhum plantão registrado neste dia.'+(plQuick?'':' Escolha o tipo de plantão acima e toque no dia para registrar.')+'</div>'}
</div>

 <div class="card tot"><div class="r"><span>Plantões no mês</span><strong>${mp.length}</strong></div><div class="r"><span>Horas trabalhadas</span><strong>${fmtDur(tm)}</strong></div><div class="r"><span>Total das diárias</span><strong class="mn">${BRL(somaVal(mp))}</strong></div>${breakHtml(mp)}</div>
 ${mp.length?`<div class="card">${mp.map(p=>`<div class="item plrow" onclick="sel='${p.date}';edPl=null;render();window.scrollTo(0,0)"><span class="hora" style="min-width:64px;text-transform:capitalize">${fmt(p.date,{weekday:'short',day:'2-digit'})}</span><div class="t">${shiftIco(p)} ${p.ent} → ${p.sai} <small style="color:var(--ac);font-weight:700">· ${fmtDur(durMin(p))}</small>${plExtra(p)}${p.obs?`<div class="pobs">${esc(p.obs)}</div>`:''}</div></div>`).join('')}</div>`:'<div class="vazio">Nenhum plantão neste mês.</div>'}`}

function addPlH(){const d=$('#ph-d').value,i=$('#ph-i').value,o=$('#ph-o').value;if(!d){$('#ph-d').focus();return}if(!i){$('#ph-i').focus();return}if(!o){$('#ph-o').focus();return}

 +`<div class="card tot"><div class="r"><span>Plantões${plAno==='todos'?' no total':' em '+plAno}</span><strong>${lista.length}</strong></div><div class="r"><span>Horas trabalhadas</span><strong>${fmtDur(tm)}</strong></div><div class="r"><span>Total das diárias</span><strong class="mn">${BRL(somaVal(lista))}</strong></div>${breakHtml(lista)}</div>`

function vPlHosp(){

function side(o){const p=num(o.p),s=num(o.s),q=num(o.q)||1,f=FAM[o.u];if(!(p>0&&s>0))return null;const div=f[0]==='u'?1:1000,amt=s*f[1]*q/div,pay=p*q;return{fam:f[0],pay,amt,per:pay/amt}}

function calcCmp(){const el=$('#cres');if(!el)return;const A=side(cmp.a),B=side(cmp.b),msg=t=>{el.innerHTML='<p style="margin:0">'+t+'</p>'};
 if(!A||!B)return msg('Preencha o preço e o tamanho das duas opções para comparar.');
 if(A.fam!==B.fam)return msg('Essas unidades não podem ser comparadas. Use peso (g, kg), volume (ml, L) ou unidades nas duas opções.');
 const lb={w:'kg',v:'L',u:'un'}[A.fam];
 if(Math.abs(A.per-B.per)<1e-9)return msg('As duas opções custam o mesmo por '+lb+' ('+brl(A.per)+'). Não há vantagem em nenhuma delas.');
 const aw=A.per<B.per,w=aw?'A':'B',l=aw?'B':'A',W=aw?A:B,L=aw?B:A,econ=(L.per-W.per)/L.per*100,mais=(L.per-W.per)/W.per*100,sv=(L.per-W.per)*L.amt;
 el.innerHTML=`<div class="r"><span>Opção A</span><b>${brl(A.per)}/${lb}</b></div><div class="r"><span>Opção B</span><b>${brl(B.per)}/${lb}</b></div><div style="border-top:1px solid var(--ac);margin:10px 0"></div><div class="r"><span>Compensa mais</span><strong>Opção ${w}</strong></div><p style="margin:8px 0 0"><b>Vantagem de ${pct(econ)}:</b> a opção ${w} custa ${pct(econ)} menos por ${lb}.</p><p style="margin:6px 0 0"><b>Desvantagem de ${pct(mais)}:</b> a opção ${l} custa ${pct(mais)} mais que a ${w}.</p><p style="margin:6px 0 0;font-size:14px">Para levar o mesmo conteúdo da opção ${l} (${(+L.amt.toFixed(3)).toLocaleString(LOC())} ${lb}) pela opção ${w}, você economiza ${brl(sv)}.</p>`}

/* preços de cada mercado: nome do produto → {p: preço da loja, x: preço exclusivo do app/cartão (ou 0), tx: nome do tipo, fim}. Encartes encerrados ficam de fora. */
function cmpPrecos(){
 const vivo=fim=>mmVal(fim).k!=='off',R={assai:{},atacadao:{},novo:{}};
 AS_ENC.forEach(e=>{if(!vivo(e.fim))return;asLista(e.txt).forEach(i=>{if(!(i.por>0))return;R.assai[i.n]=e.app?{p:0,x:i.por,tx:'app Meu Assaí',fim:e.fim}:{p:i.por,x:0,tx:'',fim:e.fim}})});
 if(vivo(AT_FIM))atParse(AT_TXT).forEach(s=>s.it.forEach(i=>{if(!(i.at>0))return;const ex=[[i.app,'app Meu Atacadão'],[i.car,'cartão']].filter(a=>a[0]>0&&a[0]<i.at).sort((a,b)=>a[0]-b[0])[0];
  R.atacadao[i.n]={p:i.at,x:ex?ex[0]:0,tx:ex?ex[1]:'',fim:AT_FIM}}));
 /* listas de produtos e preços (PDF): preço único; nomes repetidos com embalagens diferentes levam a embalagem no nome */
 AT_LISTAS.forEach(e=>{if(!vivo(e.fim))return;const L=e.txt.trim().split('\n').map(l=>l.split('|'));
  L.forEach(a=>{if(!(+a[2]>0))return;const dup=L.filter(b=>b[0]===a[0]).length>1;R.atacadao[dup?a[0]+' · '+a[1]:a[0]]={p:+a[2],x:0,tx:'',fim:e.fim}})});
 nvParse(NV_TXT).forEach(s=>{const fim=NV_ENC[s.e].fim;if(!vivo(fim))return;s.it.forEach(i=>{if(i.p>0)R.novo[i.n]={p:i.p,x:0,tx:'',fim:fim}})});
 return R}
/* preço usado na comparação: com a opção ligada vale o menor (loja, app ou cartão); desligada, só o preço da loja */
function cmpPreco(o){if(!o)return null;if(cmpApp){const v=[o.p,o.x].filter(n=>n>0);return v.length?{p:Math.min.apply(null,v),tag:o.x>0&&(!o.p||o.x<o.p)?o.tx:''}:null}
 return o.p>0?{p:o.p,tag:''}:null}
function cmpCalc(){
 const P=cmpPrecos(),EPS=0.005,itens=[];
 CMP.forEach(r=>{const cel={};let n=0;
  CMP_MK.forEach((m,j)=>{const cands=r[4+j];if(!cands)return;let best=null;
   cands.forEach(c=>{const o=cmpPreco(P[m[0]][c[0]]);if(!o)return;const np=o.p/c[1];if(!best||np<best.np)best={np:np,p:o.p,f:c[1],nome:c[0],tag:o.tag}});
   if(best){cel[m[0]]=best;n++}});
  if(n<2)return;const min=Math.min.apply(null,Object.values(cel).map(c=>c.np));
  Object.values(cel).forEach(c=>{c.win=c.np<=min+EPS});itens.push({k:r[0],s:r[1],n:r[2],r:r[3],cel:cel,min:min})});
 const stats=list=>{const o={};CMP_MK.forEach(m=>o[m[0]]={n:0,tot:0,min:0,wins:0});
  list.forEach(it=>Object.keys(it.cel).forEach(id=>{const c=it.cel[id],s=o[id];s.n++;s.tot+=c.np;s.min+=it.min;if(c.win)s.wins++}));
  const rank=CMP_MK.filter(m=>o[m[0]].n>0).map(m=>{const s=o[m[0]];s.id=m[0];s.nome=m[1];s.over=s.min>0?(s.tot/s.min-1)*100:0;return s})
   .sort((a,b)=>a.over-b.over||b.wins-a.wins||a.tot-b.tot);
  return{o:o,rank:rank,best:list.reduce((t,it)=>t+it.min,0),n:list.length}};
 /* soma simples de todos os produtos de cada encarte (informativa) */
 const raw={};CMP_MK.forEach(m=>{let t=0,n=0;Object.values(P[m[0]]).forEach(o=>{const c=cmpPreco(o);if(c){t+=c.p;n++}});raw[m[0]]={tot:t,n:n}});
 const setores=CMP_SET.map(s=>{const l=itens.filter(i=>i.s===s[0]);return l.length?{nome:s[0],em:s[1],itens:l,st:stats(l)}:null}).filter(Boolean);
 return{itens:itens,tot:stats(itens),setores:setores,raw:raw,P:P}}
function cmpRows(st){
 return st.rank.map((s,i)=>{const m=MERC0.find(x=>x.id===s.id),w=i===0&&st.rank.length>1&&(s.over<st.rank[1].over-1e-9||s.wins>st.rank[1].wins);
  return `<div class="cp-r${w?' w':''}"><span class="cp-pos">${i+1}º</span>${logo(m,30)}<div class="cp-m"><strong>${esc(m.nome)}</strong><small>${w?'🏆 mais barato · ':''}${s.wins} de ${s.n} ${s.n===1?'item':'itens'} no menor preço</small></div><div class="cp-v"><b>${brl(s.tot)}</b><small>${s.over<0.05?'menor preço':'+'+pct(s.over)+' vs. melhor'}</small></div></div>`}).join('')}
function cmpItem(it){
 return `<div class="cp-i"><div class="cp-n">${esc(it.n)} <small>· preço por ${esc(it.r)}</small></div><div class="cp-g">${CMP_MK.map(m=>{const c=it.cel[m[0]];
  if(!c)return `<div class="cp-c off"><small>${m[2]}</small><b>—</b><span class="cp-s">não está no encarte</span></div>`;
  return `<div class="cp-c${c.win?' win':''}"><small>${m[2]}${c.win?' 🏆':''}</small><b>${brl(c.np)}</b><span class="cp-s">${esc(c.nome)}${c.f!==1?' (embalagem '+brl(c.p)+')':''}${c.tag?' · '+esc(c.tag):''}</span></div>`}).join('')}</div></div>`}

function setLogo(id,inp){const f=inp.files[0];inp.value='';if(!f)return;const r=new FileReader();
 r.onerror=()=>info('Não foi possível ler essa imagem.');
 r.onload=()=>{const im=new Image();im.onerror=()=>info('Não foi possível abrir essa imagem. Tente um arquivo PNG ou JPG.');
  im.onload=()=>{const w=im.width||200,hh=im.height||200,k=Math.min(1,200/Math.max(w,hh)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(hh*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);const prev=LOGOS[id];LOGOS[id]=c.toDataURL('image/png');if(!saveLogos()){if(prev)LOGOS[id]=prev;else delete LOGOS[id];info('Sem espaço para guardar esse logo.');return}render()};
  im.src=r.result};r.readAsDataURL(f)}

/* ---------- v2.9.4: dados na nuvem (Firebase Firestore) ----------
   Quem entra com Google ou e-mail tem os dados guardados na nuvem, na conta dele (users/{uid}). Ao trocar de aparelho ou sair e entrar de novo, os dados voltam.
   Usa a API REST do Firestore com o token de login do próprio usuário (as regras do Firestore deixam cada um ler e gravar só o que é seu). */
const FS_N='projects/jc-organiza/databases/(default)/documents',FS_B='https://firestore.googleapis.com/v1/'+FS_N,NUV_PART=250000,NUV_FOTOS_MAX=8e6;
const NUV={busy:false,ok:null,msg:'',t:0};let NUV_T=null;

async function fsReq(method,url,body){
 const A=FA(),tk=(await A.getIdToken()).token;
 const r=await fetch(url,{method:method,headers:{'Authorization':'Bearer '+tk,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
 const j=await r.json().catch(()=>null),em=(j&&j.error&&j.error.message)||'';
 if(r.status===404&&method==='GET'&&!/does not exist|not been used|disabled/i.test(em))return null; /* documento ainda não existe */
 if(!r.ok){const e=new Error(em||('HTTP '+r.status));e.code=(j&&j.error&&j.error.status)||String(r.status);throw e}
 return j}

function nuvHash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)+':'+s.length}

 const d=await fsReq('GET',FS_B+'/users/'+uid);if(!d||!d.fields)return null;const f=d.fields;
 return{at:(f.atualizadoEm&&f.atualizadoEm.stringValue)||'',partes:+((f.partes&&f.partes.integerValue)||0)}}
async function nuvEnviar(uid,payload,meta){
 const c=ct()||{},parts=[];for(let i=0;i<payload.length;i+=NUV_PART)parts.push(payload.slice(i,i+NUV_PART));
 const at=new Date().toISOString(),campos=Object.assign(nuvMetaCampos(c),{partes:{integerValue:String(parts.length)},tamanho:{integerValue:String(payload.length)},atualizadoEm:fsv(at)});
 const mask=Object.keys(campos);if(!meta){campos.criadoEm=fsv(at);mask.push('criadoEm')}
 const w=[{update:{name:FS_N+'/users/'+uid,fields:campos},updateMask:{fieldPaths:mask}}];

 for(let i=parts.length;i<((meta&&meta.partes)||0);i++)w.push({delete:FS_N+'/users/'+uid+'/dados/p'+i});

 const r=await fsReq('POST',FS_B+':batchGet',{documents:nomes}),m={};

/* Sincroniza. Devolve true se reiniciou o app com os dados da nuvem. */
async function nuvSync(manual,login){
 if(NUV.busy||!nat()||!FA()||!ct())return false;
 const uid=ct().uid;if(!uid)return false;
 NUV.busy=true;if(manual)nuvSet(null,'Sincronizando…');
 try{

  const sujo=est.hash!==h,igual=est.at===meta.at;
  if(igual){
   if(sujo){const at=await nuvEnviar(uid,local,meta);nuvGrava(uid,{at:at,hash:h,pend:0,touch:Date.now()});nuvSet(true,'Sincronizado.');return false}
   if(login||Date.now()-(est.touch||0)>12*3600e3){await nuvToque(uid,meta);est.touch=Date.now();nuvGrava(uid,est)}
   nuvSet(true,'Tudo sincronizado.');return false}

  let usarNuvem=false;

   const d=await formDlg({title:'Dados na nuvem',sub:'A sua conta já tem dados na nuvem e este aparelho também tem dados diferentes. Quais você quer manter? Os do outro lado serão substituídos.',fields:[],ok:'Usar os da nuvem',links:[{id:'loc',t:'Manter os deste aparelho'}]});
   if(!d){nuvSet(null,'Sincronização pendente: escolha quais dados manter.');return false}

 +(on?sel('nt-l','Avisar compromissos',[[0,'Na hora'],[5,'5 min antes'],[10,'10 min antes'],[15,'15 min antes'],[30,'30 min antes'],[60,'1 hora antes']],N.lead,"setNotif('lead',this.value)")
  +sel('nt-p','Lembrar meus plantões',[[0,'Não lembrar'],[30,'30 min antes'],[60,'1 hora antes'],[120,'2 horas antes'],[180,'3 horas antes']],N.plOn?N.plLead:0,"setNotif('plLead',this.value)"):'')
 +`<label class="fl">Música do alarme</label><div class="somnome">🎵 ${sn?esc(sn.name):'Som padrão (bipes)'}</div><div class="row" style="margin-top:8px"><button class="sec" onclick="$('#nt-f').click()">🎵 Escolher música</button><button class="sec" onclick="alarme('Teste do alarme','É assim que o alarme vai tocar.')">▶ Testar</button>${sn?'<button class="ghost" onclick="removerSom()">Remover</button>':''}</div><input type="file" id="nt-f" accept="audio/*" style="display:none" onchange="escolherSom(this)">`
 +`<p class="hint">Escolha qualquer música dos arquivos do seu celular. Com o app aberto, ou ao tocar na notificação, a música toca em repetição até você parar. Com o app fechado, o celular mostra a notificação com o som padrão dele, pois o Android não deixa um app trocar o som sem estar aberto.${app?'':' Neste navegador os avisos só funcionam com a página aberta.'} A música fica só neste aparelho e não entra no backup.</p></div>`}


/* ---------- Carteira (v1.6) ---------- */
const CCATS=[['contas','🏠','Contas'],['feira','🛒','Feira / mercado'],['extra','🎉','Gastos extras'],['transp','🚗','Transporte'],['saude','💊','Saúde'],['outros','📦','Outros']];
const ccat=id=>CCATS.find(c=>c[0]===id)||CCATS[5];
const cR2=n=>Math.round((+n||0)*100)/100;
const cSum=a=>cR2(a.reduce((s,x)=>s+(+x.val||0),0));
function normCart(){
 const c=S.cart=(S.cart&&typeof S.cart==='object'&&!Array.isArray(S.cart))?S.cart:{};
 c.base=cR2(c.base);delete c.usePl;
 ['rendas','fixas','gastos'].forEach(k=>{c[k]=Array.isArray(c[k])?c[k].filter(x=>x&&typeof x==='object'):[]});
 c.fixas.forEach(f=>{f.val=cR2(f.val);f.dia=Math.min(31,Math.max(1,parseInt(f.dia)||1));f.desc=String(f.desc||'');f.cat=f.cat||'contas';f.ini=f.ini||HOJE.slice(0,7)});
 c.gastos.forEach(g=>{g.val=cR2(g.val);g.date=g.date||HOJE;g.cat=g.cat||'outros';g.desc=String(g.desc||'')});
 c.rendas.forEach(r=>{r.val=cR2(r.val);r.m=r.m||HOJE.slice(0,7);r.desc=String(r.desc||'')});
 c.pagas=(c.pagas&&typeof c.pagas==='object'&&!Array.isArray(c.pagas))?c.pagas:{};
 const N=S.notif=S.notif||{};if(N.cwOn===undefined)N.cwOn=true;if(N.cwLead===undefined||isNaN(+N.cwLead))N.cwLead=2;if(!/^\d{2}:\d{2}$/.test(N.cwHora||''))N.cwHora='09:00'}
let cSub='res',cMes=HOJE.slice(0,7),cEd=null;
/* aceita 1500 | 1500,50 | 1.500,50 | 1.500 | 15.5 */
const cNum=v=>{let s=String(v==null?'':v).trim().replace(/[^\d.,]/g,'');
 if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');
 else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
 const n=parseFloat(s);return isNaN(n)||n<0?0:cR2(n)};
const cTxt=n=>n?String(cR2(n)).replace('.',','):'';
const cMesTxt=()=>new Date(cMes+'-01T12:00').toLocaleDateString(LOC(),{month:'long',year:'numeric'});
const cAtual=()=>cMes===HOJE.slice(0,7);
const cDataPad=()=>cAtual()?HOJE:cMes+'-01';
const cPrev=m=>{const a=m.split('-').map(Number);return iso(new Date(a[0],a[1]-2,1)).slice(0,7)};
function cMove(n){const a=cMes.split('-').map(Number);cMes=iso(new Date(a[0],a[1]-1+n,1)).slice(0,7);cEd=null;render()}
const cFix=m=>S.cart.fixas.filter(f=>f.ini<=m&&(!f.fim||m<=f.fim)).sort((a,b)=>a.dia-b.dia||a.desc.localeCompare(b.desc));
const cPago=(m,id)=>!!(S.cart.pagas[m]&&S.cart.pagas[m][id]);
const cGas=m=>S.cart.gastos.filter(g=>g.date.slice(0,7)===m).sort((a,b)=>b.date.localeCompare(a.date));
const cRen=m=>S.cart.rendas.filter(r=>r.m===m);
function cCalc(m){
 const c=S.cart,fx=cFix(m),gs=cGas(m),re=cRen(m);
 const rExtra=cSum(re),renda=cR2(c.base+rExtra);
 const fixTot=cSum(fx),fixPago=cSum(fx.filter(f=>cPago(m,f.id))),gasTot=cSum(gs);
 const gastos=cR2(fixTot+gasTot),porCat={};
 fx.concat(gs).forEach(x=>{const k=ccat(x.cat)[0];porCat[k]=cR2((porCat[k]||0)+x.val)});
 return {fx,gs,re,rExtra,renda,fixTot,fixPago,gasTot,gastos,porCat,sobra:cR2(renda-gastos),falta:cR2(fixTot-fixPago)}}
const cSel=(id,cur)=>`<select id="${id}" aria-label="Categoria">${CCATS.map(c=>`<option value="${c[0]}" ${c[0]===cur?'selected':''}>${c[1]} ${c[2]}</option>`).join('')}</select>`;
const cClear=ids=>ids.forEach(i=>{const e=$('#'+i);if(e)e.value=''});
const cFoco=id=>{const e=$('#'+id);if(e)e.focus()};

function vCarteira(){
 const k=cCalc(cMes);
 const seg=`<div class="seg s4">${[['res','📊 Resumo'],['gas','💸 Gastos'],['fix','📌 Fixas'],['ren','💵 Renda']].map(a=>`<button class="${cSub===a[0]?'on':''}" onclick="cSub='${a[0]}';cEd=null;render()">${a[1]}</button>`).join('')}</div>`;
 const nv=`<div class="cal-h"><button class="sec" onclick="cMove(-1)" aria-label="Mês anterior">‹</button><strong class="cw-m">${esc(cMesTxt())}</strong><button class="sec" onclick="cMove(1)" aria-label="Próximo mês">›</button></div>`;
 return `<h2>${_t('Carteira')}</h2>`+seg+nv+(cSub==='res'?cResumo(k):cSub==='gas'?cGastos(k):cSub==='fix'?cFixas(k):cRenda(k))}

/* --- Resumo --- */
function cResumo(k){
 const real=k.renda>0?Math.round(k.gastos/k.renda*100):(k.gastos>0?100:0),cap=Math.min(100,real);
 const cls=k.renda>0&&k.gastos>k.renda?'over':real>=80?'warn':'';
 const aviso=k.renda<=0?`<p class="hint">Informe quanto você ganha na aba <b>Renda</b> para ver quanto sobra no mês.</p>`
  :k.gastos>k.renda?`<p class="cw-warn">⚠️ Os gastos passaram da renda em ${BRL(-k.sobra)}.</p>`
  :real>=80?`<p class="cw-warn">Atenção: você já usou ${real}% da renda do mês.</p>`:'';
 const cats=CCATS.map(c=>[c,k.porCat[c[0]]||0]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
 const catHtml=cats.length?cats.map(x=>{const p=k.gastos>0?Math.round(x[1]/k.gastos*100):0;return `<div class="cw-cat"><div class="top"><span>${x[0][1]} ${x[0][2]}</span><span class="cw-v">${BRL(x[1])} <small style="color:var(--mute);font-weight:500">· ${p}%</small></span></div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join(''):'<div class="vazio" style="padding:14px 8px">Nenhum gasto lançado neste mês.</div>';
 return `<div class="card tot">
  <div class="cw-row"><span>💵 Renda do mês</span><b class="cw-in">${BRL(k.renda)}</b></div>
  <div class="cw-row"><span>💸 Gastos do mês</span><b class="cw-out">${BRL(k.gastos)}</b></div>
  <div class="cw-sobra"><span>${k.sobra<0?'Falta':'Sobra'}</span><strong class="${k.sobra<0?'neg':''}">${BRL(Math.abs(k.sobra))}</strong></div>
  <div class="cw-bar ${cls}" role="progressbar" aria-valuenow="${cap}" aria-valuemin="0" aria-valuemax="100" aria-label="Quanto da renda já foi usada"><i style="width:${cap}%"></i></div>
  <small style="color:var(--mute)">${k.renda>0?'Você usou '+real+'% da renda':'Sem renda informada'}</small>${aviso}
  ${k.falta>0?`<p class="hint">📌 Contas fixas ainda por pagar: <b>${BRL(k.falta)}</b></p>`:''}</div>
 <div class="row"><button style="flex:1" onclick="cSub='gas';render();cFoco('cw-gd')">＋ Lançar gasto</button><button class="sec" style="flex:1" onclick="cSub='fix';render()">📌 Contas fixas</button></div>
 <h3>Para onde foi o dinheiro</h3><div class="card">${catHtml}</div>`}

/* --- Gastos avulsos --- */
function cEditForm(kind,x){
 return `<div class="item" style="flex-wrap:wrap"><input id="cw-e-d" value="${esc(x.desc)}" placeholder="${kind==='f'?'Conta':'Descrição'}" aria-label="Descrição">
  <div class="row" style="width:100%"><input id="cw-e-v" inputmode="decimal" value="${cTxt(x.val)}" placeholder="Valor" aria-label="Valor">${kind==='g'?`<input type="date" id="cw-e-dt" value="${x.date}" aria-label="Data">`:`<input id="cw-e-dia" type="number" min="1" max="31" inputmode="numeric" value="${x.dia}" style="width:96px" aria-label="Dia do vencimento">`}${cSel('cw-e-c',x.cat)}</div>
  <div class="row" style="width:100%"><button onclick="cSaveEd()">Salvar</button><button class="ghost" onclick="cEd=null;render()">Cancelar</button></div></div>`}
function cGItem(g){
 if(cEd&&cEd.k==='g'&&cEd.id===g.id)return cEditForm('g',g);
 const c=ccat(g.cat);
 return `<div class="item"><span class="cw-ic" aria-hidden="true">${c[1]}</span><div class="t" onclick="cEdit('g','${g.id}')" style="cursor:pointer"><b>${esc(g.desc||c[2])}</b><br><small style="color:var(--mute)">${fmt(g.date,{weekday:'short',day:'2-digit',month:'short'})} · ${c[2]}</small></div><b class="cw-v">${BRL(g.val)}</b><button class="ghost" onclick="cDelG('${g.id}')" aria-label="Excluir gasto">✕</button></div>`}
function cGastos(k){
 const form=`<div class="card"><input id="cw-gd" placeholder="O que foi? (ex.: Feira, Uber, Presente)" maxlength="60" onkeydown="if(event.key==='Enter')cFoco('cw-gv')">
  <div class="row" style="margin-top:8px"><input id="cw-gv" inputmode="decimal" placeholder="Valor (R$)" onkeydown="if(event.key==='Enter')cAddG()">${cSel('cw-gc','feira')}</div>
  <div class="row" style="margin-top:8px"><input type="date" id="cw-gdt" value="${cDataPad()}" aria-label="Data"><button onclick="cAddG()">＋ Adicionar</button></div></div>`;
 return form+`<h3>Gastos do mês · ${BRL(k.gasTot)}</h3>`+(k.gs.length?`<div class="card">${k.gs.map(cGItem).join('')}</div><p class="hint">Toque em um gasto para editar.</p>`:'<div class="vazio">Nenhum gasto avulso neste mês.</div>')}
function cAddG(){
 const d=$('#cw-gd').value.trim(),v=cNum($('#cw-gv').value),c=$('#cw-gc').value,dt=$('#cw-gdt').value||HOJE;
 if(!v){info('Informe o valor do gasto.');return}
 S.cart.gastos.push({id:uid(),date:dt,cat:c,desc:d,val:v});cMes=dt.slice(0,7);
 save();render();cClear(['cw-gd','cw-gv']);cFoco('cw-gd')}
function cDelG(id){ask('Excluir este gasto?',()=>{S.cart.gastos=S.cart.gastos.filter(x=>x.id!==id);save();render()})}
function cEdit(kind,id){cEd={k:kind,id:id};render();cFoco('cw-e-v')}
function cSaveEd(){
 if(!cEd)return;const L=cEd.k==='g'?S.cart.gastos:cEd.k==='r'?S.cart.rendas:S.cart.fixas,x=L.find(i=>i.id===cEd.id);
 if(!x){cEd=null;render();return}
 const v=cNum($('#cw-e-v').value),d=$('#cw-e-d').value.trim();
 if(!v){info('Informe o valor.');return}
 if(cEd.k==='f'&&!d){info('Informe o nome da conta.');return}
 x.desc=d;x.val=v;if(cEd.k!=='r')x.cat=$('#cw-e-c').value;
 if(cEd.k==='g'){x.date=$('#cw-e-dt').value||x.date;cMes=x.date.slice(0,7)}
 else if(cEd.k==='f')x.dia=Math.min(31,Math.max(1,parseInt($('#cw-e-dia').value)||x.dia));
 cEd=null;save();render()}

/* --- Contas fixas (repetem todo mês) --- */
function cFItem(f){
 if(cEd&&cEd.k==='f'&&cEd.id===f.id)return cEditForm('f',f);
 const pg=cPago(cMes,f.id),atr=!pg&&cAtual()&&f.dia<(+HOJE.slice(8,10)),c=ccat(f.cat);
 return `<div class="item ${pg?'done':''}"><input type="checkbox" ${pg?'checked':''} onchange="cTogPago('${f.id}')" aria-label="Marcar como paga"><div class="t" onclick="cEdit('f','${f.id}')" style="cursor:pointer"><b>${esc(f.desc)}</b><br><small class="${atr?'cw-late':''}" ${atr?'':'style="color:var(--mute)"'}>${c[1]} vence dia ${f.dia}${pg?' · paga ✓':atr?' · atrasada':''}</small></div><b class="cw-v">${BRL(f.val)}</b><button class="ghost" onclick="cDelF('${f.id}')" aria-label="Remover conta fixa">✕</button></div>`}
/* --- Lembrete de contas perto de vencer --- */
function cwGatilhos(N){
 const out=[],hh=String(N.cwHora||'09:00').split(':').map(Number),H=isNaN(hh[0])?9:hh[0],M=isNaN(hh[1])?0:hh[1],lead=Math.max(0,+N.cwLead||0),now=new Date();
 for(let k=0;k<3;k++){
  const base=new Date(now.getFullYear(),now.getMonth()+k,1),ym=iso(base).slice(0,7),ult=new Date(base.getFullYear(),base.getMonth()+1,0).getDate();
  cFix(ym).forEach(f=>{
   if(cPago(ym,f.id))return;
   const dia=Math.min(f.dia,ult),venc=new Date(base.getFullYear(),base.getMonth(),dia,H,M,0,0),
    dd=String(dia).padStart(2,'0')+'/'+String(base.getMonth()+1).padStart(2,'0'),corpo=BRL(f.val)+' · vencimento em '+dd;
   if(lead>0){const a=new Date(venc.getTime());a.setDate(a.getDate()-lead);
    out.push({key:'c'+f.id+ym+'a',at:a.getTime(),title:'💰 '+f.desc+' vence '+(lead===1?'amanhã':'em '+lead+' dias'),body:corpo})}
   out.push({key:'c'+f.id+ym+'b',at:venc.getTime(),title:'💰 '+f.desc+' vence hoje',body:corpo+' · ainda não está marcada como paga'})})}
 return out}
function setCw(k,v){S.notif[k]=k==='cwOn'?!!v:k==='cwHora'?String(v||'09:00'):+v;save();agendarNotifs(true);render()}
function cwLembrete(){
 const N=S.notif,sn=N.sound;
 if(!N.on)return `<div class="card"><b>🔔 Lembrete de contas</b><p class="hint" style="margin:6px 0 10px">Receba um aviso no celular antes de a conta vencer, com o alarme que você escolher.</p><button style="width:100%" onclick="ativarLembretes(true)">🔔 Ativar lembretes</button></div>`;
 const on=N.cwOn!==false,opts=[[0,'Só no dia do vencimento'],[1,'1 dia antes'],[2,'2 dias antes'],[3,'3 dias antes'],[5,'5 dias antes'],[7,'7 dias antes']];
 return `<div class="card"><button class="${on?'sec':''}" style="width:100%" onclick="setCw('cwOn',${!on})">${on?'🔔 Avisos de contas ligados · tocar para desligar':'🔕 Avisos de contas desligados · tocar para ligar'}</button>`
 +(on?`<label class="fl" for="cw-lead">Avisar</label><select id="cw-lead" style="width:100%" onchange="setCw('cwLead',this.value)">${opts.map(o=>`<option value="${o[0]}" ${o[0]===(+N.cwLead||0)?'selected':''}>${o[1]}</option>`).join('')}</select>`
  +`<label class="fl" for="cw-hora">Horário do aviso</label><input type="time" id="cw-hora" value="${esc(N.cwHora||'09:00')}" onchange="setCw('cwHora',this.value)">`
  +`<label class="fl">Alarme</label><div class="somnome">🎵 ${sn?esc(sn.name):'Som padrão (bipes)'}</div><div class="row" style="margin-top:8px"><button class="sec" onclick="$('#cw-snd').click()">🎵 Escolher música</button><button class="sec" onclick="alarme('💰 Teste de aviso de conta','É assim que o alarme vai tocar.')">▶ Testar</button>${sn?'<button class="ghost" onclick="removerSom()">Remover</button>':''}</div><input type="file" id="cw-snd" accept="audio/*" style="display:none" onchange="escolherSom(this)">`
  +`<p class="hint">Você é avisado até o dia do vencimento, e some o aviso assim que marcar a conta como paga. Com o app aberto, ou ao tocar na notificação, a música escolhida toca em repetição até você parar. Com o app fechado, o celular usa o som padrão dele. O mesmo alarme vale para os lembretes da agenda.</p>`:'')+`</div>`}
function cFixas(k){
 const form=`<div class="card"><input id="cw-fd" placeholder="Conta (ex.: Aluguel, Luz, Internet)" maxlength="60" onkeydown="if(event.key==='Enter')cFoco('cw-fv')">
  <div class="row" style="margin-top:8px"><input id="cw-fv" inputmode="decimal" placeholder="Valor (R$)" onkeydown="if(event.key==='Enter')cAddF()"><input id="cw-fdia" type="number" min="1" max="31" inputmode="numeric" placeholder="Vence dia" style="width:116px" onkeydown="if(event.key==='Enter')cAddF()"></div>
  <div class="row" style="margin-top:8px">${cSel('cw-fc','contas')}<button onclick="cAddF()">＋ Adicionar</button></div>
  <p class="hint">A conta passa a aparecer todo mês, a partir de ${esc(cMesTxt())}. Marque ✓ quando pagar.</p></div>`;
 const resumo=k.fx.length?`<div class="card tot"><div class="cw-row"><span>Total das contas fixas</span><b>${BRL(k.fixTot)}</b></div><div class="cw-row"><span>✓ Já pago</span><b class="cw-in">${BRL(k.fixPago)}</b></div><div class="cw-row"><span>A pagar</span><b class="${k.falta>0?'cw-out':''}">${BRL(k.falta)}</b></div></div>`:'';
 return cwLembrete()+form+resumo+(k.fx.length?`<div class="card">${k.fx.map(cFItem).join('')}</div><p class="hint">Toque em uma conta para editar o valor ou o vencimento.</p>`:'<div class="vazio">Nenhuma conta fixa neste mês.</div>')}
function cAddF(){
 const d=$('#cw-fd').value.trim(),v=cNum($('#cw-fv').value),dia=Math.min(31,Math.max(1,parseInt($('#cw-fdia').value)||1)),c=$('#cw-fc').value;
 if(!d){cFoco('cw-fd');return}
 if(!v){info('Informe o valor da conta.');return}
 S.cart.fixas.push({id:uid(),desc:d,val:v,dia:dia,cat:c,ini:cMes});
 save();render();cClear(['cw-fd','cw-fv','cw-fdia']);cFoco('cw-fd')}
function cTogPago(id){const p=S.cart.pagas;p[cMes]=p[cMes]||{};if(p[cMes][id])delete p[cMes][id];else p[cMes][id]=true;save();render()}
function cDelF(id){
 const f=S.cart.fixas.find(x=>x.id===id);if(!f)return;
 ask('Parar de contar "'+f.desc+'" a partir de '+cMesTxt()+'? Os meses anteriores continuam como estavam.',()=>{
  const prev=cPrev(cMes);
  if(prev<f.ini){S.cart.fixas=S.cart.fixas.filter(x=>x.id!==id);Object.keys(S.cart.pagas).forEach(m=>{delete S.cart.pagas[m][id]})}
  else{f.fim=prev;Object.keys(S.cart.pagas).forEach(m=>{if(m>=cMes)delete S.cart.pagas[m][id]})}
  save();render()},'Remover')}

/* --- Renda --- */
function cRenda(k){
 const base=`<div class="card"><label class="fl" for="cw-base" style="margin-top:0">Quanto você ganha por mês (renda fixa)</label><div class="row"><input id="cw-base" inputmode="decimal" placeholder="Ex.: 2500,00" value="${cTxt(S.cart.base)}" onkeydown="if(event.key==='Enter')cSaveBase()"><button onclick="cSaveBase()">Salvar</button>${S.cart.base?'<button class="ghost" onclick="cDelBase()">Remover</button>':''}</div><p class="hint">Esse valor vale para todos os meses. O que varia (extras, bicos, 13º) você lança mais abaixo, no mês certo.</p></div>`;
 const ex=`<h3>Rendas extras de ${esc(cMesTxt())}</h3><div class="card"><div class="row"><input id="cw-rd" placeholder="De onde veio? (ex.: Bico, 13º)" maxlength="60" onkeydown="if(event.key==='Enter')cFoco('cw-rv')"><input id="cw-rv" inputmode="decimal" placeholder="Valor (R$)" style="width:110px" onkeydown="if(event.key==='Enter')cAddR()"><button onclick="cAddR()">＋</button></div>`
  +(k.re.length?k.re.map(cRItem).join(''):'<div class="vazio" style="padding:14px 8px">Nenhuma renda extra neste mês.</div>')+`</div>`+(k.re.length?'<p class="hint">Toque em uma renda para editar.</p>':'');
 const resumo=`<div class="card tot"><div class="cw-row"><span>Renda fixa</span><b>${BRL(S.cart.base)}</b></div>${k.rExtra?`<div class="cw-row"><span>Extras</span><b>${BRL(k.rExtra)}</b></div>`:''}<div class="cw-sobra"><span>Renda total do mês</span><strong>${BRL(k.renda)}</strong></div></div>`;

const ocrSimd=()=>{try{return WebAssembly.validate(new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,123,3,2,1,0,10,10,1,8,0,65,0,253,15,253,98,11]))}catch(e){return false}};
const ocrLang=()=>(LANGS.find(l=>l[0]===LANG)||LANGS[0])[3];
const ocrCore=()=>'tesseract-core'+(ocrSimd()?'-simd':'')+'-lstm.wasm.js';
/* arquivos do leitor: [endereço local, endereço no CDN] */
const ocrArqs=()=>{const l=ocrLang();return[
 [ocrUrl('tesseract.min.js'),OCR_CDN+'tesseract.js@'+OCR_VT+'/dist/tesseract.min.js'],
 [ocrUrl('worker.min.js'),OCR_CDN+'tesseract.js@'+OCR_VT+'/dist/worker.min.js'],
 [ocrUrl('core/'+ocrCore()),OCR_CDN+'tesseract.js-core@'+OCR_VC+'/'+ocrCore()],
 [ocrUrl('lang/'+l+'.traineddata.gz'),OCR_CDN+'@tesseract.js-data/'+l+'@1/4.0.0_best_int/'+l+'.traineddata.gz']]};
/* fontes tentadas em ordem: primeiro a pasta ocr/ do app, depois o CDN */
const ocrFontes=()=>{const l=ocrLang();return[
 {n:'local',tess:ocrUrl('tesseract.min.js'),worker:ocrUrl('worker.min.js'),core:ocrUrl('core'),lang:ocrUrl('lang'),blob:false,ms:20000},
 {n:'cdn',tess:OCR_CDN+'tesseract.js@'+OCR_VT+'/dist/tesseract.min.js',worker:OCR_CDN+'tesseract.js@'+OCR_VT+'/dist/worker.min.js',core:OCR_CDN+'tesseract.js-core@'+OCR_VC,lang:OCR_CDN+'@tesseract.js-data/'+l+'@1/4.0.0_best_int',blob:true,ms:120000}]};
async function ocrPronto(){if(!window.caches)return false;try{const r=await Promise.all(ocrArqs().map(async a=>(await caches.match(a[0]))||(await caches.match(a[1]))));return r.every(Boolean)}catch(e){return false}}
/* Com internet, guarda os arquivos do leitor no aparelho (uma vez). Depois disso a leitura funciona sem internet. */
let ocrBusy=false;
async function ocrAquecer(){if(ocrBusy||!window.caches||navigator.onLine===false)return;ocrBusy=true;
 try{const c=await caches.open(OCR_CACHE);
  for(const a of ocrArqs()){
   try{if((await c.match(a[0]))||(await c.match(a[1])))continue}catch(e){}
   let ok=false;
   for(const u of a){try{const r=await fetch(u);if(r&&r.ok){await c.put(u,r);ok=true;break}}catch(e){}}}
 }catch(e){}
 ocrBusy=false;ocrMostra()}
async function ocrMostra(){const e=$('#ocr-st');if(!e)return;const ok=await ocrPronto();
 e.className='hint';e.innerHTML=ok?'✅ <b>Leitor offline pronto.</b> Pode escanear sem internet.':'⏳ O leitor offline ainda não foi guardado neste aparelho. Conecte à internet uma vez; ele é baixado sozinho e depois funciona sem internet.'}
function ocrScript(u){return new Promise((res,rej)=>{if(window.Tesseract)return res(window.Tesseract);
 const s=document.createElement('script');s.src=u;s.onload=()=>window.Tesseract?res(window.Tesseract):rej(new Error('sem leitor'));s.onerror=()=>{s.remove();rej(new Error('leitor não encontrado'))};document.head.appendChild(s)})}
const ocrLimite=(p,ms)=>new Promise((res,rej)=>{const t=setTimeout(()=>rej(new Error('tempo esgotado')),ms);p.then(v=>{clearTimeout(t);res(v)},e=>{clearTimeout(t);rej(e)})});
/* Cria o leitor: tenta a pasta ocr/ e, se não der, o CDN. Guarda o motivo em SC.err. */
async function ocrCriar(){
 if(SC.worker)return SC.worker;
 let ult=null;
 for(const f of ocrFontes()){
  let w=null;
  try{
   const T=await ocrLimite(ocrScript(f.tess),f.ms);
   const op={workerPath:f.worker,corePath:f.core,langPath:f.lang,workerBlobURL:f.blob,
    logger:m=>{if(m&&typeof m.progress==='number')scProg(m.progress,m.status==='recognizing text'?'Lendo o texto da foto…':'Preparando o leitor…')}};
   if(!f.blob)op.cacheMethod='none';
   const pw=T.createWorker(ocrLang(),1,op);
   pw.then(x=>{w=x},()=>{});
   SC.worker=await ocrLimite(pw,f.ms);
   return SC.worker
  }catch(e){ult=e;try{if(w)w.terminate()}catch(_){}}}
 SC.err=ult;throw ult||new Error('sem leitor')}

/* Lê o texto de etiquetas de prateleira: cada preço (12,99) é ligado ao nome que veio logo antes dele. */
function parseEtiquetas(txt){
 const lines=String(txt||'').split(/\r?\n/).map(l=>l.replace(/[|_~=•«»]+/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean);
 const R1=/(?:R\s*\$?\s*)?(\d{1,4})\s*[,.]\s*(\d{2})(?!\d)/,R2=/R\s*\$\s*(\d{1,3})\s+(\d{2})(?!\d)/;
 const letras=s=>(s.match(/[A-Za-zÀ-ÿ]/g)||[]).length;
 const ruido=s=>/^(oferta|promocao|preco|por|de|cod|codigo|ean|un|kg|unid|unidade|leve|pague|economize|validade|data|r)$/.test(nrm(s).replace(/[^a-z ]/g,'').trim());
 const titulo=s=>{const up=s.replace(/[^A-Za-zÀ-ÿ]/g,'');return up&&up===up.toUpperCase()?s.toLowerCase().replace(/(^|[\s\-\/])([a-zà-ÿ])/g,(m,a,b)=>a+b.toUpperCase()):s};
 const limpa=s=>titulo(String(s).replace(/\b\d{6,}\b/g,' ').replace(/[^\wÀ-ÿ%.,\/\- ]/g,' ').replace(/\s+/g,' ').replace(/^[\s.,\-\/]+|[\s.,\-\/]+$/g,'')).slice(0,60);
 const out=[];let nome=[];
 for(const l of lines){
  let m=l.match(R1),p=null,rest=l;
  if(m){p=parseFloat(m[1]+'.'+m[2]);rest=l.replace(R1,' ')}
  else{m=l.match(R2);if(m){p=parseFloat(m[1]+'.'+m[2]);rest=l.replace(R2,' ')}}
  if(p!=null&&p>=0.05&&p<10000){
   rest=rest.replace(/R\s*\$/g,' ').trim();
   let nm=nome.join(' ');
   if(!nm&&letras(rest)>=4)nm=rest;
   const kg=/\bkg\b|\/\s*kg|quilo/i.test(l+' '+nm);
   out.push({on:true,nome:limpa(nm),preco:String(p.toFixed(2)).replace('.',','),un:kg?'kg':'un'});
   nome=[];
  }else if(letras(l)>=3&&!ruido(l)){nome.push(l);if(nome.length>3)nome.shift()}
 }
 return out}

function scFechar(){scParar();if(SC.worker){try{SC.worker.terminate()}catch(e){}SC.worker=null}const o=$('#scan');if(o)o.remove();document.body.style.overflow=''}

async function scCam(){
 const o=$('#scan');if(!o)return;scParar();
 o.innerHTML=scTopo()+`<div class="sc-cam"><video id="sc-v" autoplay playsinline muted></video><div class="sc-guia"></div><div class="sc-dica">Encaixe a etiqueta (nome e preço) dentro da moldura e toque no botão branco.</div><div class="sc-msg" id="sc-m"><p>Abrindo a câmera…</p></div></div>`
 +`<div class="sc-bar"><button onclick="$('#sc-f').click()">🖼️ Foto</button><button class="sc-shot" id="sc-b" onclick="scFoto()" aria-label="Tirar foto" disabled></button><button onclick="scRev()" ${SC.rows.length?'':'disabled'}>Itens (${SC.rows.length})</button></div>`
 +`<input type="file" id="sc-f" accept="image/*" capture="environment" hidden onchange="scArquivo(this)">`;
 scBox();
 try{
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia))throw new Error('semcam');
  const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
  if(!$('#scan')){st.getTracks().forEach(t=>t.stop());return}
  SC.stream=st;const v=$('#sc-v');v.srcObject=st;try{await v.play()}catch(e){}scBox();
  const m=$('#sc-m');if(m)m.remove();const b=$('#sc-b');if(b)b.disabled=false;
