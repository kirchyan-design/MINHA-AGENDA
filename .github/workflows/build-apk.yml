name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Preparar pasta www
        run: |
          mkdir -p www
          for f in index.html style.css script.js; do
            if [ -f "$f" ]; then cp "$f" www/; fi
          done
          test -f www/index.html || { echo "ERRO: faltou o index.html na raiz do repositorio."; exit 1; }
          grep -q "function render" www/index.html || { echo "ERRO: o index.html do repositorio esta errado (nao e o app completo). Envie o index.html correto."; exit 1; }
          ls -la www

      - name: Criar projeto Android
        run: npx cap add android

      - name: Assinatura fixa e versão (permite instalar por cima)
        env:
          RUN: ${{ github.run_number }}
        run: |
          G=android/app/build.gradle
          if [ ! -f jc-organiza.keystore ]; then
            echo "Criando jc-organiza.keystore a partir do workflow"
            echo "" | base64 -d > jc-organiza.keystore
          fi
          grep -q jc-organiza.keystore "$G" || sed -i '/^android {/a\    signingConfigs {\n        debug {\n            storeFile file("$rootDir/../jc-organiza.keystore")\n            storePassword "jcorganiza2026"\n            keyAlias "jc"\n            keyPassword "jcorganiza2026"\n        }\n    }' "$G"
          sed -i "s/versionCode [0-9]*/versionCode $RUN/; s/versionName \"[^\"]*\"/versionName \"1.3.$RUN\"/" "$G"
          grep -n "signingConfigs\|storeFile\|versionCode\|versionName" "$G"

      - name: Permitir salvar backup em Documentos (Android)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q WRITE_EXTERNAL_STORAGE "$M" || sed -i '/android.permission.INTERNET/a\    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />' "$M"
          grep -q requestLegacyExternalStorage "$M" || sed -i 's#<application#<application android:requestLegacyExternalStorage="true"#' "$M"
          grep -n "EXTERNAL_STORAGE\|requestLegacy" "$M" || true

      - name: Permissões de notificação e alarme (Android)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM RECEIVE_BOOT_COMPLETED VIBRATE WAKE_LOCK; do
            grep -q "android.permission.$P\"" "$M" || sed -i "/android.permission.INTERNET/a\    <uses-permission android:name=\"android.permission.$P\" />" "$M"
          done
          grep -n "uses-permission" "$M" || true

      - name: Permissões de fotos, vídeos e áudio + plugin nativo (Android)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in READ_MEDIA_IMAGES READ_MEDIA_VIDEO READ_MEDIA_AUDIO; do
            grep -q "android.permission.$P\"" "$M" || sed -i "/android.permission.INTERNET/a\    <uses-permission android:name=\"android.permission.$P\" />" "$M"
          done
          grep -q "android.permission.READ_EXTERNAL_STORAGE" "$M" || sed -i '/android.permission.INTERNET/a\    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />' "$M"
          D=android/app/src/main/java/com/minhaagenda/app
          mkdir -p "$D"
          cat > "$D/MediaPermissionsPlugin.java" <<'EOF'
          package com.minhaagenda.app;

          import android.Manifest;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;

          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          import java.util.ArrayList;
          import java.util.List;

          /** Pede permissão de fotos, vídeos e áudio (Android 13+) ou armazenamento (Android 12 e anterior). */
          @CapacitorPlugin(
              name = "MediaPermissions",
              permissions = {
                  @Permission(alias = "images", strings = { Manifest.permission.READ_MEDIA_IMAGES }),
                  @Permission(alias = "video", strings = { Manifest.permission.READ_MEDIA_VIDEO }),
                  @Permission(alias = "audio", strings = { Manifest.permission.READ_MEDIA_AUDIO }),
                  @Permission(alias = "storage", strings = { Manifest.permission.READ_EXTERNAL_STORAGE })
              }
          )
          public class MediaPermissionsPlugin extends Plugin {

              private boolean novo() { return Build.VERSION.SDK_INT >= 33; }

              private String st(String alias) {
                  PermissionState s = getPermissionState(alias);
                  return s == null ? "prompt" : s.toString();
              }

              private JSObject estado() {
                  JSObject o = new JSObject();
                  if (novo()) {
                      o.put("images", st("images"));
                      o.put("video", st("video"));
                      o.put("audio", st("audio"));
                  } else {
                      String s = st("storage");
                      o.put("images", s);
                      o.put("video", s);
                      o.put("audio", s);
                  }
                  return o;
              }

              @PluginMethod
              @Override
              public void checkPermissions(PluginCall call) { call.resolve(estado()); }

              @PluginMethod
              @Override
              public void requestPermissions(PluginCall call) {
                  List<String> al = new ArrayList<>();
                  if (novo()) {
                      JSArray arr = call.getArray("permissions");
                      try {
                          if (arr != null) for (int i = 0; i < arr.length(); i++) al.add(arr.getString(i));
                      } catch (Exception ignored) {}
                      if (al.isEmpty()) { al.add("images"); al.add("video"); al.add("audio"); }
                  } else {
                      al.add("storage");
                  }
                  requestPermissionForAliases(al.toArray(new String[0]), call, "depois");
              }

              @PermissionCallback
              private void depois(PluginCall call) { call.resolve(estado()); }

              @PluginMethod
              public void openSettings(PluginCall call) {
                  Intent i = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS);
                  i.setData(Uri.fromParts("package", getContext().getPackageName(), null));
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  getContext().startActivity(i);
                  call.resolve();
              }
          }
          EOF
          cat > "$D/MainActivity.java" <<'EOF'
          package com.minhaagenda.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(MediaPermissionsPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF
          grep -n "uses-permission" "$M" || true

      - name: Aplicar o ícone do aplicativo (Android)
        run: |
          command -v convert >/dev/null || sudo apt-get install -y imagemagick
          R=android/app/src/main/res
          if [ -f icon-512.png ]; then
            for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
              IFS=: read n a f <<< "$d"
              mkdir -p "$R/mipmap-$n"
              convert icon-512.png -resize ${a}x${a} "$R/mipmap-$n/ic_launcher.png"
              convert icon-512.png -resize ${a}x${a} "$R/mipmap-$n/ic_launcher_round.png"
              if [ -f android-icon-fg.png ]; then convert android-icon-fg.png -resize ${f}x${f} "$R/mipmap-$n/ic_launcher_foreground.png"; fi
            done
            if [ -f "$R/values/ic_launcher_background.xml" ]; then sed -i 's/#FFFFFF/#EAF2FF/I' "$R/values/ic_launcher_background.xml"; fi
          fi
          if [ -f notif-icon.png ]; then mkdir -p "$R/drawable"; cp notif-icon.png "$R/drawable/ic_stat_agenda.png"; fi

      - name: Copiar o app para o Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: JC-Organiza-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
