name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Preparar pasta www
        run: |
          mkdir -p www
          for f in index.html style.css script.js; do
            if [ -f "$f" ]; then cp "$f" www/; fi
          done
          test -f www/index.html || { echo "ERRO: faltou o index.html na raiz do repositorio."; exit 1; }
          grep -q "function render" www/index.html || { echo "ERRO: o index.html do repositorio esta errado (nao e o app completo). Envie o index.html correto."; exit 1; }
          ls -la www

      - name: Criar projeto Android
        run: npx cap add android

      - name: Configurar o Firebase (google-services.json)
        run: |
          # Sem o google-services.json o plugin de login do Firebase derruba o app assim que ele abre no celular.
          if [ -f google-services.json ] && grep -q '"package_name": *"com.minhaagenda.app"' google-services.json; then
            cp google-services.json android/app/google-services.json
            echo "google-services.json copiado para android/app"
            # Sem estas variaveis o plugin tenta carregar o login do Google sem as bibliotecas e o app fecha ao abrir.
            V=android/variables.gradle
            grep -q rgcfaIncludeGoogle "$V" || sed -i '/^ext *{/a\    rgcfaIncludeGoogle = true' "$V"
            grep -q androidxCredentialsVersion "$V" || sed -i "/^ext *{/a\    androidxCredentialsVersion = '1.3.0'" "$V"
            cat "$V"
          else
            if [ -f google-services.json ]; then
              echo "::warning::O google-services.json nao e do pacote com.minhaagenda.app. Login Firebase DESATIVADO neste APK."
            else
              echo "::warning::google-services.json nao encontrado na raiz do repositorio. Login Firebase DESATIVADO neste APK (o app abre normalmente)."
            fi
            npm uninstall @capacitor-firebase/authentication @capacitor-firebase/messaging
          fi

      - name: Assinatura fixa e versão (permite instalar por cima)
        env:
          RUN: ${{ github.run_number }}
        run: |
          G=android/app/build.gradle
          if [ ! -f jc-organiza.keystore ]; then
            echo "Criando jc-organiza.keystore a partir do workflow"
            echo "" | base64 -d > jc-organiza.keystore
          fi
          grep -q jc-organiza.keystore "$G" || sed -i '/^android {/a\    signingConfigs {\n        debug {\n            storeFile file("$rootDir/../jc-organiza.keystore")\n            storePassword "jcorganiza2026"\n            keyAlias "jc"\n            keyPassword "jcorganiza2026"\n        }\n    }' "$G"
          sed -i "s/versionCode [0-9]*/versionCode $RUN/; s/versionName \"[^\"]*\"/versionName \"1.3.$RUN\"/" "$G"
          grep -n "signingConfigs\|storeFile\|versionCode\|versionName" "$G"

      - name: Mostrar SHA-1 e SHA-256 da assinatura (para o Firebase)
        run: |
          keytool -list -v -keystore jc-organiza.keystore -alias jc -storepass jcorganiza2026 | grep -E "SHA1|SHA256"

      - name: Permitir salvar backup em Documentos (Android)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q WRITE_EXTERNAL_STORAGE "$M" || sed -i '/android.permission.INTERNET/a\    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />' "$M"
          grep -q requestLegacyExternalStorage "$M" || sed -i 's#<application#<application android:requestLegacyExternalStorage="true"#' "$M"
          grep -n "EXTERNAL_STORAGE\|requestLegacy" "$M" || true

      - name: Permissões de notificação e alarme (Android)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM RECEIVE_BOOT_COMPLETED VIBRATE WAKE_LOCK; do
            grep -q "android.permission.$P\"" "$M" || sed -i "/android.permission.INTERNET/a\    <uses-permission android:name=\"android.permission.$P\" />" "$M"
          done
          grep -n "uses-permission" "$M" || true

      - name: Permissões de fotos, vídeos e áudio + plugin nativo (Android)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in READ_MEDIA_IMAGES READ_MEDIA_VIDEO READ_MEDIA_AUDIO; do
            grep -q "android.permission.$P\"" "$M" || sed -i "/android.permission.INTERNET/a\    <uses-permission android:name=\"android.permission.$P\" />" "$M"
          done
          grep -q "android.permission.READ_EXTERNAL_STORAGE" "$M" || sed -i '/android.permission.INTERNET/a\    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />' "$M"
          D=android/app/src/main/java/com/minhaagenda/app
          mkdir -p "$D"
          cat > "$D/MediaPermissionsPlugin.java" <<'EOF'
          package com.minhaagenda.app;

          import android.Manifest;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;

          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          import java.util.ArrayList;
          import java.util.List;

          /** Pede permissão de fotos, vídeos e áudio (Android 13+) ou armazenamento (Android 12 e anterior). */
          @CapacitorPlugin(
              name = "MediaPermissions",
              permissions = {
                  @Permission(alias = "images", strings = { Manifest.permission.READ_MEDIA_IMAGES }),
                  @Permission(alias = "video", strings = { Manifest.permission.READ_MEDIA_VIDEO }),
                  @Permission(alias = "audio", strings = { Manifest.permission.READ_MEDIA_AUDIO }),
                  @Permission(alias = "storage", strings = { Manifest.permission.READ_EXTERNAL_STORAGE }),
                  @Permission(alias = "camera", strings = { Manifest.permission.CAMERA }),
                  @Permission(alias = "microphone", strings = { Manifest.permission.RECORD_AUDIO })
              }
          )
          public class MediaPermissionsPlugin extends Plugin {

              private boolean novo() { return Build.VERSION.SDK_INT >= 33; }

              private String st(String alias) {
                  PermissionState s = getPermissionState(alias);
                  return s == null ? "prompt" : s.toString();
              }

              private JSObject estado() {
                  JSObject o = new JSObject();
                  if (novo()) {
                      o.put("images", st("images"));
                      o.put("video", st("video"));
                      o.put("audio", st("audio"));
                  } else {
                      String s = st("storage");
                      o.put("images", s);
                      o.put("video", s);
                      o.put("audio", s);
                  }
                  o.put("camera", st("camera"));
                  o.put("microphone", st("microphone"));
                  return o;
              }

              @PluginMethod
              @Override
              public void checkPermissions(PluginCall call) { call.resolve(estado()); }

              @PluginMethod
              @Override
              public void requestPermissions(PluginCall call) {
                  List<String> pedidos = new ArrayList<>();
                  JSArray arr = call.getArray("permissions");
                  try {
                      if (arr != null) for (int i = 0; i < arr.length(); i++) pedidos.add(arr.getString(i));
                  } catch (Exception ignored) {}
                  if (pedidos.isEmpty()) { pedidos.add("images"); pedidos.add("video"); pedidos.add("audio"); pedidos.add("camera"); pedidos.add("microphone"); }
                  List<String> al = new ArrayList<>();
                  for (String p : pedidos) {
                      String a = p;
                      if (!novo() && (p.equals("images") || p.equals("video") || p.equals("audio"))) a = "storage";
                      if (!al.contains(a)) al.add(a);
                  }
                  requestPermissionForAliases(al.toArray(new String[0]), call, "depois");
              }

              @PermissionCallback
              private void depois(PluginCall call) { call.resolve(estado()); }

              @PluginMethod
              public void openSettings(PluginCall call) {
                  Intent i = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS);
                  i.setData(Uri.fromParts("package", getContext().getPackageName(), null));
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  getContext().startActivity(i);
                  call.resolve();
              }
          }
          EOF
          cat > "$D/MainActivity.java" <<'EOF'
          package com.minhaagenda.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(MediaPermissionsPlugin.class);
                  registerPlugin(ApkUpdatePlugin.class);
                  registerPlugin(RadioPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF
          grep -n "uses-permission" "$M" || true

      - name: Atualizador interno do app (plugin ApkUpdate) (Android)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.REQUEST_INSTALL_PACKAGES" "$M" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n</manifest>#' "$M"
          grep -q "android.permission.REQUEST_INSTALL_PACKAGES" "$M" || { echo "::error::Nao consegui declarar REQUEST_INSTALL_PACKAGES"; cat "$M"; exit 1; }
          # a pasta de cache precisa estar liberada no FileProvider (o instalador do Android le o APK de la)
          FP=android/app/src/main/res/xml/file_paths.xml
          if [ -f "$FP" ]; then
            grep -q "cache-path" "$FP" || sed -i 's#</paths>#    <cache-path name="jc_update" path="." />\n</paths>#' "$FP"
            cat "$FP"
          else
            echo "::warning::file_paths.xml nao encontrado; criando"
            mkdir -p android/app/src/main/res/xml
            printf '<?xml version="1.0" encoding="utf-8"?>\n<paths xmlns:android="http://schemas.android.com/apk/res/android">\n    <external-path name="my_images" path="." />\n    <cache-path name="my_cache_images" path="." />\n</paths>\n' > "$FP"
          fi
          D=android/app/src/main/java/com/minhaagenda/app
          mkdir -p "$D"
          cat > "$D/ApkUpdatePlugin.java" <<'EOF'
          package com.minhaagenda.app;

          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageInfo;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          @CapacitorPlugin(name = "ApkUpdate")
          public class ApkUpdatePlugin extends Plugin {

              private HttpURLConnection abrir(String u) throws Exception {
                  HttpURLConnection c = (HttpURLConnection) new URL(u).openConnection();
                  c.setInstanceFollowRedirects(true);
                  c.setConnectTimeout(15000);
                  c.setReadTimeout(30000);
                  c.setRequestProperty("User-Agent", "JC-Organiza");
                  return c;
              }

              private File arquivo() {
                  return new File(getContext().getCacheDir(), "JC-Organiza.apk");
              }

              @PluginMethod
              public void info(PluginCall call) {
                  try {
                      Context ctx = getContext();
                      PackageInfo pi = ctx.getPackageManager().getPackageInfo(ctx.getPackageName(), 0);
                      long code = Build.VERSION.SDK_INT >= 28 ? pi.getLongVersionCode() : pi.versionCode;
                      JSObject r = new JSObject();
                      r.put("versionCode", code);
                      r.put("versionName", pi.versionName);
                      call.resolve(r);
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }

              @PluginMethod
              public void fetchText(final PluginCall call) {
                  final String u = call.getString("url");
                  new Thread(() -> {
                      try {
                          HttpURLConnection c = abrir(u);
                          int cod = c.getResponseCode();
                          if (cod != 200) { call.reject("HTTP " + cod); return; }
                          InputStream in = c.getInputStream();
                          ByteArrayOutputStream o = new ByteArrayOutputStream();
                          byte[] b = new byte[4096];
                          int n;
                          while ((n = in.read(b)) > 0) o.write(b, 0, n);
                          in.close();
                          JSObject r = new JSObject();
                          r.put("text", o.toString("UTF-8"));
                          call.resolve(r);
                      } catch (Exception e) {
                          call.reject(String.valueOf(e.getMessage()));
                      }
                  }).start();
              }

              @PluginMethod
              public void download(final PluginCall call) {
                  final String u = call.getString("url");
                  new Thread(() -> {
                      try {
                          HttpURLConnection c = abrir(u);
                          int cod = c.getResponseCode();
                          if (cod != 200) { call.reject("HTTP " + cod + " (APK nao encontrado na Release)"); return; }
                          long total = c.getContentLengthLong();
                          File f = arquivo();
                          if (f.exists()) f.delete();
                          InputStream in = c.getInputStream();
                          FileOutputStream out = new FileOutputStream(f);
                          byte[] b = new byte[16384];
                          long lido = 0;
                          int n, ult = -1;
                          while ((n = in.read(b)) > 0) {
                              out.write(b, 0, n);
                              lido += n;
                              if (total > 0) {
                                  int pct = (int) (lido * 100 / total);
                                  if (pct != ult) {
                                      ult = pct;
                                      JSObject e = new JSObject();
                                      e.put("percent", pct);
                                      notifyListeners("progress", e);
                                  }
                              }
                          }
                          out.close();
                          in.close();
                          call.resolve();
                      } catch (Exception e) {
                          call.reject(String.valueOf(e.getMessage()));
                      }
                  }).start();
              }

              @PluginMethod
              public void install(PluginCall call) {
                  try {
                      Context ctx = getContext();
                      JSObject r = new JSObject();
                      if (Build.VERSION.SDK_INT >= 26 && !ctx.getPackageManager().canRequestPackageInstalls()) {
                          Intent p = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + ctx.getPackageName()));
                          p.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          ctx.startActivity(p);
                          r.put("permissao", false);
                          call.resolve(r);
                          return;
                      }
                      File f = arquivo();
                      if (!f.exists()) { call.reject("arquivo baixado nao encontrado"); return; }
                      Uri uri = FileProvider.getUriForFile(ctx, ctx.getPackageName() + ".fileprovider", f);
                      Intent i = new Intent(Intent.ACTION_VIEW);
                      i.setDataAndType(uri, "application/vnd.android.package-archive");
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                      ctx.startActivity(i);
                      r.put("permissao", true);
                      call.resolve(r);
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }
          }
          EOF
          test -s "$D/ApkUpdatePlugin.java" && echo "Plugin ApkUpdate criado."

      - name: Rádio em segundo plano - serviço nativo e plugin Radio (Android)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          # serviço em primeiro plano (tipo mediaPlayback) mantém a rádio tocando com a tela desligada
          for P in FOREGROUND_SERVICE FOREGROUND_SERVICE_MEDIA_PLAYBACK WAKE_LOCK; do
            grep -q "android.permission.$P\"" "$M" || sed -i "/android.permission.INTERNET/a\    <uses-permission android:name=\"android.permission.$P\" />" "$M"
          done
          grep -q "RadioService" "$M" || sed -i 's#</application>#    <service android:name=".RadioService" android:exported="false" android:foregroundServiceType="mediaPlayback" />\n    </application>#' "$M"
          grep -q "RadioService" "$M" || { echo "::error::Nao consegui declarar o servico da radio no AndroidManifest.xml"; cat "$M"; exit 1; }
          D=android/app/src/main/java/com/minhaagenda/app
          mkdir -p "$D"
          cat > "$D/RadioService.java" <<'EOF'
          package com.minhaagenda.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.pm.ServiceInfo;
          import android.media.AudioAttributes;
          import android.media.AudioManager;
          import android.media.MediaPlayer;
          import android.net.wifi.WifiManager;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;

          /**
           * Rádio em segundo plano: serviço em primeiro plano (com notificação e botões PAUSE/PLAY/STOP).
           * Continua tocando com a tela desligada e com o app fechado ou em segundo plano.
           */
          public class RadioService extends Service implements
                  MediaPlayer.OnPreparedListener,
                  MediaPlayer.OnErrorListener,
                  MediaPlayer.OnCompletionListener,
                  MediaPlayer.OnInfoListener,
                  AudioManager.OnAudioFocusChangeListener {

              public static final String ACTION_PLAY = "com.minhaagenda.app.radio.PLAY";
              public static final String ACTION_PAUSE = "com.minhaagenda.app.radio.PAUSE";
              public static final String ACTION_STOP = "com.minhaagenda.app.radio.STOP";

              public interface Listener {
                  void onState(String state);
              }

              public static volatile String state = "stopped";
              public static volatile boolean vivo = false;
              public static Listener listener;

              private static final int NOTIF_ID = 4711;
              private static final String CHANNEL_ID = "radio";
              private static final String URL_PADRAO = "https://live.hunter.fm/pop2k_stream?ag=mp3";

              private final Handler handler = new Handler(Looper.getMainLooper());
              private MediaPlayer player;
              private AudioManager audio;
              private PowerManager.WakeLock wakeLock;
              private WifiManager.WifiLock wifiLock;
              private String url = URL_PADRAO;
              private String titulo = "Rádio Pop 2K";
              private boolean querTocar = false;
              private boolean pausadoPeloFoco = false;
              private boolean noisyAtivo = false;
              private int tentativas = 0;

              private final Runnable reconectar = new Runnable() {
                  @Override
                  public void run() {
                      if (querTocar) preparar();
                  }
              };

              private final Runnable tempoEsgotado = new Runnable() {
                  @Override
                  public void run() {
                      if (querTocar && "loading".equals(state)) falha();
                  }
              };

              private final BroadcastReceiver noisy = new BroadcastReceiver() {
                  @Override
                  public void onReceive(Context context, Intent intent) {
                      if (intent != null && AudioManager.ACTION_AUDIO_BECOMING_NOISY.equals(intent.getAction())) {
                          pausar();
                      }
                  }
              };

              @Override
              public void onCreate() {
                  super.onCreate();
                  vivo = true;
                  audio = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                  criarCanal();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  String acao = intent != null ? intent.getAction() : null;
                  if (ACTION_PLAY.equals(acao)) {
                      String u = intent.getStringExtra("url");
                      String t = intent.getStringExtra("title");
                      if (u != null && u.length() > 0) url = u;
                      if (t != null && t.length() > 0) titulo = t;
                      iniciar();
                  } else if (ACTION_PAUSE.equals(acao)) {
                      pausar();
                  } else if (ACTION_STOP.equals(acao)) {
                      encerrar("stopped");
                  } else {
                      stopSelf();
                  }
                  return START_NOT_STICKY;
              }

              /* ---------- controle ---------- */

              private void iniciar() {
                  querTocar = true;
                  pausadoPeloFoco = false;
                  tentativas = 0;
                  mostrarNotificacao("loading");
                  setEstado("loading");
                  pedirFoco();
                  adquirirLocks();
                  registrarNoisy();
                  preparar();
              }

              private void preparar() {
                  liberarPlayer();
                  handler.removeCallbacks(tempoEsgotado);
                  try {
                      player = new MediaPlayer();
                      player.setAudioAttributes(new AudioAttributes.Builder()
                              .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                              .setUsage(AudioAttributes.USAGE_MEDIA)
                              .build());
                      player.setWakeMode(getApplicationContext(), PowerManager.PARTIAL_WAKE_LOCK);
                      player.setOnPreparedListener(this);
                      player.setOnErrorListener(this);
                      player.setOnCompletionListener(this);
                      player.setOnInfoListener(this);
                      player.setDataSource(url);
                      player.prepareAsync();
                      handler.postDelayed(tempoEsgotado, 25000);
                  } catch (Exception e) {
                      falha();
                  }
              }

              private void pausar() {
                  if (!querTocar && !"playing".equals(state) && !"loading".equals(state)) return;
                  querTocar = false;
                  handler.removeCallbacks(reconectar);
                  handler.removeCallbacks(tempoEsgotado);
                  liberarPlayer();
                  soltarLocks();
                  setEstado("paused");
                  mostrarNotificacao("paused");
              }

              private void falha() {
                  liberarPlayer();
                  handler.removeCallbacks(tempoEsgotado);
                  if (!querTocar) return;
                  if (tentativas < 5) {
                      tentativas++;
                      setEstado("loading");
                      mostrarNotificacao("loading");
                      handler.postDelayed(reconectar, 3000L * tentativas);
                  } else {
                      encerrar("error");
                  }
              }

              private void encerrar(String novoEstado) {
                  querTocar = false;
                  handler.removeCallbacksAndMessages(null);
                  liberarPlayer();
                  soltarLocks();
                  soltarFoco();
                  desregistrarNoisy();
                  setEstado(novoEstado);
                  try {
                      stopForeground(true);
                  } catch (Exception e) {
                      // ignora
                  }
                  stopSelf();
              }

              private void liberarPlayer() {
                  if (player != null) {
                      try {
                          player.setOnPreparedListener(null);
                          player.setOnErrorListener(null);
                          player.setOnCompletionListener(null);
                          player.setOnInfoListener(null);
                          player.reset();
                          player.release();
                      } catch (Exception e) {
                          // ignora
                      }
                      player = null;
                  }
              }

              private void setEstado(String s) {
                  state = s;
                  Listener l = listener;
                  if (l != null) {
                      try {
                          l.onState(s);
                      } catch (Exception e) {
                          // ignora
                      }
                  }
              }

              /* ---------- callbacks do MediaPlayer ---------- */

              @Override
              public void onPrepared(MediaPlayer mp) {
                  handler.removeCallbacks(tempoEsgotado);
                  if (!querTocar) return;
                  tentativas = 0;
                  try {
                      mp.start();
                      setEstado("playing");
                      mostrarNotificacao("playing");
                  } catch (Exception e) {
                      falha();
                  }
              }

              @Override
              public boolean onError(MediaPlayer mp, int what, int extra) {
                  falha();
                  return true;
              }

              @Override
              public void onCompletion(MediaPlayer mp) {
                  // uma rádio ao vivo não termina: se acabou, a conexão caiu
                  falha();
              }

              @Override
              public boolean onInfo(MediaPlayer mp, int what, int extra) {
                  if (!querTocar) return false;
                  if (what == MediaPlayer.MEDIA_INFO_BUFFERING_START) {
                      setEstado("loading");
                  } else if (what == MediaPlayer.MEDIA_INFO_BUFFERING_END) {
                      setEstado("playing");
                  }
                  return false;
              }

              /* ---------- foco de áudio (ligações, outros apps de música) ---------- */

              private void pedirFoco() {
                  try {
                      if (audio != null) {
                          audio.requestAudioFocus(this, AudioManager.STREAM_MUSIC, AudioManager.AUDIOFOCUS_GAIN);
                      }
                  } catch (Exception e) {
                      // ignora
                  }
              }

              private void soltarFoco() {
                  try {
                      if (audio != null) audio.abandonAudioFocus(this);
                  } catch (Exception e) {
                      // ignora
                  }
              }

              @Override
              public void onAudioFocusChange(int change) {
                  if (change == AudioManager.AUDIOFOCUS_LOSS) {
                      pausar();
                      soltarFoco();
                  } else if (change == AudioManager.AUDIOFOCUS_LOSS_TRANSIENT) {
                      if (querTocar) {
                          pausadoPeloFoco = true;
                          pausar();
                      }
                  } else if (change == AudioManager.AUDIOFOCUS_LOSS_TRANSIENT_CAN_DUCK) {
                      if (player != null) {
                          try {
                              player.setVolume(0.2f, 0.2f);
                          } catch (Exception e) {
                              // ignora
                          }
                      }
                  } else if (change == AudioManager.AUDIOFOCUS_GAIN) {
                      if (player != null) {
                          try {
                              player.setVolume(1f, 1f);
                          } catch (Exception e) {
                              // ignora
                          }
                      }
                      if (pausadoPeloFoco) {
                          pausadoPeloFoco = false;
                          iniciar();
                      }
                  }
              }

              /* ---------- fone desconectado ---------- */

              private void registrarNoisy() {
                  if (noisyAtivo) return;
                  try {
                      IntentFilter f = new IntentFilter(AudioManager.ACTION_AUDIO_BECOMING_NOISY);
                      if (Build.VERSION.SDK_INT >= 33) {
                          registerReceiver(noisy, f, Context.RECEIVER_NOT_EXPORTED);
                      } else {
                          registerReceiver(noisy, f);
                      }
                      noisyAtivo = true;
                  } catch (Exception e) {
                      // ignora
                  }
              }

              private void desregistrarNoisy() {
                  if (!noisyAtivo) return;
                  try {
                      unregisterReceiver(noisy);
                  } catch (Exception e) {
                      // ignora
                  }
                  noisyAtivo = false;
              }

              /* ---------- tela desligada: mantém CPU e Wi-Fi acordados enquanto toca ---------- */

              private void adquirirLocks() {
                  try {
                      if (wakeLock == null) {
                          PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                          wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "jcorganiza:radio");
                          wakeLock.setReferenceCounted(false);
                      }
                      if (!wakeLock.isHeld()) wakeLock.acquire();
                  } catch (Exception e) {
                      // ignora
                  }
                  try {
                      if (wifiLock == null) {
                          WifiManager wm = (WifiManager) getApplicationContext().getSystemService(Context.WIFI_SERVICE);
                          wifiLock = wm.createWifiLock(WifiManager.WIFI_MODE_FULL, "jcorganiza:radio");
                          wifiLock.setReferenceCounted(false);
                      }
                      if (!wifiLock.isHeld()) wifiLock.acquire();
                  } catch (Exception e) {
                      // ignora
                  }
              }

              private void soltarLocks() {
                  try {
                      if (wakeLock != null && wakeLock.isHeld()) wakeLock.release();
                  } catch (Exception e) {
                      // ignora
                  }
                  try {
                      if (wifiLock != null && wifiLock.isHeld()) wifiLock.release();
                  } catch (Exception e) {
                      // ignora
                  }
              }

              /* ---------- notificação com PAUSE / PLAY / STOP ---------- */

              private void criarCanal() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel(CHANNEL_ID, "Rádio", NotificationManager.IMPORTANCE_LOW);
                      ch.setDescription("Controles da rádio");
                      ch.setShowBadge(false);
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) nm.createNotificationChannel(ch);
                  }
              }

              private int flagsPi() {
                  if (Build.VERSION.SDK_INT >= 23) {
                      return PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE;
                  }
                  return PendingIntent.FLAG_UPDATE_CURRENT;
              }

              private PendingIntent acaoPi(String acao, int codigo) {
                  Intent i = new Intent(this, RadioService.class);
                  i.setAction(acao);
                  return PendingIntent.getService(this, codigo, i, flagsPi());
              }

              private Notification construir(String st) {
                  Notification.Builder b;
                  if (Build.VERSION.SDK_INT >= 26) {
                      b = new Notification.Builder(this, CHANNEL_ID);
                  } else {
                      b = new Notification.Builder(this);
                  }
                  int icone = getResources().getIdentifier("ic_stat_agenda", "drawable", getPackageName());
                  if (icone == 0) icone = android.R.drawable.ic_media_play;
                  String texto = "playing".equals(st) ? "Tocando ao vivo" : ("paused".equals(st) ? "Pausada" : "Conectando…");
                  b.setSmallIcon(icone);
                  b.setContentTitle(titulo);
                  b.setContentText(texto);
                  b.setOnlyAlertOnce(true);
                  b.setShowWhen(false);
                  b.setOngoing(true);
                  b.setCategory(Notification.CATEGORY_TRANSPORT);
                  b.setVisibility(Notification.VISIBILITY_PUBLIC);
                  Intent abrir = getPackageManager().getLaunchIntentForPackage(getPackageName());
                  if (abrir != null) {
                      b.setContentIntent(PendingIntent.getActivity(this, 0, abrir, flagsPi()));
                  }
                  if ("paused".equals(st)) {
                      b.addAction(android.R.drawable.ic_media_play, "PLAY", acaoPi(ACTION_PLAY, 2));
                  } else {
                      b.addAction(android.R.drawable.ic_media_pause, "PAUSE", acaoPi(ACTION_PAUSE, 1));
                  }
                  b.addAction(android.R.drawable.ic_menu_close_clear_cancel, "STOP", acaoPi(ACTION_STOP, 3));
                  b.setStyle(new Notification.MediaStyle().setShowActionsInCompactView(0, 1));
                  return b.build();
              }

              private void mostrarNotificacao(String st) {
                  Notification n = construir(st);
                  try {
                      if (Build.VERSION.SDK_INT >= 29) {
                          startForeground(NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                      } else {
                          startForeground(NOTIF_ID, n);
                      }
                  } catch (Exception e) {
                      try {
                          NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm != null) nm.notify(NOTIF_ID, n);
                      } catch (Exception e2) {
                          // ignora
                      }
                  }
              }

              @Override
              public void onDestroy() {
                  querTocar = false;
                  handler.removeCallbacksAndMessages(null);
                  liberarPlayer();
                  soltarLocks();
                  soltarFoco();
                  desregistrarNoisy();
                  if (!"error".equals(state)) setEstado("stopped");
                  vivo = false;
                  super.onDestroy();
              }
          }
          EOF
          cat > "$D/RadioPlugin.java" <<'EOF'
          package com.minhaagenda.app;

          import android.content.Intent;

          import androidx.core.content.ContextCompat;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          /** Ponte entre a página (JS) e o serviço da rádio: play, pause, stop, status e o evento "state". */
          @CapacitorPlugin(name = "Radio")
          public class RadioPlugin extends Plugin {

              @Override
              public void load() {
                  RadioService.listener = new RadioService.Listener() {
                      @Override
                      public void onState(String s) {
                          JSObject o = new JSObject();
                          o.put("state", s);
                          RadioPlugin.this.notifyListeners("state", o);
                      }
                  };
              }

              @PluginMethod
              public void play(PluginCall call) {
                  try {
                      Intent i = new Intent(getContext(), RadioService.class);
                      i.setAction(RadioService.ACTION_PLAY);
                      i.putExtra("url", call.getString("url", "https://live.hunter.fm/pop2k_stream?ag=mp3"));
                      i.putExtra("title", call.getString("title", "Rádio Pop 2K"));
                      ContextCompat.startForegroundService(getContext(), i);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }

              @PluginMethod
              public void pause(PluginCall call) {
                  enviar(RadioService.ACTION_PAUSE, call);
              }

              @PluginMethod
              public void stop(PluginCall call) {
                  enviar(RadioService.ACTION_STOP, call);
              }

              @PluginMethod
              public void status(PluginCall call) {
                  JSObject o = new JSObject();
                  o.put("state", RadioService.vivo ? RadioService.state : "stopped");
                  call.resolve(o);
              }

              private void enviar(String acao, PluginCall call) {
                  try {
                      if (RadioService.vivo) {
                          Intent i = new Intent(getContext(), RadioService.class);
                          i.setAction(acao);
                          getContext().startService(i);
                      }
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }
          }
          EOF
          test -s "$D/RadioService.java" && test -s "$D/RadioPlugin.java" && echo "Plugin Radio criado."
          grep -n "RadioService\|FOREGROUND_SERVICE" "$M" || true

      - name: Permissão da câmera (Android)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.CAMERA\"" "$M" || sed -i '/android.permission.INTERNET/a\    <uses-permission android:name="android.permission.CAMERA" />' "$M"
          grep -q "android.hardware.camera\"" "$M" || sed -i '/android.permission.INTERNET/a\    <uses-feature android:name="android.hardware.camera" android:required="false" />' "$M"
          grep -n "CAMERA\|hardware.camera" "$M" || true

      - name: Permissão do microfone (comando de voz) (Android)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          # insere antes de </manifest> (funciona mesmo se o manifesto não tiver a linha do INTERNET)
          grep -q 'android.permission.RECORD_AUDIO' "$M" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n</manifest>#' "$M"
          grep -q 'android.permission.RECORD_AUDIO' "$M" || { echo "::error::Nao consegui declarar a permissao do microfone no AndroidManifest.xml"; cat "$M"; exit 1; }
          grep -q "android.hardware.microphone\"" "$M" || sed -i '/android.permission.INTERNET/a\    <uses-feature android:name="android.hardware.microphone" android:required="false" />' "$M"
          # Android 11+: sem isto o app não enxerga o serviço de reconhecimento de voz do celular
          grep -q "android.speech.RecognitionService" "$M" || sed -i 's#<application#<queries><intent><action android:name="android.speech.RecognitionService" /></intent></queries>\n    <application#' "$M"
          grep -n "RECORD_AUDIO\|hardware.microphone" "$M" || true

      - name: Aplicar o ícone do aplicativo (Android)
        run: |
          command -v convert >/dev/null || sudo apt-get install -y imagemagick
          R=android/app/src/main/res
          if [ -f icon-512.png ]; then
            for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
              IFS=: read n a f <<< "$d"
              mkdir -p "$R/mipmap-$n"
              convert icon-512.png -resize ${a}x${a} "$R/mipmap-$n/ic_launcher.png"
              convert icon-512.png -resize ${a}x${a} "$R/mipmap-$n/ic_launcher_round.png"
              if [ -f android-icon-fg.png ]; then convert android-icon-fg.png -resize ${f}x${f} "$R/mipmap-$n/ic_launcher_foreground.png"; fi
            done
            if [ -f "$R/values/ic_launcher_background.xml" ]; then sed -i 's/#FFFFFF/#EAF2FF/I' "$R/values/ic_launcher_background.xml"; fi
          fi
          if [ -f notif-icon.png ]; then mkdir -p "$R/drawable"; cp notif-icon.png "$R/drawable/ic_stat_agenda.png"; fi

      - name: Ícone e cor das notificações de atualização (push) (Android)
        run: |
          # Usa o mesmo ícone das notificações locais (notif-icon.png -> drawable/ic_stat_agenda).
          M=android/app/src/main/AndroidManifest.xml
          R=android/app/src/main/res
          if ls "$R"/drawable/ic_stat_agenda.* >/dev/null 2>&1; then
            mkdir -p "$R/values"
            echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="jc_notif_color">#0F7B8A</color></resources>' > "$R/values/jc_notif_color.xml"
            grep -q default_notification_icon "$M" || sed -i 's#</application>#    <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_agenda" />\n        <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/jc_notif_color" />\n    </application>#' "$M"
            grep -n "default_notification" "$M" || true
          else
            echo "::warning::notif-icon.png nao encontrado: notificacoes ficam com o icone padrao do Android."
          fi

      - name: Copiar o app para o Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Conferir permissões do APK (microfone)
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt 2>/dev/null | sort -V | tail -1)
          if [ -n "$AAPT" ]; then
            "$AAPT" dump permissions "$APK" | tee perm.txt
          else
            echo "aapt nao encontrado; lendo o manifesto do APK direto"
            unzip -p "$APK" AndroidManifest.xml | strings -el | tee perm.txt
          fi
          if grep -q 'RECORD_AUDIO' perm.txt; then
            echo "OK: o APK declara a permissao do microfone."
          elif [ -s perm.txt ]; then
            echo "::error::O APK ficou SEM a permissao do microfone (RECORD_AUDIO)."; exit 1
          else
            echo "::warning::Nao consegui ler as permissoes do APK; conferencia ignorada."
          fi

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: JC-Organiza-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar o APK na Release (atualização dentro do app)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk JC-Organiza.apk
          echo "{\"versionCode\":$RUN,\"versionName\":\"1.3.$RUN\"}" > version.json
          cat version.json
          gh release create "v1.3.$RUN" JC-Organiza.apk version.json \
            --title "JC ORGANIZA 1.3.$RUN" \
            --notes "Versão 1.3.$RUN. Os aparelhos com o app já instalado atualizam sozinhos por dentro do aplicativo." \
            --latest
